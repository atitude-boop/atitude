  const camVisible = RECORDER && !!stream && !cam.classList.contains('ghost');
  PR.classList.toggle('shadowed', camVisible);
  cam.style.objectFit = P.camFit==='contain' ? 'contain' : 'cover';
  updateDim();
  layout();
}
function layout(){
  const h = PR.clientHeight; if(!h) return;
  const g = parseFloat(P.guide);
  ptext.style.paddingTop = (g*h)+'px';
  ptext.style.paddingBottom = ((1-g)*h)+'px';
  maxPos = Math.max(0, ptext.scrollHeight - h);
  segTops = segEls.map(e=>e.offsetTop);
  guide.className = P.cue==='nenhum' ? '' : P.cue;
  guide.style.top = ((P.mirrorMode==='v'?1-g:g)*h)+'px';
  const bandH = P.size*P.lh;
  guide.style.height = P.cue==='faixa' ? bandH+'px' : '0';
  guide.style.marginTop = P.cue==='faixa' ? (-bandH*0.12)+'px' : '0';
  pos = Math.min(pos, maxPos); vpos = Math.min(vpos, maxPos); draw();
}
function draw(){
  ptext.style.transform = `translate3d(0,${-pos}px,0)`;
  const v = pps();
  $('cE').textContent = 'E:'+hms(elapsed);
  $('cR').textContent = 'R:'+hms((maxPos-pos)/v);
  $('cBar').style.width = (maxPos ? pos/maxPos*100 : 0)+'%';
}
function currentSeg(){
  const y = pos + parseFloat(P.guide)*PR.clientHeight + 4;
  let lo=0, hi=segTops.length-1, ans=0;
  while(lo<=hi){ const m=(lo+hi)>>1; if(segTops[m] <= y){ ans=m; lo=m+1; } else hi=m-1; }
  return segEls.length ? +segEls[ans].dataset.i : -1;
}
function trackCaption(){
  if(!P.captions) return;
  const i = currentSeg();
  if(i>=0 && i!==lastSeg){ lastSeg=i; cues.push({i, t:capTime()}); }
}
function capTime(){ return recording ? (performance.now()-recStart)/1000 : elapsed; }

/* ---- rolagem ---- */
function tick(t){
  if(!playing) return;
  const dt = last ? Math.min(0.1,(t-last)/1000) : 0; last = t;
  elapsed += dt;
  vpos += pps()*dt*(reverse?-1:1);
  if(vpos >= maxPos){ vpos = maxPos; }
  if(vpos <= 0 && reverse){ vpos = 0; }
  if(P.mode==='page'){
    const page = PR.clientHeight*0.75;
    const target = Math.min(maxPos, Math.floor(vpos/page)*page);
    if(target !== pos){ ptext.classList.add('anim'); pos = target; setTimeout(()=>ptext.classList.remove('anim'), 480); }
  } else pos = vpos;
  draw(); trackCaption();
  if((!reverse && vpos >= maxPos) || (reverse && vpos <= 0)){
    if(P.mode==='page'){ pos = vpos; draw(); }
    pause();
    if(recording && (P.recStopEnd || P.recSync) && !reverse) setTimeout(()=>{ if(recording) stopRecording(); }, 1500);
    return;
  }
  raf = requestAnimationFrame(tick);
}
function updateDim(){
  const vis = RECORDER && !!stream && !cam.classList.contains('ghost');
  const active = playing || recording;
  $('camdim').style.opacity = vis ? (active ? P.camDim : Math.max(P.camDim, P.camDimIdle)) : 0;
}
function setGo(){ updateDim(); $('pgo').textContent = playing ? 'PAUSAR' : (pos>0 && pos<maxPos ? 'CONTINUAR' : 'INICIAR'); }
function play(){
  if(counting) return;
  if(!reverse && pos >= maxPos){ pos = vpos = 0; elapsed = 0; cues=[]; lastSeg=-1; }
  vpos = pos; playing = true; last = 0; setGo();
  cancelAnimationFrame(raf); raf = requestAnimationFrame(tick);
  scheduleHide();
}
function pause(){ playing=false; cancelAnimationFrame(raf); setGo(); showUI(); }
function toggle(){
  if(RECORDER && P.recSync){
    if(playing || recording){ if(recording) stopRecording(); else pause(); }
    else startRecording(true);
    return;
  }
  playing ? pause() : startWithCount(play);
}
function startWithCount(after){
  const n0 = +P.countdown || 0;
  if(!n0){ after(); return; }
  counting = true; const c = $('count'); let n = n0;
  c.textContent = n; c.classList.add('show'); PR.classList.add('hidden-ui');
  clearInterval(countIv);
  countIv = setInterval(()=>{ n--; if(n>0){ c.textContent=n; return; } clearInterval(countIv); c.classList.remove('show'); counting=false; after(); }, 1000);
}
function showUI(){ PR.classList.remove('hidden-ui'); clearTimeout(hideTimer); if(playing) scheduleHide(); }
function scheduleHide(){ clearTimeout(hideTimer); if(!P.hideCtl) return; hideTimer = setTimeout(()=>{ if(playing) PR.classList.add('hidden-ui'); }, 2500); }
function ptip(msg){ const t=$('ptip'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1000); }
function nudge(d){ pos = vpos = Math.min(maxPos, Math.max(0,pos+d)); draw(); setGo(); }
function step(dir){ nudge(dir * (P.mode==='page' ? PR.clientHeight*0.75 : P.size*P.lh*3)); }
function setSpeed(v){ if(P.timed) return ptip('Rolagem cronometrada ligada'); P.speed=Math.min(20,Math.max(1,v)); psave('speed'); $('pspeed').value=P.speed; $('pspeedV').textContent=P.speed; draw(); }

const stop = fn => e=>{ e.stopPropagation(); fn(e); };
$('pBackList').onclick = stop(()=>{ closePrompter(); $('edBack').click(); });
$('pEdit').onclick = stop(()=>{ closePrompter(); if(S.curKind==='mine') setTimeout(()=>$('edText').focus(),50); });
$('ptitle').onclick = stop(async ()=>{

$('pgo').onclick = stop(toggle);
$('pDir').onclick = stop(()=>{ reverse=!reverse; $('pDir').classList.toggle('on', reverse); ptip(reverse?'Rolando para trás':'Rolando para frente'); });
$('pStart').onclick = stop(()=>{ pause(); pos=vpos=0; elapsed=0; cues=[]; lastSeg=-1; draw(); setGo(); });
$('pEnd').onclick = stop(()=>{ pause(); pos=vpos=maxPos; draw(); setGo(); });
$('pSet').onclick = stop(()=>{ pause(); settingsSheet(); });
$('pCam').onclick = stop(()=>{ pause(); videoSheet(); });
['ptop','pbottom'].forEach(id=>$(id).addEventListener('pointerdown', e=>{ if(e.target.closest('button,input,#pclock')) e.stopPropagation(); }));

// toque duplo no relógio zera o tempo
let lastClockTap = 0;
$('pclock').addEventListener('pointerup', e=>{
  e.stopPropagation();
  const n = Date.now();
  if(n - lastClockTap < 350){ elapsed = 0; draw(); ptip('Relógio zerado'); }
  lastClockTap = n;
});

let drag=null;
const pts = new Map();
const pdist = ()=>{ const a=[...pts.values()]; return Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y); };
PR.addEventListener('pointerdown', e=>{
  if(counting || e.target.closest('.sheetwrap')) return;
  pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pts.size===2 && zoomCaps){
    // pinça com dois dedos = zoom da câmera
    if(drag && drag.moved){ pos = vpos = drag.start; draw(); }
    drag = null; pinch = {d0:pdist(), z0:curZoom}; return;
  }
  if(pts.size > 1) return;
  drag={y:e.clientY,start:pos,moved:false,was:playing}; try{PR.setPointerCapture(e.pointerId);}catch(_){}
});
PR.addEventListener('pointermove', e=>{
  if(pts.has(e.pointerId)) pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pinch){ if(pts.size===2){ applyZoom(pinch.z0 * pdist() / pinch.d0); ptip('Zoom ' + fmtZ(curZoom)); } return; }
  if(!drag) return; let dy = e.clientY-drag.y;
  if(Math.abs(dy)>6){
    if(!drag.moved){ drag.moved=true; if(playing){ playing=false; cancelAnimationFrame(raf);} }
    if(P.mirrorMode==='v') dy=-dy;
    pos = vpos = Math.min(maxPos,Math.max(0,drag.start-dy)); draw();
  }
});
PR.addEventListener('pointercancel', e=>{ pts.delete(e.pointerId); if(pts.size<2) pinch=null; drag=null; });
PR.addEventListener('pointerup', e=>{
  pts.delete(e.pointerId);
  if(pinch){ if(pts.size<2) pinch=null; return; }
  if(!drag) return; const d=drag; drag=null;
  if(d.moved){ if(d.was && !P.dragStops) play(); else { setGo(); showUI(); } return; }
  if(PR.classList.contains('hidden-ui')){ showUI(); return; }
  if(P.tapScroll){ step(1); return; }
  toggle();
});
PR.addEventListener('wheel', e=>{ e.preventDefault(); pos=vpos=Math.min(maxPos,Math.max(0,pos+e.deltaY)); draw(); }, {passive:false});
document.addEventListener('keydown', e=>{
  if(!PR.classList.contains('show') || document.querySelector('.sheetwrap')) return;
  const k=e.key;
  if(k===' '||k==='Enter'||k==='MediaPlayPause'){ e.preventDefault(); toggle(); }
  else if(k==='ArrowDown'||k==='PageDown'||k==='ArrowRight'&&e.shiftKey){ e.preventDefault(); step(1); }
  else if(k==='ArrowUp'||k==='PageUp'){ e.preventDefault(); step(-1); }
  else if(k==='ArrowRight'||k==='+'||k==='='){ setSpeed(P.speed+1); ptip('Velocidade '+P.speed); }
  else if(k==='ArrowLeft'||k==='-'){ setSpeed(P.speed-1); ptip('Velocidade '+P.speed); }
  else if(k==='r'||k==='R'){ if(RECORDER) $('recBtn').click(); }
  else if(k==='Escape'){ closePrompter(); }
});
window.addEventListener('resize', ()=>{ if(PR.classList.contains('show')){ const r=pos/(maxPos||1); layout(); pos=vpos=r*maxPos; draw(); } });

/* =====================================================
   LEGENDAS (.srt)
   ===================================================== */
function srtTime(s){
  const ms = Math.max(0, Math.round(s*1000));
  const h = Math.floor(ms/3600000), m = Math.floor(ms/60000)%60, sec = Math.floor(ms/1000)%60, r = ms%1000;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')},${String(r).padStart(3,'0')}`;
}
function buildSRT(list, endT){
  const cl = []; list.forEach(c=>{ if(!cl.length || cl[cl.length-1].i!==c.i) cl.push(c); });
  const out = []; let n=1;
  cl.forEach((c,k)=>{
    const txt = (segs[c.i] && segs[c.i].t || '').trim(); if(!txt) return;
    const st = c.t, en = cl[k+1] ? cl[k+1].t : Math.max(c.t + 1.5, endT||0);
    if(en - st < 0.15) return;
    out.push(`${n++}\n${srtTime(st)} --> ${srtTime(en)}\n${txt}\n`);
  });
  return out.join('\n');
}
function saveCaption(srt, title){
  if(!srt) return;
  const list = LS.get('captions', []);
  list.unshift({title:title||'Roteiro', date:Date.now(), srt});
  LS.set('captions', list.slice(0,8));
}

/* =====================================================
   CÂMERA E GRAVAÇÃO (versão gravadora)
   ===================================================== */
let stream=null, recorder=null, recording=false, recStart=0, recChunks=[], recTimer=0, recMime='';
let camKey = '', camParkTimer = 0;
function streamLive(){ return !!stream && stream.getVideoTracks().some(t=>t.readyState==='live'); }
async function startCamera(force){
  if(!RECORDER) return;
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) || (!NATIVE && (!window.isSecureContext || location.protocol==='file:'))){ placeHelp(); return false; }
  clearTimeout(camParkTimer);
  const R = {auto:[1920,1080], '2160':[3840,2160], '1080':[1920,1080], '720':[1280,720], '480':[854,480]}[P.quality] || [1920,1080];
  const v = {width:{ideal:R[0]}, height:{ideal:R[1]}};
  if(P.camDevice) v.deviceId = {exact:P.camDevice}; else v.facingMode = P.camFacing;
  const a = {echoCancellation:true, noiseSuppression:true};
  if(P.micDevice) a.deviceId = {exact:P.micDevice};
  const vKey = [P.camDevice, P.camDevice?'':P.camFacing, P.quality].join('|'), aKey = P.micDevice;
  const key = vKey + '#' + aKey;

  // Reaproveita a câmera já autorizada: não pede permissão de novo.
  if(!force && streamLive() && key === camKey){ attachStream(); return true; }

  try{
    const audioLive = !!stream && stream.getAudioTracks().some(t=>t.readyState==='live');
    if(streamLive() || audioLive){
      const [oldV, oldA] = camKey.split('#');
      if(audioLive && oldA === aKey){
        // troca só a imagem (lente/câmera/resolução) e mantém o microfone
        stream.getVideoTracks().forEach(t=>t.stop());
        const nv = await getMedia({video:v});
        stream = new MediaStream([...nv.getVideoTracks(), ...stream.getAudioTracks()]);
      } else {
        stream.getTracks().forEach(t=>t.stop());
        stream = await getMedia({video:v, audio:a});
      }
    } else {
      stream = await getMedia({video:v, audio:a});
    }
  }catch(e){
    if(stream) stream.getTracks().forEach(t=>t.stop());
    stream = null; camKey = '';
    if(e && (e.name==='NotAllowedError' || e.name==='SecurityError')) (inEmbedded() ? placeHelp(e.name) : permissionHelp(e.name));
    else toast('Não foi possível abrir a câmera. Feche outros apps que estejam usando a câmera e tente de novo.', 4500);
    return false;
  }
  camKey = key;
  attachStream();
  return true;
}
async function getMedia(c){
  try{ return await navigator.mediaDevices.getUserMedia(c); }
  catch(e1){
    // câmera/microfone escolhido não existe mais: volta para o padrão
    if(e1 && (e1.name==='OverconstrainedError' || e1.name==='NotFoundError') && (P.camDevice||P.micDevice)){
      P.camDevice=''; P.micDevice=''; psave('camDevice'); psave('micDevice');
      const c2 = {};
      if(c.video) c2.video = {facingMode:P.camFacing, width:c.video.width, height:c.video.height};
      if(c.audio) c2.audio = {echoCancellation:true, noiseSuppression:true};
      return await navigator.mediaDevices.getUserMedia(c2);
    }
    throw e1;
  }
}
async function attachStream(){
  if(cam.srcObject !== stream) cam.srcObject = stream;
  cam.classList.remove('hide');
  const tr = stream.getVideoTracks()[0];
  let st = {}; try{ st = tr.getSettings(); }catch(e){}
  const front = st.facingMode ? st.facingMode==='user' : (/front|frontal|facetime|webcam/i.test(tr.label||'') || (!P.camDevice && P.camFacing==='user'));
  cam.classList.toggle('mirror', front);
  isFront = front;
  try{ await cam.play(); }
  catch(e){
    // alguns iPhones só mostram a imagem depois de um toque na tela
    const retry = ()=>{ cam.play().catch(()=>{}); PR.removeEventListener('pointerdown', retry, true); };
    PR.addEventListener('pointerdown', retry, true);
  }
  applyStyle(); paintEye(); setupZoom();
}
// Ao sair do teleprompter a câmera fica "estacionada" por alguns minutos,
// para não pedir autorização de novo ao voltar.
function parkCamera(){
  cam.classList.add('hide'); PR.classList.remove('shadowed');
  $('camdim').style.opacity = 0; $('zoombar').classList.add('hide');
  clearTimeout(camParkTimer);
  camParkTimer = setTimeout(()=>{ if(!PR.classList.contains('show')) stopCamera(); }, 5*60*1000);
}
function inEmbedded(){
  if(NATIVE) return false;
  let framed = false; try{ framed = window.self !== window.top; }catch(e){ framed = true; }
  const ua = navigator.userAgent;
  const iosNotSafari = /iPhone|iPad/.test(ua) && !/Safari\//.test(ua) && !window.navigator.standalone;
  return framed || iosNotSafari || location.protocol==='file:';
}
/** Grava com a câmera do próprio iPhone (funciona dentro do Claude e de qualquer app)
 *  e já abre o editor com o roteiro para as legendas. */
async function nativeCapture(){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'video/*'; inp.setAttribute('capture', P.camFacing==='environment' ? 'environment' : 'user');
  inp.style.display = 'none'; document.body.appendChild(inp);
  const f = await new Promise(res=>{ inp.onchange = ()=>res(inp.files && inp.files[0] || null); inp.click(); });

  const txt = S.cur ? ($('edText') ? $('edText').value : S.cur.text) : '';
  const nm = S.cur ? (S.cur.name || 'video') : 'video';
  if(S.screen === 'prompter' && typeof closePrompter === 'function'){ try{ closePrompter(); }catch(e){} }

}

function permissionHelp(err){
  if(NATIVE){
    const w = sheet(`<div class="grab"></div><h3>Liberar câmera e microfone</h3>

/* ---------- zoom e troca de câmera ---------- */
let isFront = true, zoomCaps = null, curZoom = 1, zoomChips = [], pinch = null, zoomRaf = 0, pendingZoom = null;
const fmtZ = z => z < 1 ? '.' + Math.round(z*10) : (Math.abs(z - Math.round(z)) < 0.05 ? Math.round(z) : z.toFixed(1)) + '×';
async function setupZoom(){
  const bar = $('zoombar'); zoomCaps = null; zoomChips = [];
  if(!stream){ bar.classList.add('hide'); return; }
  const tr = stream.getVideoTracks()[0];
  let caps = {}, st = {};
  try{ caps = tr.getCapabilities ? tr.getCapabilities() : {}; }catch(e){}
  try{ st = tr.getSettings(); }catch(e){}
  if(caps.zoom && caps.zoom.max > caps.zoom.min){
    zoomCaps = caps.zoom; curZoom = st.zoom || Math.max(1, caps.zoom.min);
    const mx = Math.min(caps.zoom.max, 10);
    [0.5,1,2,3,5,10].forEach(z=>{ if(z >= caps.zoom.min - 0.01 && z <= mx + 0.01) zoomChips.push({z}); });
    if(caps.zoom.min < 1 && !zoomChips.some(c=>Math.abs(c.z-caps.zoom.min) < 0.05)) zoomChips.unshift({z:caps.zoom.min});
  } else if(!isFront){
    // sem zoom pelo navegador: troca de lente (ultra-angular, principal, teleobjetiva)
    let devs = [];
    try{ devs = (await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput' && d.label); }catch(e){}
    const back = devs.filter(d=>!/front|frontal|facetime/i.test(d.label));
    const uw = back.find(d=>/ultra/i.test(d.label));
    const tele = back.find(d=>/tele/i.test(d.label));
    const wide = back.find(d=>!/ultra|tele|dual|dupla|triple|tripla/i.test(d.label));
    if(uw) zoomChips.push({dev:uw.deviceId, label:'.5'});
    if(wide) zoomChips.push({dev:wide.deviceId, label:'1×'});
    if(tele) zoomChips.push({dev:tele.deviceId, label:'Tele'});
    if(zoomChips.length < 2) zoomChips = [];
    zoomChips.forEach(c=>c.cur = (st.deviceId === c.dev));
  }
  paintZoom();
}
function paintZoom(){
  const bar = $('zoombar');
  if(!zoomChips.length){ bar.classList.add('hide'); return; }
  bar.classList.remove('hide');
  let near = -1;
  if(zoomCaps){ let best = 1e9; zoomChips.forEach((c,i)=>{ const d = Math.abs(c.z - curZoom); if(d < best){ best = d; near = i; } }); }
  bar.innerHTML = zoomChips.map((c,i)=>{
    const on = zoomCaps ? i===near : c.cur;
    const label = zoomCaps ? (on ? fmtZ(curZoom) : fmtZ(c.z).replace('×','')) : c.label;
    return `<button class="zc ${on?'on':''}" data-zi="${i}">${label}</button>`;
  }).join('');
}
function applyZoom(z){
  if(!zoomCaps || !stream) return;
  curZoom = Math.min(zoomCaps.max, Math.max(zoomCaps.min, z));
  pendingZoom = curZoom;
  if(zoomRaf) return;
  zoomRaf = requestAnimationFrame(async ()=>{
    zoomRaf = 0; const z2 = pendingZoom;
    try{ await stream.getVideoTracks()[0].applyConstraints({advanced:[{zoom:z2}]}); }catch(e){}
    paintZoom();
  });
}

});

function pickMime(){
  const c = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];

}

async function startRecording(withScroll){
  if(recording || counting) return;

  const mime = pickMime();
  if(mime===null){ toast('Este navegador não grava vídeo. Use o Safari atualizado.'); return; }
  const begin = ()=>{
    try{
      recorder = mime ? new MediaRecorder(stream, {mimeType:mime, videoBitsPerSecond: ({'2160':20000000,'1080':8000000,'auto':8000000,'720':4500000,'480':2000000})[P.quality]||6000000}) : new MediaRecorder(stream);
    }catch(e){ toast('Não foi possível iniciar a gravação.'); return; }
    recMime = recorder.mimeType || mime || 'video/mp4';
    recChunks = [];
    recorder.ondataavailable = ev=>{ if(ev.data && ev.data.size) recChunks.push(ev.data); };
    recorder.onstop = onRecordingStop;
    recorder.start(1000);

}
let discardNext = false, lastRecDur = 0;
function stopRecording(discard){

function onRecordingStop(){
  if(discardNext){ discardNext=false; recChunks=[]; return; }

  const blob = new Blob(recChunks, {type});

function safeName(){ return ($('ptitleT').textContent||'video').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w-]+/g,'-').replace(/^-|-$/g,'').slice(0,40) || 'video'; }
const nativeCb = {};
window.__nativeDone = (id, ok, msg)=>{ const f = nativeCb[id]; if(f) f(ok, msg); };
function b64(buf){
  const u = new Uint8Array(buf); let s = '';
  for(let i=0;i<u.length;i+=0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i+0x8000));
  return btoa(s);
}
// Envia o arquivo para o app nativo em pedaços (base64) e pede para salvar no Fotos ou abrir o compartilhar.
function nativeSend(blob, name, mode){
  return new Promise(async res=>{
    const h = window.webkit.messageHandlers.native, id = uid();
    nativeCb[id] = (ok, msg)=>{
      delete nativeCb[id];
      if(mode==='photos') toast(ok ? 'Vídeo salvo no app Fotos.' : (msg || 'Não foi possível salvar no Fotos.'), 3000);
      res(ok);
    };
    if(blob.size > 4e6) toast('Preparando o arquivo…', 1500);
    h.postMessage({action:'begin', id, name});
    const CH = 786432; // múltiplo de 3: cada pedaço vira base64 independente
    for(let o=0; o<blob.size; o+=CH){
      const buf = await blob.slice(o, o+CH).arrayBuffer();
      h.postMessage({action:'chunk', id, data:b64(buf)});
    }
    h.postMessage({action:'finish', id, mode});
  });
}
async function shareOrDownload(blob, name, preferShare){
  if(NATIVE){ return nativeSend(blob, name, 'share'); }
  const file = new File([blob], name, {type:blob.type});
  if(preferShare && navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file]}); return; }catch(e){ if(e && e.name==='AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 60000);
}

function ptLabel(l){
  if(!l) return '';
  const m = [[/back triple/i,'Câmera Traseira Tripla'],[/back dual wide/i,'Câmera Traseira Dupla Grande-Angular'],[/back dual/i,'Câmera Traseira Dupla'],[/back telephoto/i,'Câmera Teleobjetiva Traseira'],[/back ultra wide/i,'Câmera Ultra-Angular Traseira'],[/front ultra wide/i,'Câmera Ultra-Angular Frontal'],[/back camera/i,'Câmera Traseira'],[/front camera/i,'Câmera Frontal'],[/iphone microphone/i,'Microfone do iPhone'],[/ipad microphone/i,'Microfone do iPad'],[/^default\b/i,'Padrão']];
  for(const [re,t] of m) if(re.test(l)) return l.replace(/\(.*?\)/g,'').trim().match(/^(front|back|iphone|ipad|default)/i) ? t : l;
  return l;
}

function bindSettings(w, rerender){

  w.querySelectorAll('[data-s]').forEach(s=>s.onclick=e=>{ const b=e.target.closest('button'); if(!b) return; const k=s.dataset.s; P[k]=b.dataset.v; psave(k); s.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); afterChange();  });
  w.querySelectorAll('[data-sw]').forEach(s=>s.onclick=e=>{ const b=e.target.closest('button'); if(!b) return; const k=s.dataset.sw; P[k]=b.dataset.v; psave(k); s.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); afterChange(); });

      ${rToggle('timed','Rolagem cronometrada')}

    </div><p class="snote">O texto termina exatamente nesse tempo. Ótimo para vídeos com duração fixa (Reels de 60s, por exemplo). Enquanto estiver ligada, o controle de velocidade fica travado.</p>`;
  else if(id==='mode') body = `<div class="sgroup" style="margin-top:12px">
      ${rSeg('mode','Modo',[['cont','Contínuo'],['page','Por página']])}
    </div><p class="snote">Contínuo: o texto sobe sem parar. Por página: o texto pula uma tela de cada vez, no ritmo da velocidade escolhida.</p>`;
  else if(id==='video'){ videoSheet(onBack); return; }
  else if(id==='capfiles'){
    const list = LS.get('captions', []);
    body = list.length ? `<div class="list" style="margin-top:12px">${list.map((c,i)=>`<div class="li"><span class="grow">${esc(c.title)}<div class="sub">${new Date(c.date).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})} · ${(c.srt.match(/-->/g)||[]).length} legendas</div></span><button class="btn" style="flex:0 0 auto;height:38px;padding:0 14px;font-size:14px" data-cap="${i}">${RECORDER?'Baixar':'Copiar'}</button></div>`).join('')}</div>
      <div class="btnrow"><button class="btn" data-x="clearcap">Apagar todas</button></div>`
      : `<p class="sub" style="margin-top:14px">Nenhuma legenda ainda. Com “Legendas automáticas” ligado, ${RECORDER?'cada vídeo gravado gera':'cada leitura gera'} um arquivo aqui.</p>`;
  }
  const titles = {remote:'Controle remoto',font:'Fonte e tamanho',cue:'Indicador de leitura',timed:'Rolagem cronometrada',mode:'Modo de rolagem',video:'Gravação de vídeo',capfiles:'Arquivos de legenda'};
  const w = sheet(head(titles[id], true) + body + '<div style="height:10px"></div>');
  bindSettings(w);
  w.querySelector('[data-x=ok]').onclick = ()=>{ w.remove(); onBack(); document.querySelector('.sheetwrap') && document.querySelector('.sheetwrap').remove(); };
  w.querySelector('[data-x=back]').onclick = ()=>{ w.remove(); onBack(); };
  w.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{ P.timedSecs=Math.max(5,Math.min(3600,P.timedSecs + +b.dataset.d)); psave('timedSecs'); w.querySelector('#tsec').textContent=fmt(P.timedSecs); afterChange(); });
  w.querySelectorAll('[data-cap]').forEach(b=>b.onclick=async()=>{

    try{ await navigator.clipboard.writeText(c.srt); toast('Legenda copiada. Cole num arquivo .srt'); }catch(e){ toast('Não foi possível copiar aqui.'); }
  });
  const cc = w.querySelector('[data-x=clearcap]');
  if(cc) cc.onclick = ()=>{ LS.set('captions',[]); w.remove(); onBack(); };
  // a folha principal fica por baixo; ao voltar ela é reconstruída
}

function getBrands(){
  let b = LS.get('brands', null);
  if(!Array.isArray(b) || !b.length){
    b = BRAND_PRESETS.map(x=>Object.assign({}, x));
    const old = LS.get('brand', null);
    if(old){ if(old.name) b[0].name = old.name; b[0].handle = old.handle || ''; b[0].logo = old.logo || ''; }
    LS.set('brands', b);
  }
  // perfis criados antes do tom de voz ganham o tom padrão
  let changed = false;
  b.forEach(x=>{ if(x.voice === undefined){ const p = BRAND_PRESETS.find(y=>y.id===x.id); x.voice = p ? p.voice : ''; changed = true; } });
  if(changed) LS.set('brands', b);
  return b;
}

function getBrand(){ const bs = getBrands(); return Object.assign({}, bs.find(x=>x.id===CUR_BRAND) || bs[0]); }
function setBrand(nb){ const bs = getBrands(); const i = bs.findIndex(x=>x.id===nb.id); if(i>=0) bs[i] = nb; else bs.push(nb); LS.set('brands', bs); }

function lum(hex){ const h = String(hex||'#000').replace('#',''); const f = h.length===3 ? h.split('').map(x=>x+x).join('') : h; const n = parseInt(f.slice(0,6),16)||0; const r=(n>>16)&255, g=(n>>8)&255, b=n&255; return (0.299*r + 0.587*g + 0.114*b)/255; }
const onColor = c => lum(c) > 0.62 ? '#0b0b0b' : '#ffffff';

const cfont = (s, w, f) => `${w} ${Math.round(s)}px ${f}`;
function parseRich(text){
  const out = []; let hi = false;
  String(text||'').split(/(\*)/).forEach(p=>{
    if(p==='*'){ hi = !hi; return; }
    p.split(/(\s+)/).forEach(x=>{
      if(!x) return;
      if(/^\s+$/.test(x)){ const n = (x.match(/\n/g)||[]).length; for(let i=0;i<n;i++) out.push({nl:true}); return; }
      out.push({w:x, hi});

}

  for(const t of toks){
    if(t.nl){ lines.push(line); line = []; x = 0; continue; }
    const w = c.measureText(t.w).width;
    if(line.length && x + sp + w > maxW){ lines.push(line); line = []; x = 0; }
    if(line.length) x += sp;
    line.push({w:t.w, hi:t.hi, x, width:w}); x += w;
  }
  if(line.length) lines.push(line);
  return lines;
}
function fitRich(c, text, maxW, maxH, maxS, minS, lh, weight, fam){
  for(let s = maxS; s >= minS; s -= Math.max(1, Math.round(maxS/40))){

    const L = layoutRich(c, text, maxW);
    const tooWide = L.some(l=>l.length===1 && l[0].width > maxW);
    if(L.length*s*lh <= maxH && !tooWide) return {s, L, h:L.length*s*lh, weight, fam};
  }
  c.font = cfont(minS, weight, fam);

  return {s:minS, L, h:L.length*minS*lh, weight, fam};
}
function drawRich(c, fit, x, y, lh, color, hiColor, align, maxW){

}

- Hierarquia: 1 ideia por slide; título com no máximo 8 palavras; corpo com no máximo 25 palavras; destaque só 1 a 2 palavras com *asteriscos*. Capa = promessa ou tensão em até 7 palavras, legível no feed em miniatura.

function scriptToSlides(text, title){
  const sents = sentencesOf(text);
  if(!sents.length) return [{kind:'capa', title: title || 'Seu título aqui', body:''},{kind:'cta', title:'Gostou?', body:'Salve este post e compartilhe com quem precisa ver isso.'}];
  let hook = sents[0];
  if(wc(hook) > 24){ const cl = hook.split(/,\s*/)[0]; hook = wc(cl) >= 5 && wc(cl) <= 18 ? cl : hook.split(/\s+/).slice(0,16).join(' ') + '…'; }
  const rest = sents.slice(1);
  let ctaText = '';
  if(rest.length && /(me segue|me siga|siga|segue a gente|comente|comenta|compartilh|salve|salva|link na bio)/i.test(rest[rest.length-1])) ctaText = rest.pop();
  const chunks = []; let cur = '';
  rest.forEach(s=>{
    if(cur && wc(cur + ' ' + s) > 26){ chunks.push(cur); cur = s; }
    else cur = cur ? cur + ' ' + s : s;
  });
  if(cur) chunks.push(cur);
  while(chunks.length > 8){       // junta os menores até caber em 10 slides
    let mi = 0, mv = 1e9;
    for(let i=0;i<chunks.length-1;i++){ const v = wc(chunks[i]) + wc(chunks[i+1]); if(v < mv){ mv = v; mi = i; } }
    chunks.splice(mi, 2, chunks[mi] + ' ' + chunks[mi+1]);
  }
  const slides = [{kind:'capa', title:hook, body: title && title !== hook ? '' : ''}];
  chunks.forEach(ch=>{
    const ss = ch.match(/[^.!?…]+[.!?…]+["”']?|[^.!?…]+$/g) || [ch];
    // destaca a primeira frase curta como título do slide
    if(ss.length > 1 && wc(ss[0]) <= 9) slides.push({kind:'texto', title:ss[0].trim(), body:ss.slice(1).join(' ').trim()});
    else slides.push({kind:'texto', title:'', body:ch});
  });
  slides.push({kind:'cta', title: ctaText && wc(ctaText) <= 12 ? ctaText : 'Fez sentido para você?', body: ctaText && wc(ctaText) > 12 ? ctaText : 'Salve este post para rever depois e compartilhe com alguém que precisa ouvir isso.'});
  return slides;
}

    let y = top + W*0.16 + (area*0.7 - tf.h)/2;
    y += drawRich(c, tf, pad, y, 1.2, fg, ac, 'left', maxW);
    if(sl.title && sl.body){ c.font = cfont(W*0.036, 600, fam); c.fillStyle = ac; c.fillText('— ' + sl.body, pad, y + W*0.04); }
  } else if(sl.kind==='cta'){
    const tf = fitRich(c, sl.title||'', maxW, area*0.4, W*0.095, W*0.05, 1.1, 800, fam);
    const bf = sl.body ? fitRich(c, sl.body, maxW, area*0.25, W*0.045, W*0.03, 1.3, 500, fam) : null;
    const btnH = W*0.11, total = tf.h + (bf ? bf.h + W*0.04 : 0) + btnH + W*0.07;
    let y = top + (area - total)/2;
    y += drawRich(c, tf, pad, y, 1.1, fg, ac, 'center', maxW);
    if(bf){ y += W*0.04; c.globalAlpha = 0.85; y += drawRich(c, bf, pad, y, 1.3, fg, ac, 'center', maxW); c.globalAlpha = 1; }
    y += W*0.07;
    const label = handle ? 'Siga @' + handle : 'Salve e compartilhe';
    c.font = cfont(W*0.042, 800, fam); const lw = c.measureText(label).width + W*0.12;
    c.fillStyle = ac; roundRect(c, (W - lw)/2, y, lw, btnH, btnH/2); c.fill();
    c.fillStyle = onColor(ac);
    c.textAlign = 'center'; c.fillText(label, W/2, y + btnH*0.27); c.textAlign = 'left';
    // ícones de salvar e compartilhar
    c.font = cfont(W*0.03, 600, fam); c.fillStyle = fg; c.globalAlpha = 0.7; c.textAlign = 'center';
    c.fillText('💾 Salve   ·   📤 Compartilhe   ·   💬 Comente', W/2, y + btnH + W*0.05); c.textAlign = 'left'; c.globalAlpha = 1;
  } else {
    let y = top; const titleH = sl.title ? W*0.075*1.15*3 : 0;
    const tf = sl.title ? fitRich(c, sl.title, maxW, Math.min(titleH, area*0.3), W*0.062, W*0.038, 1.15, 800, fam) : null;
    const bf = fitRich(c, sl.body||'', maxW, area - (tf ? tf.h + W*0.05 : 0), W*0.066, W*0.034, 1.32, 500, fam);
    const total = (tf ? tf.h + W*0.05 : 0) + bf.h;
    y = top + (area - total)*0.42;
    if(tf){ y += drawRich(c, tf, pad, y, 1.15, ac, fg, 'left', maxW) + W*0.05; }
    drawRich(c, bf, pad, y, 1.32, fg, ac, 'left', maxW);
  }
  // indicador de progresso
  if(n > 1){
    const dw = W*0.02, gap = W*0.012, tw = n*dw + (n-1)*gap; let x = (W - tw)/2; const y = H - pad*0.75;
    for(let k=0;k<n;k++){ c.fillStyle = k===i ? ac : fg; c.globalAlpha = k===i ? 1 : 0.25; roundRect(c, x, y, k===i ? dw*2 : dw, dw*0.5, dw*0.25); c.fill(); x += (k===i ? dw*2 : dw) + gap; }
    c.globalAlpha = 1;
  }
  c.restore();
}
function renderTweet(c, W, H, sl, i, n, T, fg, ac, B, handle){
  const pad = W*0.08, maxW = W - pad*2;
  const text = [sl.title, sl.body].filter(Boolean).join('\n\n');
  const tf = fitRich(c, text, maxW, H*0.6, W*0.074, W*0.034, 1.3, 500, SANS);
  const headH = W*0.13, total = headH + W*0.05 + tf.h;
  let y = (H - total)/2;
  const r = headH*0.42;
  c.save(); c.beginPath(); c.arc(pad + r, y + headH/2, r, 0, 7); c.clip();
  if(brandLogoImg) coverDraw(c, brandLogoImg, pad, y + headH/2 - r, r*2, r*2);
  else { c.fillStyle = ac; c.fillRect(pad, y, r*2, headH); c.fillStyle = '#fff'; c.font = cfont(r, 800, SANS); c.textAlign = 'center'; c.fillText((B.name||handle||'A')[0].toUpperCase(), pad + r, y + headH/2 - r*0.55); c.textAlign = 'left'; }
  c.restore();
  const nx = pad + r*2 + W*0.03;
  c.font = cfont(W*0.04, 800, SANS); c.fillStyle = fg; const nm = B.name || handle || 'Seu nome';
  c.fillText(nm, nx, y + headH*0.16);
  const nmW = c.measureText(nm).width;
  c.fillStyle = ac; c.beginPath(); c.arc(nx + nmW + W*0.028, y + headH*0.16 + W*0.022, W*0.018, 0, 7); c.fill();
  c.strokeStyle = '#fff'; c.lineWidth = W*0.005; c.beginPath(); c.moveTo(nx + nmW + W*0.019, y + headH*0.16 + W*0.022); c.lineTo(nx + nmW + W*0.026, y + headH*0.16 + W*0.03); c.lineTo(nx + nmW + W*0.038, y + headH*0.16 + W*0.013); c.stroke();
  c.font = cfont(W*0.034, 400, SANS); c.fillStyle = T.fg === '#0f1419' ? '#536471' : '#71767b';
  c.fillText('@' + (handle || 'seuperfil'), nx, y + headH*0.56);
  y += headH + W*0.05;
  drawRich(c, tf, pad, y, 1.3, fg, ac, 'left', maxW);
  if(n > 1){ c.font = cfont(W*0.028, 600, SANS); c.fillStyle = T.fg === '#0f1419' ? '#536471' : '#71767b'; c.textAlign = 'right'; c.fillText(`${i+1}/${n}`, W - pad, H - pad*0.9); c.textAlign = 'left'; }
}

   CARROSSEL COM FOTOS E VÍDEOS
   Cada slide pode ter uma foto ou um vídeo (fundo, em cima ou em moldura).

const IDB = (()=>{
  let dbp = null;
  const open = ()=> dbp || (dbp = new Promise((res, rej)=>{ try{ const r = indexedDB.open('tpc_media', 1); r.onupgradeneeded = ()=>r.result.createObjectStore('m'); r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error); }catch(e){ rej(e); } }));
  const tx = async (mode, fn)=>{ const d = await open(); return new Promise((res, rej)=>{ const t = d.transaction('m', mode); const st = t.objectStore('m'); const rq = fn(st); t.oncomplete = ()=>res(rq && rq.result); t.onerror = ()=>rej(t.error); }); };
  return { put:(k, v)=>tx('readwrite', s=>s.put(v, k)).catch(()=>null), get:(k)=>tx('readonly', s=>s.get(k)).catch(()=>null) };
})();
function coverDrawF(c, img, x, y, w, h, fy, zoom){
  const iw = img.videoWidth || img.naturalWidth || img.width, ih = img.videoHeight || img.naturalHeight || img.height;
  if(!iw || !ih) return;
  const k = Math.max(w/iw, h/ih) * (zoom || 1), dw = iw*k, dh = ih*k;
  const fyv = fy == null ? 0.5 : fy;
  c.save(); c.beginPath(); c.rect(x, y, w, h); c.clip();
  c.drawImage(img, x + (w-dw)/2, y + (h-dh)*fyv, dw, dh);
  c.restore();
}

async function mediaFromFile(f){

/** Exporta um slide com vídeo como MP4: o texto fica por cima do vídeo rodando. */
async function cxVideoSlideBlob(sl, i, n, onProg){
  const v = sl.vid, mime = pickMime();
  const [W, H] = CFMT[CX.fmt] || CFMT['4:5'];
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  if(mime === null || !cv.captureStream) throw new Error('este aparelho não exporta vídeo pelo navegador');
  const stream = cv.captureStream(30);
  const AC = window.AudioContext || window.webkitAudioContext;
  let dest = null;
  if(AC){
    if(!CX._ac) CX._ac = new AC();
    try{ await CX._ac.resume(); }catch(e){}
    if(!sl._src){ sl._src = CX._ac.createMediaElementSource(v); sl._src.connect(CX._ac.destination); }
    dest = CX._ac.createMediaStreamDestination(); sl._src.connect(dest);
    dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
  }
  const rec = mime ? new MediaRecorder(stream, {mimeType:mime, videoBitsPerSecond:6000000}) : new MediaRecorder(stream);
  const chunks = []; rec.ondataavailable = e=>{ if(e.data && e.data.size) chunks.push(e.data); };
  const done = new Promise(r=>{ rec.onstop = r; });
  const len = Math.min(60, v.duration || 15);
  v.loop = false; v.muted = false; v.currentTime = 0; await waitEvt(v, ['seeked'], 1500);
  renderSlide(cv, sl, i, n, CX);
  rec.start(500);
  try{ await v.play(); }catch(e){ v.muted = true; await v.play(); }
  await new Promise(res=>{ const step = ()=>{ if(v.ended || v.currentTime >= len){ res(); return; } renderSlide(cv, sl, i, n, CX); if(onProg) onProg(v.currentTime/len); requestAnimationFrame(step); }; requestAnimationFrame(step); });
  v.pause(); renderSlide(cv, sl, i, n, CX); rec.stop(); await done;
  if(dest){ try{ sl._src.disconnect(dest); }catch(e){} }
  v.loop = true; v.muted = true;
  return new Blob(chunks, {type:(rec.mimeType || mime || 'video/mp4').split(';')[0]});
}

function cuesToList(list, endT){
  const cl = []; list.forEach(c=>{ if(!cl.length || cl[cl.length-1].i!==c.i) cl.push(c); });
  return cl.map((c,k)=>({ s:c.t, e: cl[k+1] ? cl[k+1].t : Math.max(c.t+1.5, endT||0), text:(segs[c.i] && segs[c.i].t || '').trim() })).filter(x=>x.text && x.e - x.s > 0.1);
}
/** Distribui o texto do roteiro pela duração do vídeo (quando não há tempo gravado). */
function scriptToCues(text, dur){
  const words = cleanScript(text).replace(/\n+/g,' ').split(/\s+/).filter(Boolean);
  if(!words.length || !dur) return [];
  const chunks = []; let cur = [];
  words.forEach(w=>{ cur.push(w); if(cur.length >= 6 || /[.!?…]$/.test(w)){ chunks.push(cur.join(' ')); cur = []; } });
  if(cur.length) chunks.push(cur.join(' '));
  const weight = chunks.map(c=>c.length + 6), total = weight.reduce((a,b)=>a+b,0);
  let t = 0;
  return chunks.map((c,i)=>{ const d = dur * weight[i]/total; const o = {s:t, e:t+d, text:c}; t += d; return o; });
}

function waitEvt(el, evts, ms){
  return new Promise(res=>{
    let done = false;
    const fin = ()=>{ if(done) return; done = true; evts.forEach(e=>el.removeEventListener(e, fin)); el.removeEventListener('error', fin); clearTimeout(t); res(); };
    evts.forEach(e=>el.addEventListener(e, fin)); el.addEventListener('error', fin);
    const t = setTimeout(fin, ms);
  });
}

async function primeVideo(url){

async function vxExport(){
  const mime = pickMime();
  const probe = document.createElement('canvas');
  if(mime === null || !probe.captureStream){ toast('Este aparelho não consegue exportar vídeo pelo navegador. Use o app de iPhone.', 4500); return; }
  const v = VX.v; v.pause(); vxSetPlay(false); v.muted = false;
  VX.exporting = true;
  const [W, H] = vxDims();
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const w = sheet(`<div class="grab"></div><h3>Exportando vídeo</h3><p class="sub">O vídeo é montado em tempo real: leva o mesmo tempo da duração final (${fmt(vxKeptLen()/(VX.speed||1))}). Deixe o app aberto nesta tela.</p>
    <div class="prog"><b id="vxEB"></b></div><p class="snote" id="vxEM">Preparando…</p>
    <div class="btnrow"><button class="btn" data-x="c">Cancelar</button></div>`);
  w.addEventListener('click', e=>{ if(e.target===w) e.stopImmediatePropagation(); }, true);
  let cancelled = false; w.querySelector('[data-x=c]').onclick = ()=>{ cancelled = true; };
  try{
    const vstream = cv.captureStream(30);
    // áudio: voz do vídeo + música
    let ac = VX.ac;
    if(!ac){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC){
        ac = VX.ac = new AC();
        VX.vSrc = ac.createMediaElementSource(v); VX.vGain = ac.createGain(); VX.vSrc.connect(VX.vGain); VX.vGain.connect(ac.destination);
      }
    }
    if(ac){
      try{ await ac.resume(); }catch(_){}
      VX.vGain.gain.value = VX.vVol;
      const dest = ac.createMediaStreamDestination(); VX.vGain.connect(dest);
      if(VX.music){
        if(!VX.music.src){ VX.music.src = ac.createMediaElementSource(VX.music.el); VX.music.gain = ac.createGain(); VX.music.src.connect(VX.music.gain); VX.music.gain.connect(ac.destination); }
        VX.music.gain.gain.value = VX.mVol; VX.music.gain.connect(dest); VX.music.el.volume = 1;
      }
      dest.stream.getAudioTracks().forEach(tr=>vstream.addTrack(tr));
      VX.dest = dest;
    }
    const rec = mime ? new MediaRecorder(vstream, {mimeType:mime, videoBitsPerSecond: W*H > 2e6 ? 9000000 : 6000000}) : new MediaRecorder(vstream);
    const chunks = []; rec.ondataavailable = ev=>{ if(ev.data && ev.data.size) chunks.push(ev.data); };
    const done = new Promise(r=>{ rec.onstop = r; });
    await vxSeek(VX.t0);
    vxDraw(cv, VX.t0);
    rec.start(500);
    if(VX.music){ VX.music.el.currentTime = 0; VX.music.el.play().catch(()=>{}); }
    vxApplyRate();
    { const c0 = vxCutAt(v.currentTime); if(c0){ await vxSeek(c0.e); vxDraw(cv); } }
    await v.play();
    let jumping = false;
    await new Promise(res=>{
      const step = async ()=>{
        if(cancelled || v.ended || v.currentTime >= VX.t1){ res(); return; }
        if(!jumping){
          const ct = vxCutAt(v.currentTime);
          if(ct){
            jumping = true;
            try{ if(rec.state === 'recording') rec.pause(); }catch(_){}
            v.pause(); if(VX.music) VX.music.el.pause();
            await vxSeek(Math.min(ct.e, VX.t1 - 0.02)); vxDraw(cv);
            if(v.currentTime >= VX.t1 - 0.03){ res(); return; }
            try{ await v.play(); }catch(_){}
            if(VX.music) VX.music.el.play().catch(()=>{});
            try{ if(rec.state === 'paused') rec.resume(); }catch(_){}
            jumping = false;
          }
        }
        vxDraw(cv); vxDraw();
        const p = vxRel(v.currentTime)/vxKeptLen();
        const b = $('vxEB'); if(b) b.style.width = Math.min(100, p*100) + '%';
        const m = $('vxEM'); if(m) m.textContent = `${Math.round(Math.min(1,p)*100)}%`;
        requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
    v.pause(); if(VX.music) VX.music.el.pause();
    vxDraw(cv, VX.t1);
    rec.stop(); await done;
    if(VX.dest){ try{ VX.vGain.disconnect(VX.dest); if(VX.music && VX.music.gain) VX.music.gain.disconnect(VX.dest); }catch(_){} VX.dest = null; }
    VX.exporting = false; w.remove();
    if(cancelled){ toast('Exportação cancelada.'); return; }
    const type = (rec.mimeType || mime || 'video/mp4').split(';')[0];
    const out = new Blob(chunks, {type});
    showResult(out, '', VX.name + '-editado', true);
  }catch(err){
    VX.exporting = false; w.remove();
    toast('Não foi possível exportar: ' + (err && err.message || 'erro'), 4500);
  }
}

/** Resolve o estilo final da legenda (modelo + ajustes do usuário). */
function capStyle(key, ac, over){

  const COLS = {branca:'#ffffff', preta:'#0b0b0b', amarela:'#ffd60a', marca:ac};

  if(st.box === '@accent2') st.box = ac;
  if(st.wbox === '@accent') st.wbox = ac;
  if(over.box && over.box !== 'auto'){
    st.wbox = false;
    st.box = over.box === 'nenhuma' ? false : COLS[over.box] || (/^#[0-9a-f]{6}$/i.test(over.box) ? over.box : st.box);

  if(over.color && over.color !== 'auto') st.color = COLS[over.color] || (/^#[0-9a-f]{6}$/i.test(over.color) ? over.color : st.color);
  if(st.hi === '#ffd60a' && st.box === '#ffd60a') st.hi = st.color;

  if(over.font && over.font !== 'auto') st.fam = over.font;

/** Desenha um texto já com *destaques* no estilo dado, centralizado em yC. */
function renderCapText(c, W, H, text, st, yC, size, opt){
  opt = opt || {};
  const fam = CAPFONTS[st.fam] || SANS;
  const shown = st.upper ? text.toUpperCase() : st.lower ? text.toLowerCase() : text;
  const maxW = W*(opt.maxW || 0.84), base = W*0.08*(size||1)*(st.big||1);
  const f = fitRich(c, shown, maxW, H*(opt.maxH || 0.2), base, base*0.5, 1.18, st.weight || 800, fam);
  let y = yC - f.h/2;
  const sc = opt.scale || 1;
  c.save();
  if(opt.alpha != null) c.globalAlpha = opt.alpha;
  if(sc !== 1){ c.translate(W/2, yC); c.scale(sc, sc); c.translate(-W/2, -yC); }
  const lineW = line => line.length ? line[line.length-1].x + line[line.length-1].width : 0;
  if(st.box){
    const bw = Math.max(...f.L.map(lineW)) + W*0.07;
    c.fillStyle = st.box; const a0 = c.globalAlpha; if(st.box === '#0b0b0b' || st.box === 'rgba(0,0,0,.72)') c.globalAlpha = a0*0.85;
    roundRect(c, (W - bw)/2, y - f.s*0.22, bw, f.h + f.s*0.3, W*0.025); c.fill(); c.globalAlpha = a0;
  }
  if(st.wbox){
    c.font = cfont(f.s, f.weight, f.fam); c.fillStyle = st.wbox;
    f.L.forEach((line, i)=>{ const ox = (W - maxW)/2 + (maxW - lineW(line))/2; line.forEach(tk=>{ roundRect(c, ox + tk.x - f.s*0.12, y + i*f.s*1.18 - f.s*0.1, tk.width + f.s*0.24, f.s*1.12, f.s*0.12); c.fill(); }); });
  }
  if(st.stroke){
    c.font = cfont(f.s, f.weight, f.fam); c.textBaseline = 'top'; c.lineJoin = 'round'; c.lineWidth = f.s*0.17; c.strokeStyle = 'rgba(0,0,0,.92)';
    f.L.forEach((line, i)=>{ const ox = (W - maxW)/2 + (maxW - lineW(line))/2; line.forEach(tk=>c.strokeText(tk.w, ox + tk.x, y + i*f.s*1.18)); });
  }
  if(st.glow){ c.shadowColor = st.hi; c.shadowBlur = f.s*0.6; }
  else if(st.shadow){ c.shadowColor = 'rgba(0,0,0,.75)'; c.shadowBlur = f.s*0.25; c.shadowOffsetY = f.s*0.06; }
  drawRich(c, f, (W - maxW)/2, y, 1.18, st.color, st.hi, 'center', maxW);
  if(st.glow){ drawRich(c, f, (W - maxW)/2, y, 1.18, st.color, st.hi, 'center', maxW); }
  c.restore();
  return f;
}
function drawCaption(c, W, H, t, ac){
  const cue = VX.cues.find(q=>t >= q.s && t < q.e); if(!cue) return;
  const st = capStyle(VX.capSty, ac, {box:VX.capBox, color:VX.capColor, words:VX.capWords, font:VX.capFont});
  const words = cue.text.split(/\s+/).filter(Boolean); if(!words.length) return;
  const wts = words.map(w=>w.length + 2), tot = wts.reduce((a,b)=>a+b,0), dur = cue.e - cue.s;
  let acc = cue.s, cur = words.length - 1; const starts = [];
  words.forEach((w,i)=>{ starts.push(acc); acc += dur * wts[i]/tot; });
  for(let i=0;i<words.length;i++){ if(t < starts[i] + dur*wts[i]/tot){ cur = i; break; } }
  const g0 = Math.floor(cur / st.words) * st.words;
  let group = words.slice(g0, g0 + st.words);
  let text;
  if(st.type) text = group.slice(0, cur - g0 + 1).join(' ');
  else if(st.karaoke) text = group.map((w,i)=> g0 + i <= cur ? '*' + w + '*' : w).join(' ');
  else text = group.map((w,i)=> (g0 + i === cur && st.hi !== st.color) ? '*' + w + '*' : w).join(' ');
  let scale = 1;
  if(st.anim === 'pop'){ const d = t - starts[cur]; scale = d < 0.12 ? 0.75 + 0.35*(d/0.12) : d < 0.22 ? 1.1 - 0.1*((d-0.12)/0.1) : 1; }
  else if(st.anim === 'grupo'){ const d = t - starts[g0]; scale = d < 0.18 ? 0.85 + 0.15*(d/0.18) : 1; }
  renderCapText(c, W, H, text, st, H*VX.capPos, VX.capSize, {scale});
}
/** Textos livres por cima do vídeo (como no CapCut). */
function drawTexts(c, W, H, t, ac){
  (VX.texts||[]).forEach(x=>{
    if(t < x.s || (x.e && t >= x.e)) return;
    if(String(x.tpl).startsWith('mg:')){ drawMG(c, W, H, x, t - x.s, ac); return; }
    const st = capStyle(x.tpl, ac, {font:x.font, box:x.box});
    st.words = 99; const d = t - x.s;
    let scale = 1, alpha = 1;
    if(x.anim === 'pop') scale = d < 0.15 ? 0.6 + 0.5*(d/0.15) : d < 0.28 ? 1.1 - 0.1*((d-0.15)/0.13) : 1;
    else if(x.anim === 'fade') alpha = Math.min(1, d/0.4);
    else if(x.anim === 'type'){ const n = Math.max(1, Math.floor(d/0.06)); const raw = x.text.replace(/\*/g,''); if(n < raw.length){ renderCapText(c, W, H, raw.slice(0, n), st, H*x.pos, x.size||1, {maxH:0.3}); return; } }
    renderCapText(c, W, H, x.text, st, H*x.pos, x.size||1, {scale, alpha, maxH:0.3});
  });
}
/** Miniatura de um modelo para a galeria. */
function capThumb(key, label){
  const cv = document.createElement('canvas'); cv.width = 240; cv.height = 150;
  const c = cv.getContext('2d'); c.fillStyle = '#2c2c2e'; c.fillRect(0,0,240,150);
  const st = capStyle(key, (getBrand().accent || '#2f7bff')); st.words = 99;
  renderCapText(c, 240, 150, label || 'SUA *FRASE* AQUI', st, 75, 1.35, {maxW:0.9, maxH:0.8});
  return cv.toDataURL('image/png');
}
function capGallery(sel, attr){
  return `<div class="capgal">${Object.entries(CAPSTY).map(([k,s])=>`<button class="capt ${sel===k?'on':''}" ${attr}="${k}"><img src="${capThumb(k, s.sample)}" alt=""><span>${esc(s.name)}</span></button>`).join('')}</div>`;
}

/* ---------- legendas automáticas (app de iPhone: reconhecimento de fala) ---------- */
function nativeTranscribe(blob){
  return new Promise(async res=>{
    const h = window.webkit.messageHandlers.native, id = uid();
    nativeCb[id] = (ok, msg)=>{ delete nativeCb[id]; res({ok, msg}); };
    h.postMessage({action:'begin', id, name:'audio.' + ((blob.type||'').includes('quicktime') ? 'mov' : 'mp4')});
    const CH = 786432;
    for(let o=0; o<blob.size; o+=CH){ const buf = await blob.slice(o, o+CH).arrayBuffer(); h.postMessage({action:'chunk', id, data:b64(buf)}); }
    h.postMessage({action:'finish', id, mode:'transcribe'});
  });
}
async function vxAutoCaptions(btn){
  if(!NATIVE){
    const w = sheet(`<div class="grab"></div><h3>✨ Legendas automáticas</h3>
      <p class="sub">Transformar a fala do vídeo em legenda usa o reconhecimento de voz do iPhone, que só funciona no <b>app de iPhone</b> do Teleprompter (o que o programador instala).</p>
      <div class="sgroup" style="padding:12px 16px;font-size:15px;line-height:1.55">Aqui você tem 3 caminhos rápidos:<br>• <b>Gravar com o teleprompter</b>: as legendas já vêm sincronizadas com a rolagem.<br>• <b>Colar o texto</b> que você falou, que o editor distribui pelo tempo.<br>• <b>Legendar trecho a trecho</b>, pausando e digitando.</div>
      <div class="btnrow"><button class="btn" data-x="c">Fechar</button><button class="btn primary" data-x="p">📝 Colar o texto</button></div>`);
    w.querySelector('[data-x=c]').onclick = ()=>w.remove();
    w.querySelector('[data-x=p]').onclick = ()=>{ w.remove(); const b = document.querySelector('#vxPanel [data-a=capPaste]'); if(b) b.click(); };
    return;
  }
  if(btn){ btn.disabled = true; btn.textContent = 'Ouvindo o vídeo…'; }
  vxLoading('Gerando legendas a partir da fala…');
  const r = await nativeTranscribe(VX.blob);
  vxLoading(null);
  if(btn){ btn.disabled = false; btn.textContent = '✨ Gerar legendas automáticas'; }
  if(!r.ok){ toast(r.msg || 'Não foi possível gerar as legendas.', 4500); return; }
  let segs = []; try{ segs = JSON.parse(r.msg); }catch(e){}
  if(!segs.length){ toast('Não encontrei fala no vídeo.'); return; }
  const cues = []; let cur = null;
  segs.forEach(sg=>{
    if(!cur) cur = {s:sg.t, e:sg.t + sg.d, words:[]};
    cur.words.push(sg.w); cur.e = sg.t + sg.d;
    if(cur.words.length >= 6 || /[.!?…]$/.test(sg.w)){ cues.push({s:cur.s, e:cur.e, text:cur.words.join(' ')}); cur = null; }
  });
  if(cur) cues.push({s:cur.s, e:cur.e, text:cur.words.join(' ')});
  for(let i=0;i<cues.length-1;i++){ if(cues[i+1].s - cues[i].e < 0.6) cues[i].e = cues[i+1].s; }
  vxPush(); VX.cues = cues; VX.capOn = true; VX.cuesFromRec = true; VX.scriptText = cues.map(q=>q.text).join(' ');
  vxTab('legendas'); vxDraw(); toast(cues.length + ' legendas criadas pela fala. Confira em “Editar textos”.');
}

/* ---------- tratamento de cor ---------- */
const LOOKS = [['none','Original'],['cinema','Cinema'],['escuro','Escuro dramático'],['pb','Preto e branco'],['quente','Quente'],['frio','Frio']];
function drawLook(c, W, H, look){
  if(!look || look === 'none') return;
  c.save();
  if(look === 'pb'){ c.globalCompositeOperation = 'saturation'; c.fillStyle = '#000'; c.fillRect(0,0,W,H); c.globalCompositeOperation = 'source-over'; }
  if(look === 'quente'){ c.globalCompositeOperation = 'soft-light'; c.fillStyle = 'rgba(255,150,40,.35)'; c.fillRect(0,0,W,H); c.globalCompositeOperation = 'source-over'; }
  if(look === 'frio'){ c.globalCompositeOperation = 'soft-light'; c.fillStyle = 'rgba(40,120,255,.35)'; c.fillRect(0,0,W,H); c.globalCompositeOperation = 'source-over'; }
  if(look === 'cinema' || look === 'escuro'){
    c.globalCompositeOperation = 'soft-light'; c.fillStyle = look === 'cinema' ? 'rgba(255,170,60,.22)' : 'rgba(0,0,0,.35)'; c.fillRect(0,0,W,H); c.globalCompositeOperation = 'source-over';
    c.fillStyle = `rgba(0,0,0,${look === 'cinema' ? .18 : .32})`; c.fillRect(0,0,W,H);
  }
  const r = c.createRadialGradient(W/2, H*0.45, Math.min(W,H)*0.25, W/2, H*0.5, Math.max(W,H)*0.75);
  r.addColorStop(0, 'rgba(0,0,0,0)'); r.addColorStop(1, `rgba(0,0,0,${look === 'escuro' ? .85 : look === 'cinema' ? .7 : .35})`);
  c.fillStyle = r; c.fillRect(0,0,W,H);
  c.restore();
}

/* ---------- b-roll (imagens e vídeos de apoio por cima) ---------- */
function brollAt(t){ return (VX.brolls||[]).find(b=>t >= b.s && t < b.e); }
function drawBroll(c, W, H, t){
  (VX.brolls||[]).forEach(b=>{
    const on = t >= b.s && t < b.e;
    if(b.vid){
      if(on && !VX.v.paused && b.vid.paused){ try{ b.vid.currentTime = Math.max(0, t - b.s); }catch(e){} b.vid.play().catch(()=>{}); }
      if((!on || VX.v.paused) && !b.vid.paused) b.vid.pause();
      if(on && VX.v.paused && Math.abs(b.vid.currentTime - (t - b.s)) > 0.3){ try{ b.vid.currentTime = Math.max(0, t - b.s); }catch(e){} }
    }
  });
  const b = brollAt(t); if(!b) return;
  const el = b.vid || b.img; if(!el) return;
  const p = (t - b.s) / Math.max(0.1, b.e - b.s);
  const z = b.kb ? 1 + 0.08*p : 1;
  c.save(); c.translate(W/2, H/2); c.scale(z, z); c.translate(-W/2, -H/2);
  coverDrawF(c, el, 0, 0, W, H, 0.5, 1);
  c.restore();
  const fi = Math.min(1, (t - b.s)/0.12); if(fi < 1){ c.fillStyle = `rgba(0,0,0,${1-fi})`; c.fillRect(0,0,W,H); }
}
async function vxAddBroll(){
  const files = await pickFiles('image/*,video/*'); if(!files.length) return;
  vxPush();
  let t = VX.v.currentTime;
  for(const f of files){
    const isV = (f.type||'').startsWith('video');
    const b = {id:uid(), s:t, kb:true};
    if(isV){ const url = URL.createObjectURL(f); const v = await primeVideo(url); v.muted = true; v.loop = false; b.vid = v; b.e = Math.min(VX.dur, t + Math.min(4, v.duration || 3)); }
    else { b.img = await readImageFile(f, 1600); b.e = Math.min(VX.dur, t + 2.5); }
    VX.brolls = (VX.brolls||[]).concat([b]); t = b.e;
  }
  VX.brolls.sort((a,b)=>a.s-b.s);
  vxTab('broll'); vxDraw(); toast(files.length + ' b-roll adicionado' + (files.length>1?'s':'') + '. O áudio do vídeo principal continua.');
}

const easeOut = x => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
function mgFont(s){ return `${Math.round(s)}px ${CAPFONTS.anton}`; }
function mgRich(c, text, x, y, size, color, hi, align){

/* ---------- detectar e cortar silêncios ---------- */
async function vxSilence(minSil){
  minSil = minSil || 0.6;
  if(VX.blob.size > 400*1048576) throw new Error('vídeo grande demais para analisar o áudio aqui');
  const AC = window.AudioContext || window.webkitAudioContext; if(!AC) throw new Error('aparelho sem análise de áudio');
  const ab = await VX.blob.arrayBuffer();
  const ctx = new AC();
  const buf = await new Promise((res, rej)=>{ const p = ctx.decodeAudioData(ab, res, rej); if(p && p.then) p.then(res, rej); });
  try{ ctx.close(); }catch(e){}
  const ch = buf.getChannelData(0), sr = buf.sampleRate, win = Math.round(sr*0.05), n = Math.floor(ch.length/win);
  const rms = new Float32Array(n);
  for(let i=0;i<n;i++){ let s = 0; const o = i*win; for(let j=0;j<win;j+=4){ const x = ch[o+j]; s += x*x; } rms[i] = Math.sqrt(s/(win/4)); }
  const sorted = Array.from(rms).sort((a,b)=>a-b), q = p => sorted[Math.min(sorted.length-1, Math.floor(sorted.length*p))];
  const floor = q(0.1), loud = q(0.9);
  if(loud < 0.003) throw new Error('não encontrei voz no áudio');
  const thr = floor + (loud - floor)*0.12;
  let added = 0, removed = 0, start = -1;
  const flush = (i)=>{ const s = start*0.05, e = i*0.05; if(e - s >= minSil && s >= VX.t0 - 0.01 && e <= VX.t1 + 0.01){ const cs = s + 0.15, ce = e - 0.15; if(ce - cs > 0.2 && vxAddCut(cs, ce)){ added++; removed += ce - cs; } } };
  for(let i=0;i<n;i++){ if(rms[i] < thr){ if(start < 0) start = i; } else if(start >= 0){ flush(i); start = -1; } }
  if(start >= 0) flush(n);
  return {added, removed};
}

  if(VX.guide < 0){ g.innerHTML = ''; g.classList.add('hide'); return; }
  const i = VX.guide, last = i >= VX_STEPS.length, st = VX_STEPS[Math.min(i, VX_STEPS.length-1)];
  g.classList.remove('hide');
  g.innerHTML = last ? `<div class="vx-g-top"><b>Tudo pronto! 🎉</b><button class="vx-g-x" data-a="guideOff">✕</button></div><p>Assista uma vez no ▶ e toque em <b>Exportar</b>. O vídeo é montado em tempo real.</p><div class="vx-g-btns"><button class="st-btn" data-a="guidePrev">‹ Voltar</button><button class="st-btn primary" data-a="export">Exportar vídeo</button></div>`
    : `<div class="vx-g-top"><b>Passo ${i+1} de ${VX_STEPS.length}: ${st[1]}</b><button class="vx-g-x" data-a="guideOff">✕</button></div><div class="vx-g-dots">${VX_STEPS.map((_,k)=>`<i class="${k<=i?'on':''}"></i>`).join('')}</div><p>${st[2]}</p><div class="vx-g-btns">${i>0?'<button class="st-btn" data-a="guidePrev">‹ Voltar</button>':''}<button class="st-btn primary" data-a="guideNext">${i===VX_STEPS.length-1?'Concluir':'Próximo ›'}</button></div>`;
}

/* =====================================================
   BANCO DE IDEIAS DE CARROSSEL (conteúdo da Marca)
   Cada ideia já vem com rascunho dos slides e pode virar roteiro de vídeo.
   [colchetes] = trecho para você preencher com o seu caso real.
   ===================================================== */
const IDEA_CATS = {
  oratoria:   {name:'Oratória',          emoji:'🎤'},
  vendas:     {name:'Vendas',            emoji:'💰'},
  lideranca:  {name:'Liderança',         emoji:'🧭'},
  story:      {name:'Storytelling',      emoji:'📖'},
  bastidores: {name:'Bastidores e prova',emoji:'🎬'},
  eventos:    {name:'Eventos Marca',   emoji:'📅'},
  espaco:     {name:'Espaço Marca',    emoji:'🏛️'},
  empreender: {name:'Empreender',        emoji:'🚀'}
};
const IDEA_OBJ = { salvar:'💾 Salvamentos', compartilhar:'📤 Compartilhamentos', comentar:'💬 Comentários', vender:'🛒 Vendas', seguir:'➕ Seguidores' };
const I = (cat, obj, fmt, hook, why, slides, cta) => ({cat, obj, fmt, hook, why, slides: slides.map(s=>({kind:s[0], title:s[1]||'', body:s[2]||''})), cta: cta||''});
const IDEAS_BASE = [];
function allIdeas(){
  const custom = LS.get('ideas_custom', []);
  return custom.concat(IDEAS_BASE.map((x,i)=>Object.assign({id:'b'+i}, x)));
}
function ideaToScript(idea){
  return idea.slides.map(s=>[s.title, s.body].filter(Boolean).join('\n')).join('\n\n');
}
let IDX = {cat:'', obj:'', q:'', fav:false, brand:''};
const ideaBrand = x => x.brand || CAT_BRAND[x.cat] || 'oratoria';

function ideaRender(){
  const favs = LS.get('ideas_fav', []), used = LS.get('ideas_used', []);
  $('ideaCats').innerHTML = `<button class="chip2 ${!IDX.cat && !IDX.fav?'on':''}" data-cat="">Todas</button><button class="chip2 ${IDX.fav?'on':''}" data-fav="1">⭐ Favoritas</button>` +
    Object.entries(IDEA_CATS).map(([k,c])=>`<button class="chip2 ${IDX.cat===k?'on':''}" data-cat="${k}">${c.emoji} ${c.name}</button>`).join('');
  $('ideaBrand').innerHTML = `<button class="chip2 ${!IDX.brand?'on':''}" data-ib="">📱 Todos os perfis</button>` + getBrands().map(b=>`<button class="chip2 ${IDX.brand===b.id?'on':''}" data-ib="${b.id}"><span class="dot" style="background:linear-gradient(135deg,${b.bg1},${b.bg2});box-shadow:inset 0 0 0 3px ${b.accent}"></span>${esc(b.name)}</button>`).join('');
  $('ideaObj').innerHTML = `<button class="chip2 ${!IDX.obj?'on':''}" data-obj="">Qualquer objetivo</button>` + Object.entries(IDEA_OBJ).map(([k,n])=>`<button class="chip2 ${IDX.obj===k?'on':''}" data-obj="${k}">${n}</button>`).join('');
  const q = IDX.q.trim().toLowerCase();
  const bmap = {}; getBrands().forEach(b=>bmap[b.id]=b);
  const list = allIdeas().filter(x=>(!IDX.brand || ideaBrand(x)===IDX.brand) && (!IDX.cat || x.cat===IDX.cat) && (!IDX.obj || x.obj===IDX.obj) && (!IDX.fav || favs.includes(x.id)) &&
    (!q || (x.hook + ' ' + x.slides.map(s=>s.title+' '+s.body).join(' ')).toLowerCase().includes(q)));
  $('ideaList').innerHTML = list.length ? list.map(x=>`
    <div class="idea" data-id="${x.id}">
      <div class="idea-top"><span class="tagc">${(IDEA_CATS[x.cat]||{emoji:'💡'}).emoji} ${(IDEA_CATS[x.cat]||{name:'Ideia'}).name}</span><span class="tagc">${esc(x.fmt)}</span>${x.ai?'<span class="tagc">✨ IA</span>':''}${used.includes(x.id)?'<span class="tagc ok">✓ usada</span>':''}<button class="favb" data-favid="${x.id}">${favs.includes(x.id)?'⭐':'☆'}</button></div>
      <b>${esc(x.hook.replace(/\*/g,''))}</b>
      <small>${IDEA_OBJ[x.obj]||''} · ${esc(x.why)}</small>
      <small style="margin-top:4px;color:#c7c7cc">📱 Postar em: ${esc(bmap[ideaBrand(x)] ? bmap[ideaBrand(x)].name : 'Marca Oratória')}</small>
    </div>`).join('') : '<div class="empty"><b>Nenhuma ideia aqui</b>Mude o filtro ou a busca.</div>';
}
async function ideaClick(e){
  const t = e.target.closest('[data-a],[data-cat],[data-obj],[data-fav],[data-favid],[data-ib],.idea'); if(!t) return;
  if(t.dataset.ib !== undefined){ IDX.brand = t.dataset.ib; ideaRender(); return; }
  if(t.dataset.favid){ e.stopPropagation(); const f = LS.get('ideas_fav', []); const i = f.indexOf(t.dataset.favid); if(i>=0) f.splice(i,1); else f.push(t.dataset.favid); LS.set('ideas_fav', f); ideaRender(); return; }
  if(t.dataset.cat !== undefined){ IDX.cat = t.dataset.cat; IDX.fav = false; ideaRender(); return; }
  if(t.dataset.fav){ IDX.fav = !IDX.fav; IDX.cat = ''; ideaRender(); return; }
  if(t.dataset.obj !== undefined){ IDX.obj = t.dataset.obj; ideaRender(); return; }
  if(t.classList.contains('idea')){ ideaPreview(allIdeas().find(x=>x.id===t.dataset.id)); return; }
  if(t.dataset.a==='close'){ $('ideaStudio').remove(); return; }
  if(t.dataset.a==='ai') ideaAI();
}
function ideaPreview(x){
  if(!x) return;
  const w = sheet(head('Ideia', false) + `
    <p class="sub" style="margin-top:8px"><b style="color:#fff;font-size:17px">${esc(x.hook.replace(/\*/g,''))}</b><br>${IDEA_OBJ[x.obj]||''} · ${esc(x.fmt)}</p>
    <p class="snote" style="margin:0 0 12px">Por que engaja: ${esc(x.why)}</p>
    ${x.cta?`<p class="snote" style="margin:-4px 0 12px;color:#ffd60a">⚠️ ${esc(x.cta)}</p>`:''}
    <div class="list">${x.slides.map((s,i)=>`<div class="li" style="align-items:flex-start"><span class="sub" style="min-width:22px">${i+1}</span><span class="grow"><b style="font-size:15px">${esc((s.title||'').replace(/\*/g,''))}</b>${s.body?`<div class="sub" style="white-space:pre-wrap;margin-top:2px">${esc(s.body.replace(/\*/g,''))}</div>`:''}</span></div>`).join('')}</div>
    <div class="slabel">📱 Postar em</div>
    <div class="chips" id="ipBrand" style="flex-wrap:wrap">${getBrands().map(b=>`<button class="chip2 ${b.id===ideaBrand(x)?'on':''}" data-pb="${b.id}">${esc(b.name)}</button>`).join('')}</div>
    <div class="btnrow"><button class="btn" data-x="video">🎥 Gravar vídeo</button><button class="btn primary" data-x="car">🖼️ Criar carrossel</button></div>
    <div class="btnrow"><button class="btn" data-x="cal">📅 Colocar no calendário</button></div>
    <p class="snote" style="text-align:center">As duas opções criam um roteiro com esse texto na pasta “Banco de ideias”.</p>`);
  w.querySelector('[data-x=ok]').onclick = ()=>w.remove();
  let pb = ideaBrand(x);
  w.querySelector('#ipBrand').onclick = e=>{ const c = e.target.closest('[data-pb]'); if(!c) return; pb = c.dataset.pb; w.querySelectorAll('#ipBrand .chip2').forEach(z=>z.classList.toggle('on', z===c)); };
  const make = async ()=>{
    let folder = [...mine.values()].find(i=>i.type==='folder' && i.name==='Banco de ideias');
    if(!folder){ folder = {id:uid(), type:'folder', name:'Banco de ideias'}; await putMine(folder); }
    const it = {id:uid(), type:'script', name:x.hook.replace(/\*/g,''), text: ideaToScript(x), parent: folder.id};
    await putMine(it);
    const bo = getBrands().find(z=>z.id===pb) || getBrands()[0];
    LS.set('car_' + it.id, {brand: bo.id, tpl: bo.tpl || 'azul', fmt:'4:5', accent:'', caption:'', slides: x.slides});
    await useBrand(bo.id);
    const used = LS.get('ideas_used', []); if(!used.includes(x.id)){ used.push(x.id); LS.set('ideas_used', used); }
    w.remove(); const st = $('ideaStudio'); if(st) st.remove();
    render(); openScript(it, 'mine');
    return it;
  };
  w.querySelector('[data-x=car]').onclick = async ()=>{ await make(); openCarousel(); };
  w.querySelector('[data-x=video]').onclick = async ()=>{ await make(); openPrompter(); };
  w.querySelector('[data-x=cal]').onclick = async ()=>{ await addToCalendar({title:x.hook.replace(/\*/g,''), brand:pb, format: x.fmt==='Lista'||x.fmt==='Checklist'||x.fmt==='Passo a passo' ? 'carrossel' : 'reels', stage:'ideia', notes: ideaToScript(x)}); };
}
async function ideaAI(){
  const sample = await getCap('sample'); if(!sample) return;
  const w = sheet(`<div class="grab"></div><h3>✨ Novas ideias com IA</h3><p class="sub">Sobre qual tema? A IA cria ideias de carrossel no estilo da Marca, já com os slides.</p>
    <div class="seg" id="aiCat" style="flex-wrap:wrap;margin-bottom:10px">${Object.entries(IDEA_CATS).map(([k,c],i)=>`<button data-v="${k}" class="${i===0?'on':''}">${c.emoji} ${c.name}</button>`).join('')}</div>
    <input class="field" id="aiExtra" placeholder="Algo específico? (opcional) Ex.: objeções no consignado">
    <div class="prog hide" id="aiP"><b style="width:25%"></b></div><p class="snote" id="aiM"></p>
    <div class="btnrow"><button class="btn" data-x="c">Cancelar</button><button class="btn primary" data-x="go">Gerar 5 ideias</button></div>`);
  let cat = Object.keys(IDEA_CATS)[0];
  w.querySelector('#aiCat').onclick = e=>{ const b = e.target.closest('button'); if(!b) return; cat = b.dataset.v; w.querySelectorAll('#aiCat button').forEach(x=>x.classList.toggle('on',x===b)); };
  const ctl = new AbortController();
  w.querySelector('[data-x=c]').onclick = ()=>{ ctl.abort(); w.remove(); };
  w.querySelector('[data-x=go]').onclick = async ()=>{
    const btn = w.querySelector('[data-x=go]'); btn.disabled = true; btn.textContent = 'Gerando…';
    w.querySelector('#aiP').classList.remove('hide');
    let p = 25; const iv = setInterval(()=>{ p = Math.min(92, p+4); const b = w.querySelector('#aiP b'); if(b) b.style.width = p+'%'; }, 700);
    const existing = allIdeas().map(x=>'- ' + x.hook.replace(/\*/g,'')).join('\n');
    const prompt = `Você cria conteúdo de Instagram para a Marca Escola de Oratória e Negócios (Brasil): escola de oratória, comunicação, vendas e liderança. Ela tem o Marca Club (comunidade de alto valor), o Marca Conecta (café da manhã de empresárias), imersões e eventos, treinamentos B2B, mentorias, a Formação de Palestrantes, o "Método Vendedor de Marca" e o "Pitch de Alta Conversão". O método de storytelling usa histórias sem vitimização, com lições replicáveis e as 5 energias arquetípicas (Guerreiro, Curador, Mestre, Bobo, Visionário).
Crie 5 ideias NOVAS de carrossel de alto engajamento no tema "${IDEA_CATS[cat].name}"${(w.querySelector('#aiExtra').value||'').trim() ? ', com foco em: ' + w.querySelector('#aiExtra').value.trim() : ''}.
Não repita estas ideias que já existem:
${existing}
${COPY_RULES}
${BASE_CTX}
Regras adicionais: 5 a 7 slides por ideia; slide 1 "capa" com gancho de até 12 palavras; slides do meio "texto", "lista" (itens um por linha) ou "citacao"; último "cta" pedindo uma ação clara (comentar uma palavra, salvar, compartilhar). Destaque 1 a 2 palavras por slide com *asteriscos*. Não invente números, depoimentos ou fatos: quando precisar de um caso real, use [colchetes] para o autor preencher.
Responda SOMENTE com JSON: {"ideias":[{"hook":"...","fmt":"Lista|Passo a passo|Mito x verdade|História|Checklist|Polêmica|Comparação","obj":"salvar|compartilhar|comentar|vender|seguir","why":"por que engaja, em 1 frase","slides":[{"kind":"capa|texto|lista|citacao|cta","title":"...","body":"..."}]}]}`;
    try{
      const r = await sample.json(prompt, {signal:ctl.signal, modelTier:'default'});
      clearInterval(iv);
      const add = (r && Array.isArray(r.ideias) ? r.ideias : []).filter(x=>x && x.hook && Array.isArray(x.slides) && x.slides.length).map(x=>({
        id:'ai' + Date.now().toString(36) + Math.random().toString(36).slice(2,6), ai:true, cat, obj: IDEA_OBJ[x.obj] ? x.obj : 'salvar', fmt: String(x.fmt||'Ideia'), hook:String(x.hook), why:String(x.why||''), cta:'',
        slides: x.slides.map(s=>({kind: KINDS.some(k=>k[0]===s.kind) ? s.kind : 'texto', title:String(s.title||''), body:String(s.body||'')}))
      }));
      if(!add.length) throw {message:'vazio'};
      LS.set('ideas_custom', add.concat(LS.get('ideas_custom', [])).slice(0, 120));
      IDX.cat = cat; IDX.obj = ''; IDX.fav = false; w.remove(); ideaRender(); toast(add.length + ' ideias novas no topo da lista.');
    }catch(err){
      clearInterval(iv); if(ctl.signal.aborted) return;
      btn.disabled = false; btn.textContent = 'Tentar de novo';
      w.querySelector('#aiM').textContent = err && err.code==='rate_limited' ? 'Muitas solicitações agora. Espere um pouco.' : 'Não foi possível gerar agora. Tente de novo.';
    }
  };
}
