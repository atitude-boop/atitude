:root{
  --bg:#1c1c1e; --card:#2c2c2e; --card2:#161617; --line:#3a3a3c; --txt:#fff; --muted:#8e8e93; --muted2:#aeaeb2;
  --blue:#2f7bff; --blue2:#0a84ff; --red:#ff453a;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,Roboto,sans-serif;color:var(--txt);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.hide{display:none!important}
svg{display:block}

/* ---------- screens ---------- */
.screen{min-height:100%;padding:calc(var(--st) + 14px) calc(var(--sr) + 20px) calc(var(--sb) + 120px) calc(var(--sl) + 20px);max-width:900px;margin:0 auto}
.topbar{display:flex;justify-content:space-between;align-items:center;height:52px}
.pillbtn{height:46px;padding:0 22px;border-radius:23px;background:#2a2a2c;border:1px solid #3a3a3c;font-size:19px;font-weight:500;display:flex;align-items:center;gap:6px}
.pillbtn.on{background:var(--blue2);border-color:var(--blue2)}
.circbtn{width:52px;height:52px;border-radius:50%;background:#2a2a2c;border:1px solid #3a3a3c;display:grid;place-items:center;position:relative}
.circbtn .dot{position:absolute;top:10px;right:10px;width:9px;height:9px;border-radius:50%;background:#30d158;border:2px solid #2a2a2c}
.circbtn .dot.off{background:#ff9f0a}
h1.big{font-size:38px;font-weight:700;letter-spacing:-.02em;margin:22px 0 14px}
.tabs{display:flex;gap:8px;margin-bottom:22px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 16px;border-radius:18px;background:#2a2a2c;font-size:15px;font-weight:600;color:var(--muted2);white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab.on{background:#fff;color:#000}
.badge{background:var(--blue2);color:#fff;font-size:12px;min-width:20px;height:20px;border-radius:10px;display:inline-grid;place-items:center;padding:0 6px}
.tab.on .badge{background:var(--blue2)}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 20px}
@media (min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}}
@media (min-width:860px){.grid{grid-template-columns:repeat(5,1fr)}}
.section-label{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:26px 0 12px}
.section-label:first-child{margin-top:0}
.card{position:relative;aspect-ratio:.61;border-radius:10px;cursor:pointer;transition:transform .15s}
.card:active{transform:scale(.97)}
.card.folder{background:var(--card2);border:3px solid #111;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 8px 18%}
.card.folder svg{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%)}
.card.folder .fname{font-size:19px;font-weight:600;text-align:center;line-height:1.15;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.folder .fcount{font-size:12px;color:var(--muted);margin-top:4px}
.card.script{background:var(--card);padding:14px 12px;display:flex;flex-direction:column;overflow:hidden}
.card.script .stitle{font-size:19px;font-weight:700;line-height:1.18;word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;hyphens:auto}
.card.script .sprev{margin-top:auto;font-size:14px;line-height:1.3;color:var(--muted);display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.card .tag{position:absolute;top:8px;right:8px;font-size:10px;font-weight:700;background:var(--blue2);color:#fff;padding:2px 6px;border-radius:6px;text-transform:uppercase;letter-spacing:.04em}
.card .del{position:absolute;top:-8px;left:-8px;width:26px;height:26px;border-radius:50%;background:var(--red);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.4);z-index:2}
.editing .card{animation:jig .28s infinite alternate ease-in-out}
.editing .card:nth-child(2n){animation-delay:-.14s}
@keyframes jig{from{transform:rotate(-1deg)}to{transform:rotate(1deg)}}
.empty{color:var(--muted);text-align:center;padding:60px 20px;font-size:15px;line-height:1.5}
.empty b{display:block;color:#fff;font-size:18px;margin-bottom:6px}

/* atalhos da tela inicial */
.launch{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 22px}
@media (min-width:640px){.launch{grid-template-columns:repeat(4,1fr)}}
.lt-cal{background:linear-gradient(150deg,#0f8a5f,#064d35)}
.plc{background:#1c1c1e;border-radius:12px;padding:10px 12px;margin:0 0 8px;cursor:pointer}
.plc b{display:block;font-size:15px;margin:4px 0 2px;line-height:1.3}
.plc small{color:#8e8e93;font-size:12.5px}
.plc-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:#c7c7cc}
.plday{margin-bottom:10px}
.plday-h{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;color:#aeaeb2;margin:8px 2px 6px}
.plday.today .plday-h{color:#30d158}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:#1c1c1e;border-radius:12px;padding:10px}
.kpi small{display:block;font-size:11px;color:#8e8e93}
.kpi b{font-size:18px}
.libgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.libi{background:#1c1c1e;border-radius:10px;overflow:hidden;cursor:pointer}
.libi img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.libi .libtxt{aspect-ratio:1;padding:8px;font-size:11px;color:#d1d1d6;overflow:hidden}
.libi small{display:block;padding:6px 8px;font-size:11px;color:#8e8e93;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
select.field{appearance:auto;color:#fff}
.lt{border-radius:18px;padding:14px 10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:118px;position:relative;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.lt .li-ic{font-size:26px;margin-bottom:auto;line-height:1}
.lt b{font-size:15px;font-weight:700;line-height:1.15}
.lt small{font-size:11.5px;color:rgba(255,255,255,.75)}
.lt-tp{background:linear-gradient(150deg,#1a2fb0,#0a1352)}
.lt-vd{background:linear-gradient(150deg,#ff375f,#8a1a3a)}
.lt-cx{background:linear-gradient(150deg,#7b5cff,#3a1f99)}
.lt:active{transform:scale(.97)}
.ideabar{width:100%;display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,#3a2c00,#1c1c1e);border:1px solid #5a4500;border-radius:16px;padding:12px 14px;margin:-10px 0 22px;text-align:left}
.ideabar span{font-size:26px}
.ideabar b{display:block;font-size:15px}
.ideabar small{color:#c7c7cc;font-size:12px}
.hotbar{background:linear-gradient(90deg,#4a1100,#1c1c1e);border-color:#7a2a00}
.idea.alert.new{box-shadow:inset 3px 0 0 #ff6b2c}
.tagc.hot{background:rgba(255,107,44,.2);color:#ff8a50}
.idea{background:#1c1c1e;border-radius:16px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.idea:active{background:#26262a}
.idea b{display:block;font-size:16px;line-height:1.3;margin:6px 0 4px}
.idea small{color:#8e8e93;font-size:12.5px;line-height:1.35;display:block}
.idea-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tagc{font-size:11px;font-weight:600;background:#2c2c2e;color:#c7c7cc;padding:3px 8px;border-radius:8px}
.tagc.ok{background:rgba(48,209,88,.18);color:#30d158}
.favb{margin-left:auto;font-size:20px;line-height:1}
/* bottom bar */
.bottombar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:14px;align-items:center;padding:14px calc(var(--sr) + 20px) calc(var(--sb) + 16px) calc(var(--sl) + 20px);background:linear-gradient(rgba(28,28,30,0),var(--bg) 45%);z-index:20;max-width:900px;margin:0 auto}
.search{flex:1;min-width:0;height:58px;border-radius:29px;background:rgba(44,44,46,.92);border:1px solid #444;display:flex;align-items:center;gap:10px;padding:0 20px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.search input{flex:1;width:100%;background:none;border:0;outline:none;font-size:19px;min-width:0}
.search input::placeholder{color:var(--muted)}
.fab{width:62px;height:62px;border-radius:50%;background:var(--blue2);display:grid;place-items:center;box-shadow:0 6px 20px rgba(10,132,255,.45);flex-shrink:0}

/* menu popover */
.menu{position:fixed;right:calc(var(--sr) + 24px);bottom:calc(var(--sb) + 92px);width:min(330px,82vw);background:rgba(40,40,42,.97);border:1px solid #48484a;border-radius:26px;padding:8px 0;z-index:40;box-shadow:0 20px 50px rgba(0,0,0,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transform-origin:bottom right;animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.menu button{display:flex;align-items:center;gap:18px;width:100%;padding:15px 26px;font-size:19px;text-align:left}
.menu button:active{background:rgba(255,255,255,.08)}
.menu hr{border:0;border-top:1px solid #48484a;margin:6px 26px}
.scrim{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.25)}

/* folder header */
.backbtn{display:flex;align-items:center;gap:4px;color:var(--blue2);font-size:18px;font-weight:500;height:46px}

/* editor screen */
#scriptScreen{display:flex;flex-direction:column;min-height:100%;padding-bottom:calc(var(--sb) + 104px)}
.ed-actions{display:flex;gap:10px}
.iconbtn{width:44px;height:44px;border-radius:50%;background:#2a2a2c;display:grid;place-items:center}
#edTitle{width:100%;background:none;border:0;outline:none;font-size:30px;font-weight:700;letter-spacing:-.01em;margin:16px 0 6px}
#edTitle::placeholder{color:#555}
.ed-meta{font-size:13px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.ed-meta .chip{background:#2a2a2c;padding:3px 10px;border-radius:10px;color:var(--muted2)}
#edText{flex:1;width:100%;min-height:55vh;background:none;border:0;outline:none;resize:none;font-size:18px;line-height:1.6;color:#e5e5ea}
#edText[readonly]{color:#d1d1d6}
.playbar{position:fixed;left:0;right:0;bottom:0;padding:12px calc(var(--sr) + 20px) calc(var(--sb) + 16px) calc(var(--sl) + 20px);background:linear-gradient(rgba(28,28,30,0),var(--bg) 40%);z-index:20;display:flex;gap:10px;max-width:900px;margin:0 auto}
.bigbtn{flex:1;height:58px;border-radius:18px;background:var(--blue2);font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 24px rgba(10,132,255,.35)}
.bigbtn.ghost{flex:0 0 auto;padding:0 18px;background:#2a2a2c;box-shadow:none;font-size:16px}
.bigbtn.ghost.mini{flex-direction:column;gap:0;padding:0 10px;font-size:19px;line-height:1.1}
.bigbtn.ghost.mini small{font-size:10px;font-weight:600;color:#c7c7cc}

/* sheet / dialogs */
.sheetwrap{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:#242426;border-radius:22px 22px 0 0;padding:10px 20px calc(var(--sb) + 22px);animation:up .25s ease-out}
@media (min-width:600px){.sheetwrap{align-items:center}.sheet{border-radius:22px;padding-bottom:22px}}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.grab{width:38px;height:5px;border-radius:3px;background:#555;margin:0 auto 14px}
.sheet h3{font-size:20px;font-weight:700;margin-bottom:6px}
.sheet p.sub{font-size:14px;color:var(--muted);margin-bottom:16px;line-height:1.45}
.field{width:100%;height:52px;border-radius:12px;background:#1c1c1e;border:1px solid #3a3a3c;padding:0 14px;font-size:17px;outline:none}
.field:focus{border-color:var(--blue2)}
.btnrow{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;height:50px;border-radius:14px;background:#3a3a3c;font-size:17px;font-weight:600}
.btn.primary{background:var(--blue2)}
.btn.danger{background:var(--red)}
.list{border-radius:14px;background:#1c1c1e;overflow:hidden}
.li{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid #2c2c2e;font-size:17px;cursor:pointer;width:100%;text-align:left}
.li:last-child{border-bottom:0}
.li .sub{font-size:13px;color:var(--muted)}
.li .grow{flex:1;min-width:0}
.check{width:24px;height:24px;border-radius:50%;border:2px solid #555;flex-shrink:0;display:grid;place-items:center}
.li.sel .check{background:var(--blue2);border-color:var(--blue2)}
.avatar{width:36px;height:36px;border-radius:50%;background:#3a3a3c;display:grid;place-items:center;font-weight:700;font-size:15px;flex-shrink:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #2c2c2e}
.row:last-child{border-bottom:0}
.row label{font-size:16px}
.row .ctrl{display:flex;align-items:center;gap:10px}
.row input[type=range]{width:150px;accent-color:var(--blue2)}
.row .val{min-width:36px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}
.toggle{width:50px;height:30px;border-radius:30px;background:#48484a;position:relative;transition:.2s;flex-shrink:0}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on{background:#30d158}
.toggle.on::after{left:23px}
.seg{display:flex;background:#1c1c1e;border-radius:10px;padding:3px}
.seg button{padding:6px 10px;border-radius:8px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button.on{background:#48484a;color:#fff}
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 100px);transform:translateX(-50%);background:#3a3a3c;color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;z-index:90;max-width:88%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:fade .2s}

/* ---------- prompter ---------- */
#prompter{position:fixed;inset:0;background:#000;color:#fff;display:none;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;z-index:50}
#prompter.show{display:block}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;transition:opacity .25s}
#cam.mirror{transform:scaleX(-1)}
#cam.ghost{opacity:0}
#camdim{position:absolute;inset:0;background:#000;opacity:0;z-index:0;pointer-events:none;transition:opacity .2s}
.vlist .row{cursor:pointer}
.vlist .ck{color:var(--blue2);font-size:22px;font-weight:600}
#pview{position:absolute;inset:0;overflow:hidden;z-index:1}
#flip{position:absolute;inset:0}
#ptext{position:absolute;left:0;right:0;top:0;white-space:pre-wrap;word-wrap:break-word;will-change:transform}
#ptext.anim{transition:transform .45s cubic-bezier(.3,.7,.3,1)}
.shadowed #ptext{text-shadow:0 2px 10px rgba(0,0,0,.8),0 0 3px rgba(0,0,0,.7)}
#guide{position:absolute;left:0;right:0;height:0;pointer-events:none;z-index:2}
#guide.setas::before,#guide.setas::after{content:"";position:absolute;top:-14px;border:14px solid transparent}
#guide.setas::before{left:0;border-left-color:var(--blue2);border-right:0}
#guide.setas::after{right:0;border-right-color:var(--blue2);border-left:0}
#guide.faixa{background:rgba(10,132,255,.16)}
#guide.linha{border-top:2px solid rgba(10,132,255,.8)}
.fade-top,.fade-bot{position:absolute;left:0;right:0;height:14%;pointer-events:none;z-index:2}
.fade-top{top:0;background:linear-gradient(var(--pbg,#000),transparent)}
.fade-bot{bottom:0;background:linear-gradient(transparent,var(--pbg,#000))}
.shadowed .fade-top,.shadowed .fade-bot{display:none}
#count{position:absolute;inset:0;display:none;place-items:center;font-size:32vmin;font-weight:700;background:rgba(0,0,0,.45);z-index:20;text-shadow:0 4px 30px rgba(0,0,0,.6)}
#count.show{display:grid}
#ptip{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);background:rgba(20,20,22,.9);padding:10px 16px;border-radius:12px;font-size:15px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:25}
#ptip.show{opacity:1}

#ptop{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:14px;padding:calc(var(--st) + 10px) calc(var(--sr) + 18px) 14px calc(var(--sl) + 18px);z-index:10;transition:opacity .3s}
.pcirc{width:52px;height:52px;border-radius:50%;background:rgba(40,40,42,.55);border:1px solid rgba(255,255,255,.18);display:grid;place-items:center;flex-shrink:0;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.pcirc.blue{background:var(--blue2);border-color:rgba(255,255,255,.35);box-shadow:0 4px 18px rgba(10,132,255,.45)}
#ptitle{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:21px;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.6)}
#ptitle span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ptitle i{width:26px;height:26px;border-radius:50%;background:rgba(120,120,128,.4);display:grid;place-items:center;flex-shrink:0;font-style:normal}

#pbottom{position:absolute;left:0;right:0;bottom:0;padding:0 calc(var(--sr) + 14px) calc(var(--sb) + 14px) calc(var(--sl) + 14px);z-index:10;display:flex;flex-direction:column;align-items:center;gap:10px}
#pclock{background:rgba(20,20,22,.8);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:7px 16px 9px;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:16px;display:flex;gap:18px;position:relative;overflow:hidden;transition:opacity .3s}
#pclock .e{color:#aeaeb2}
#pclock .r{color:var(--blue2)}
#pclock .bar{position:absolute;left:0;bottom:0;height:4px;background:#30d158;width:0;border-radius:2px}
#panel{width:100%;max-width:560px;background:rgba(24,24,26,.82);border:1px solid rgba(255,255,255,.08);border-radius:28px;padding:14px 18px 12px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:opacity .3s}
.prow{display:flex;align-items:center;gap:8px}
.prow + .prow{margin-top:12px}
.prow .ani{font-size:22px;width:28px;text-align:center}
#pspeed{flex:1;accent-color:var(--blue2);height:30px}
#pspeedV{min-width:34px;text-align:right;font-size:20px;font-variant-numeric:tabular-nums}
.pib{width:42px;height:44px;display:grid;place-items:center;border-radius:12px;flex-shrink:0}
.pib.on{background:rgba(10,132,255,.25)}
.pmid{flex:1;min-width:0;display:flex;justify-content:center;align-items:center;gap:2px}
#pgo{height:44px;min-width:104px;padding:0 14px;border-radius:22px;background:var(--blue2);font-size:18px;font-weight:600;letter-spacing:.02em}
#recrow{width:100%;max-width:560px;display:flex;align-items:center;justify-content:space-between;position:relative;height:92px}
.rpill{height:50px;min-width:64px;padding:0 14px;border-radius:25px;background:rgba(20,20,22,.85);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px}
.rpill.on{background:rgba(10,132,255,.35)}
#eyeBtn{min-width:56px;padding:0 10px}
.rcirc{width:50px;height:50px;border-radius:50%;background:rgba(20,20,22,.85);display:grid;place-items:center;flex-shrink:0}
#zoombar{display:flex;gap:4px;background:rgba(20,20,22,.72);border-radius:22px;padding:4px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.zc{min-width:40px;height:36px;padding:0 8px;border-radius:18px;font-size:13px;font-weight:700;color:#fff}
.zc.on{background:rgba(255,255,255,.16);color:#ffd60a;font-size:14px}
#rstat .ico{width:26px;height:26px;border-radius:50%;background:#30d158;display:grid;place-items:center}
#rstat{color:#30d158}
#rstat.rec{color:#ff453a}
#rstat.rec .ico{background:#ff453a;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
#recBtn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:88px;height:88px;border-radius:50%;border:5px solid rgba(255,255,255,.92);background:transparent;display:grid;place-items:center;box-shadow:0 4px 20px rgba(0,0,0,.4)}
#recBtn b{width:70px;height:70px;border-radius:50%;background:#ff453a;transition:all .2s}
#recBtn.on b{width:34px;height:34px;border-radius:8px}
.hidden-ui #ptop,.hidden-ui #panel,.hidden-ui #pclock{opacity:0;pointer-events:none}
.hidden-ui.noclock #pclock{opacity:0}
.hidden-ui:not(.recorder) #pbottom{pointer-events:none}

/* settings */
.sgroup{background:#2c2c2e;border-radius:18px;padding:0 16px;margin-bottom:8px}
.sgroup .row{border-bottom:1px solid #3a3a3c;min-height:54px}
.sgroup .row:last-child{border-bottom:0}
.slabel{font-size:15px;font-weight:600;color:#8e8e93;margin:22px 4px 8px}
.snote{font-size:13px;color:#8e8e93;margin:6px 4px 0;line-height:1.4}
.navrow{width:100%;text-align:left;cursor:pointer}
.navrow .v{color:var(--blue2);font-size:16px;display:flex;align-items:center;gap:8px}
.chev{color:#636366;font-size:20px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin:2px 0 6px;position:sticky;top:-10px;background:#242426;padding:6px 0;z-index:2}
.sheet-head h3{margin:0;flex:1;text-align:center}
.okc{width:46px;height:46px;border-radius:50%;background:var(--blue2);display:grid;place-items:center}
.backc{width:46px;height:46px;border-radius:50%;background:#3a3a3c;display:grid;place-items:center}
.swatches{display:flex;gap:10px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid #555}
.sw.on{outline:3px solid var(--blue2);outline-offset:2px}
.stepbox{display:flex;align-items:center;gap:8px}
.stepbox button{width:36px;height:36px;border-radius:10px;background:#3a3a3c;font-size:20px}
.stepbox b{min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.kbd{display:inline-block;background:#3a3a3c;border-radius:6px;padding:1px 7px;font-size:13px;font-family:ui-monospace,Menlo,monospace;margin-right:4px}
/* result */
.result video{width:100%;max-height:52vh;border-radius:16px;background:#000;display:block}
.delpill{height:42px;padding:0 16px;border-radius:21px;background:rgba(255,69,58,.18);color:#ff453a;font-weight:600;display:inline-flex;align-items:center;gap:8px}
/* ---------- estúdio (carrossel e vídeo) ---------- */
.studio{position:fixed;inset:0;z-index:55;background:#0e0e10;display:flex;flex-direction:column;color:#fff}
.st-top{display:flex;align-items:center;gap:10px;padding:calc(var(--st) + 10px) calc(var(--sr) + 16px) 10px calc(var(--sl) + 16px)}
.st-top h2{flex:1;font-size:20px;font-weight:700;text-align:center}
.st-btn{height:40px;padding:0 16px;border-radius:20px;background:#2c2c2e;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.st-btn.primary{background:var(--blue2)}
.st-btn.ai{background:linear-gradient(135deg,#7b5cff,#2f7bff)}
.st-body{flex:1;overflow:auto;padding:0 calc(var(--sr) + 16px) calc(var(--sb) + 16px) calc(var(--sl) + 16px)}
.cx-strip{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 14px;scrollbar-width:none}
.cx-strip::-webkit-scrollbar{display:none}
.cx-slide{flex:0 0 auto;width:min(74vw,330px);scroll-snap-align:center;position:relative;cursor:pointer}
.cx-slide canvas{width:100%;height:auto;display:block;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.cx-slide .num{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.55);font-size:12px;font-weight:700;padding:2px 8px;border-radius:8px}
.cx-add{flex:0 0 auto;width:120px;border:2px dashed #3a3a3c;border-radius:10px;display:grid;place-items:center;color:#8e8e93;font-size:15px;font-weight:600;scroll-snap-align:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip2{flex:0 0 auto;height:36px;padding:0 14px;border-radius:18px;background:#2c2c2e;font-size:14px;font-weight:600;color:#d1d1d6;display:inline-flex;align-items:center;gap:6px}
.chip2.on{background:#fff;color:#000}
.chip2 .dot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,.3)}
.st-sec{font-size:13px;font-weight:600;color:#8e8e93;text-transform:uppercase;letter-spacing:.05em;margin:18px 2px 8px}
.st-card{background:#1c1c1e;border-radius:16px;padding:4px 14px}
.st-card .row{border-bottom:1px solid #2c2c2e}
.st-card .row:last-child{border-bottom:0}
.st-card input.field,.sheet textarea.field{background:#111;border-color:#333}
textarea.field{height:auto;min-height:90px;padding:12px 14px;line-height:1.4;resize:vertical;font-size:16px}
.cap-box{background:#1c1c1e;border-radius:14px;padding:14px;font-size:15px;line-height:1.5;white-space:pre-wrap;color:#e5e5ea}

/* editor de vídeo */
.vx-stage{display:flex;justify-content:center;align-items:center;padding:4px 0 10px}
.vx-stage{position:relative}
.an-prompt{display:flex;gap:8px;align-items:stretch;margin-top:10px}.an-prompt .field{flex:1;min-height:56px;font-size:15px}.an-prompt .st-btn{height:auto}
.vx-load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;color:#d1d1d6;background:rgba(14,14,16,.7)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid #444;border-top-color:#fff;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.vx-stage canvas{max-width:100%;max-height:36vh;border-radius:12px;background:#000;box-shadow:0 8px 30px rgba(0,0,0,.6)}
.vx-ctrl{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.vx-ctrl .t{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:#aeaeb2;min-width:92px;text-align:center}
.vx-play{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;flex-shrink:0}
.vx-timeline{position:relative;height:52px;border-radius:10px;overflow:hidden;background:#1c1c1e;flex:1;touch-action:none}
.vx-thumbs{position:absolute;inset:0;display:flex}
.vx-thumbs canvas{flex:1;height:100%;width:0;object-fit:cover}
.vx-shade{position:absolute;top:0;bottom:0;background:rgba(0,0,0,.6)}
.vx-sel{position:absolute;top:0;bottom:0;border:3px solid #ffd60a;border-radius:8px;pointer-events:none}
.vx-h{position:absolute;top:0;bottom:0;width:22px;margin-left:-11px;display:grid;place-items:center}
.vx-h b{width:6px;height:24px;border-radius:3px;background:#ffd60a;box-shadow:0 0 0 2px rgba(0,0,0,.4)}
.vx-ph{position:absolute;top:-2px;bottom:-2px;width:3px;margin-left:-1.5px;background:#fff;box-shadow:0 0 4px rgba(0,0,0,.8);pointer-events:none}
.vx-tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:6px 0;border-top:1px solid #222;margin-top:6px}
.vx-tabs::-webkit-scrollbar{display:none}
.vx-tab{flex:1 0 auto;min-width:62px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border-radius:12px;font-size:11px;font-weight:600;color:#8e8e93}
.vx-tab span{font-size:20px}
.vx-tab.on{color:#fff;background:#1c1c1e}
.vx-panel{min-height:120px}
.leadbar{background:linear-gradient(135deg,#0d3a1f,#1c1c1e);border-color:#30d15855}
.approvebar{background:linear-gradient(135deg,#3a2a00,#1c1c1e);border-color:#ffd60a55}
.ld-fup{margin-top:8px;padding-top:8px;border-top:1px solid #2c2c2e}.ld-fup b{font-size:13px;display:inline;color:#30d158}
.ag-log{max-height:38vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin:10px 0}
.ag-msg{padding:9px 12px;border-radius:14px;font-size:15px;line-height:1.35;max-width:88%;background:#2c2c2e;align-self:flex-start;white-space:pre-wrap}
.ag-msg.me{background:#0a84ff;color:#fff;align-self:flex-end}
.an-sp{margin-bottom:10px}
.plc.tk.done{opacity:.55}
.basebar{background:linear-gradient(135deg,#3a2a12,#1c1c1e);border-color:#ff9f0a55}
.headbar{background:linear-gradient(135deg,#1a1440,#1c1c1e);border-color:#5e5ce655}
.hd-head{background:linear-gradient(135deg,#0a3d91,#1c1c1e);border-radius:14px;padding:12px 14px;font-weight:700;font-size:16px;line-height:1.35;margin-bottom:12px}
.hd-list{padding:10px 14px}.hd-list div{font-size:14.5px;line-height:1.45;padding:6px 0;border-bottom:1px solid #2c2c2e}.hd-list div:last-child{border:0}
.hd-story{display:flex;gap:10px;background:#1c1c1e;border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:15px;line-height:1.4}
.hd-story small{display:block;color:#8e8e93;font-size:12.5px;margin-top:4px}
.hd-n{flex:0 0 26px;height:26px;border-radius:13px;background:#5e5ce6;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.hd-conv{display:flex;gap:10px;background:linear-gradient(135deg,#0d3a1f,#1c1c1e);border:1px solid #30d15844;border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14.5px;line-height:1.4}
.hd-conv small{display:block;color:#8ee6a8;font-size:12.5px;margin-top:3px}
.hd-conv-c{color:#d1d1d6;font-size:13.5px;margin-top:4px;white-space:pre-wrap}
.hd-conv-n{flex:0 0 24px;height:24px;border-radius:12px;background:#30d158;color:#04210f;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.hd-chat{display:flex;flex-direction:column;gap:8px}
.hd-msg{max-width:88%;padding:9px 12px;border-radius:14px;font-size:14.5px;line-height:1.45;white-space:pre-wrap}
.hd-msg.me{align-self:flex-end;background:#0a84ff}.hd-msg.ai{align-self:flex-start;background:#2c2c2e}
.vx-cut{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,rgba(255,69,58,.75) 0 6px,rgba(255,69,58,.45) 6px 12px);pointer-events:none}
.vx-cut.pend{width:3px;background:#ff9f0a}
.vx-cmd{display:flex;gap:8px;margin:6px 0 6px}
.vx-cmd .field{height:44px;font-size:15px}
.vx-quick{margin-bottom:4px;flex-wrap:nowrap;overflow-x:auto}
.vx-quick .chip2{flex:0 0 auto;font-size:13px}
.vx-cmd-out{font-size:13.5px;line-height:1.5;color:#d1d1d6;margin:2px 2px 4px}
.vx-cmd-out:empty{display:none}
.vx-guide{background:linear-gradient(135deg,#0a3d91,#1c1c1e);border:1px solid #0a84ff55;border-radius:14px;padding:12px 14px;margin:6px 0}
.vx-guide p{font-size:14px;line-height:1.45;margin:6px 0 10px;color:#e5e5ea}
.vx-g-top{display:flex;justify-content:space-between;align-items:center}
.vx-g-x{color:#8e8e93;font-size:16px;padding:2px 6px}
.vx-g-dots{display:flex;gap:4px;margin-top:8px}.vx-g-dots i{flex:1;height:4px;border-radius:2px;background:#3a3a3c}.vx-g-dots i.on{background:#0a84ff}
.vx-g-btns{display:flex;gap:8px;justify-content:flex-end}
.vx-cmd,.vx-quick,.vx-cmd-out,.vx-guide,.vx-tabs,.vx-ctrl{flex-shrink:0}
.vx-quick .chip2{min-height:34px}
.vx-top{position:sticky;top:0;z-index:5;background:#000;margin:0 -16px;padding:0 16px 2px;box-shadow:0 8px 16px -8px #000}
.vx-stage{position:relative}
.vx-nocap{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(0,0,0,.78);border:1px solid #00e5ff88;color:#fff;border-radius:20px;padding:8px 14px;font-size:13.5px;white-space:nowrap;z-index:2}
.vx-nocap b{color:#5ff0ff}
.capgal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.capt{background:#2c2c2e;border:2px solid transparent;border-radius:12px;overflow:hidden;padding:0;display:flex;flex-direction:column;align-items:stretch}
.capt img{width:100%;aspect-ratio:240/150;display:block}
.capt span{font-size:11.5px;color:#aeaeb2;padding:4px 2px 6px;text-align:center}
.capt.on{border-color:#00d4e6}.capt.on span{color:#fff}
#vxStudio .st-top .st-btn.primary{background:#00c2d6;color:#001a1d;font-weight:800}
#vxStudio .vx-tab.on{background:#00313a;color:#5ff0ff}
#vxStudio .vx-tab span{filter:saturate(1.3)}
#vxStudio .btn.primary,#vxStudio .vx-cmd .st-btn.primary{background:#00c2d6;color:#001a1d}
#vxStudio .seg button.on{background:#00c2d6;color:#001a1d}
#vxStudio .vx-sel{border-color:#00e5ff}
.vx-empty{background:#2a2000;border:1px solid #5a4500;border-radius:14px;padding:12px 14px;margin-bottom:10px}.vx-empty p{font-size:14px;color:#d1d1d6;margin:4px 0 0}
.vx-tip{font-size:13px;color:#aeaeb2;background:#1c1c1e;border-radius:10px;padding:8px 10px;margin:10px 0 0;line-height:1.45}
.cuelist .li{align-items:flex-start}
.cuelist textarea{width:100%;background:transparent;border:0;color:#fff;font-size:15px;resize:none;outline:none;line-height:1.35}
.prog{height:6px;border-radius:3px;background:#2c2c2e;overflow:hidden;margin-top:14px}
.prog b{display:block;height:100%;width:0;background:var(--blue2);transition:width .2s}

[data-launch]:not([data-launch="tp"]):not([data-launch="vd"]){display:none!important}
</style>
</head>
<body>

<!-- HOME / FOLDER -->
<div id="homeScreen" class="screen">
  <div class="topbar">
    <button class="pillbtn" id="editBtn">Editar</button>
    <button class="circbtn" id="accountBtn" title="Conta e sincronização">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M9.5 9.5a8 8 0 0 0 0 11M20.5 9.5a8 8 0 0 1 0 11M6 6a13 13 0 0 0 0 18M24 6a13 13 0 0 1 0 18"/><circle cx="15" cy="13.5" r="2.2" fill="#fff" stroke="none"/><path d="M15 16v9"/></svg>
      <span class="dot off" id="syncDot"></span>
    </button>
  </div>
  <div id="folderBack" class="hide" style="display:flex;justify-content:space-between;align-items:center"><button class="backbtn" id="backHome">
    <svg width="12" height="20" viewBox="0 0 12 20"><path d="M10 2L2 10l8 8" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg> <span id="backLabel">Meus Roteiros</span></button><button class="backbtn hide" id="sendFolder">Enviar pasta ➤</button></div>
  <h1 class="big" id="homeTitle">Meus Roteiros</h1>
  <div class="tabs" id="tabs"></div>
  <div id="content"></div>
</div>

<div class="bottombar" id="homeBar">
  <label class="search">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="7"/><path d="M16 16l5 5"/></svg>
    <input id="searchInput" placeholder="Buscar..." autocomplete="off">
  </label>
  <button class="fab" id="fab"><svg width="30" height="30" viewBox="0 0 30 30"><path d="M15 5v20M5 15h20" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg></button>
</div>

<!-- SCRIPT EDITOR -->
<div id="scriptScreen" class="screen hide">
  <div class="topbar">
    <button class="backbtn" id="edBack"><svg width="12" height="20" viewBox="0 0 12 20"><path d="M10 2L2 10l8 8" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg> <span id="edBackLabel">Voltar</span></button>
    <div class="ed-actions" id="edActions"></div>
  </div>
  <input id="edTitle" placeholder="Título do roteiro" autocomplete="off">
  <div class="ed-meta" id="edMeta"></div>
  <textarea id="edText" placeholder="Escreva ou cole aqui o seu roteiro…"></textarea>
</div>
<div class="playbar hide" id="playBar">
  <button class="bigbtn ghost" id="edSettings">Aa</button>
  <button class="bigbtn ghost mini" id="edCar" title="Criar carrossel"><span>🖼️</span><small>Carrossel</small></button>
  <button class="bigbtn ghost mini" id="edVid" title="Editar vídeo"><span>🎬</span><small>Vídeo</small></button>
  <button class="bigbtn" id="edPlay"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M4 2.5l11 6.5-11 6.5z" fill="#fff"/></svg> Teleprompter</button>
</div>

<input type="file" id="fileInput" accept=".txt,.md,.docx,text/plain" class="hide">

<!-- PROMPTER -->
<div id="prompter">
  <video id="cam" class="hide" playsinline muted autoplay></video>
  <div id="camdim"></div>
  <div id="pview"><div id="flip"><div id="ptext"></div></div></div>
  <div class="fade-top"></div><div class="fade-bot"></div>
  <div id="guide"></div>
  <div id="count"></div>
  <div id="ptip"></div>
  <div id="ptop">
    <button class="pcirc" id="pBackList" title="Voltar"><svg width="14" height="24" viewBox="0 0 14 24"><path d="M11 3L3 12l8 9" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button id="ptitle"><span id="ptitleT">Roteiro</span><i><svg width="12" height="8" viewBox="0 0 12 8"><path d="M1.5 1.5L6 6l4.5-4.5" stroke="#d1d1d6" stroke-width="2" fill="none" stroke-linecap="round"/></svg></i></button>
    <button class="pcirc blue" id="pEdit" title="Editar texto"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18l1-4L15.5 3.5a2.1 2.1 0 0 1 3 3L8 17z"/></svg></button>
  </div>
  <div id="pbottom">
    <div id="pclock"><span class="e" id="cE">E:00:00</span><span class="r" id="cR">R:00:00</span><span class="bar" id="cBar"></span></div>
    <div id="panel">
      <div class="prow">
        <span class="ani">🐢</span>
        <input type="range" id="pspeed" min="1" max="20" step="1">
        <span class="ani">🐇</span>
        <span id="pspeedV">6</span>
      </div>
      <div class="prow">
        <button class="pib" id="pSet" title="Ajustes"><svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="#fff" stroke-width="2"><circle cx="15" cy="15" r="4.5"/><path d="M15 2.5v4M15 23.5v4M2.5 15h4M23.5 15h4M6.2 6.2l2.8 2.8M21 21l2.8 2.8M6.2 23.8L9 21M21 9l2.8-2.8"/><circle cx="15" cy="15" r="9.5"/></svg></button>
        <div class="pmid">
          <button class="pib" id="pDir" title="Inverter direção"><svg width="30" height="26" viewBox="0 0 30 26" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 24V2M3 8l6-6 6 6"/><path d="M21 2v22M15 18l6 6 6-6" opacity=".6"/></svg></button>
          <button class="pib" id="pStart" title="Início"><svg width="26" height="22" viewBox="0 0 26 22" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2v18M24 11H6M12 5l-6 6 6 6"/></svg></button>
          <button id="pgo">INICIAR</button>
          <button class="pib" id="pEnd" title="Fim"><svg width="26" height="22" viewBox="0 0 26 22" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M24 2v18M2 11h18M14 5l6 6-6 6"/></svg></button>
        </div>
        <button class="pib" id="pCam" title="Câmera"><svg width="34" height="24" viewBox="0 0 34 24" fill="#fff"><rect x="1" y="3" width="22" height="18" rx="5"/><path d="M25 9l7-4.5v15L25 15z"/></svg></button>
      </div>
    </div>
    <div id="zoombar" class="hide"></div>
    <div id="recrow" class="hide">
      <span style="display:flex;gap:8px;align-items:center">
      <button class="rcirc" id="flipBtn" title="Trocar câmera"><svg width="26" height="22" viewBox="0 0 26 22" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h3l2-3h10l2 3h3v12H3z"/><path d="M9.5 12.5a3.5 3.5 0 0 1 6.2-2.2M16.5 12.5a3.5 3.5 0 0 1-6.2 2.2"/><path d="M15.7 8.2v2.1h-2.1M10.3 16.8v-2.1h2.1"/></svg></button>
      <button class="rpill" id="eyeBtn" title="Mostrar/ocultar câmera"><svg width="34" height="22" viewBox="0 0 34 22" fill="none" stroke="#fff" stroke-width="2"><path d="M2 11s5.5-9 15-9 15 9 15 9-5.5 9-15 9S2 11 2 11z"/><circle cx="17" cy="11" r="4.5"/><path d="M5 2l24 18" id="eyeSlash"/></svg></button>
      </span>
      <button id="recBtn" title="Gravar"><b></b></button>
      <span class="rpill" id="rstat"><span class="ico"><svg width="10" height="12" viewBox="0 0 10 12"><rect x="0" y="0" width="3.5" height="12" rx="1" fill="#000"/><rect x="6.5" y="0" width="3.5" height="12" rx="1" fill="#000"/></svg></span><span id="rstatT">STBY</span></span>
    </div>
  </div>
</div>

/* =====================================================
   DATA
   ===================================================== */
let db = null, user = null, me = null, isOwner = false, myName = '';
let cloudMine = false;          // roteiros pessoais na nuvem?
const mine = new Map();         // id -> item {id,type:'folder'|'script',name,text,parent,updated}
let pub = [];                   // enviados para todos
let inbox = [];                 // enviados só para mim
let members = [];               // ids de quem já abriu (visível p/ o dono)
const sent = {};                // dono: pid -> itens enviados para essa pessoa
const inboxSubs = {};
const nameCache = {};
let loading = true;

function loadLocal(){
  mine.clear();
  (LS.get('items', [])).forEach(it => mine.set(it.id, it));
}
function saveLocal(){ LS.set('items', [...mine.values()]); }
loadLocal();

const writeChains = {};
function chain(key, fn){
  const p = (writeChains[key] || Promise.resolve()).then(fn, fn);
  writeChains[key] = p.catch(()=>{});
  return p;
}
function cleanItem(it){
  const o = {type:it.type, name:it.name||'', parent:it.parent||null, updated:it.updated||Date.now()};
  if(it.type==='script') o.text = it.text||'';
  return o;
}
async function putMine(it){
  it.updated = Date.now();
  mine.set(it.id, it);
  if(!cloudMine){ saveLocal(); return; }
  return chain(it.id, async ()=>{
    try{ await db.collection('data/users/'+me).doc(it.id).set(cleanItem(it)); }
    catch(e){ handleWriteErr(e); }
  });
}
async function delMine(id){
  mine.delete(id);
  if(!cloudMine){ saveLocal(); return; }
  return chain(id, async ()=>{
    try{ await db.collection('data/users/'+me).doc(id).delete(); }
    catch(e){ handleWriteErr(e); }
  });
}
function handleWriteErr(e){
  if(e && e.code==='quota_exceeded'){ toast('Espaço cheio. Apague alguns roteiros para salvar novos.', 4000); return; }
  if(e && (e.code==='invalid_argument' || e.code==='revoked' || e.code==='not_granted')){
    // sem permissão de gravar na nuvem: passa a guardar neste aparelho
    cloudMine = false; saveLocal(); updateSync();
    toast('Sem permissão para salvar na nuvem. Seus roteiros ficam salvos neste aparelho.', 4200);
    return;
  }
  toast('Não foi possível salvar agora. Tente de novo.');
}

async function initCloud(){
  if(!(window.claude && typeof window.claude.use === 'function')){ user = LOCAL_USER; db = LOCAL_DB; }
  else try{
    user = await window.claude.use('user');
    db = await window.claude.use('db');
  }catch(e){ db = null; }
  if(user){ try{ isOwner = !!user.isOwner(); }catch(e){} }
  if(!db || !user){ loading=false; updateSync(); render(); return; }
  try{ me = await user.id(); }catch(e){ me = null; }
  try{ const p = await user.me(); myName = (p && p.name) || ''; }catch(e){}
  if(!me){ loading=false; updateSync(); render(); return; }

  const timer = setTimeout(()=>{ if(loading){ loading=false; render(); toast('A nuvem está demorando para responder. Mostrando o que está salvo aqui.'); } }, 10000);

  // roteiros pessoais
  const localBefore = [...mine.values()];
  cloudMine = true;
  db.collection('data/users/'+me).onSnapshot(snap=>{
    if(!cloudMine) return;
    mine.clear();
    snap.docs.forEach(d=>{ const x = d.data(); if(x) mine.set(d.id, Object.assign({id:d.id}, x)); });
    if(!snap.metadata.fromCache){
      clearTimeout(timer); loading=false;
      // leva para a nuvem roteiros que estavam só neste aparelho
      if(localBefore.length && !LS.get('migrated_'+me, false)){
        LS.set('migrated_'+me, true);
        localBefore.forEach(it=>{ if(!mine.has(it.id)) putMine(Object.assign({}, it)); });
      }
    }
    updateSync(); render(); refreshOpenEditor(); refreshPrompterText();
  }, err=>{ clearTimeout(timer); loading=false; cloudMine=false; loadLocal(); updateSync(); render(); });

  watchAlerts();
  plWatch(); try{ watchEventos(); }catch(e){}
  watchBrief();
  watchHist();
  watchTasks();
  watchRadar();
  watchPlans();
  ldWatch();
  // enviados para todos
  db.collection('pub').onSnapshot(snap=>{
    pub = snap.docs.map(d=>Object.assign({id:d.id, scope:'all'}, d.data()));
    render();
  }, ()=>{});

  if(isOwner){
    db.collection('members').onSnapshot(snap=>{
      members = snap.docs.map(d=>d.id).filter(x=>x!==me);
      members.forEach(watchInbox);
      fetchNames(members);
    }, ()=>{});
  } else {
    db.doc('inbox/'+me).collection('items').onSnapshot(snap=>{
      inbox = snap.docs.map(d=>Object.assign({id:d.id, scope:'me'}, d.data()));
      render();
    }, ()=>{});
    // registra presença (uma vez por dia) para o dono poder enviar roteiros
    try{
      const ref = db.doc('members/'+me);
      const s = await ref.get();
      const last = s.exists ? (s.data().seen||0) : 0;
      if(Date.now() - last > 86400000) await ref.set({seen:Date.now()});
    }catch(e){}
  }
}

function watchInbox(pid){
  if(!db || inboxSubs[pid] || Object.keys(inboxSubs).length > 55) return;
  inboxSubs[pid] = db.doc('inbox/'+pid).collection('items').onSnapshot(snap=>{
    sent[pid] = snap.docs.map(d=>Object.assign({id:d.id, scope:pid}, d.data()));
    render();
  }, ()=>{});
}
async function fetchNames(ids){
  if(!user || !ids.length) return;
  try{ const ps = await user.profiles(ids) || {}; ids.forEach(id=>{ if(ps[id] && ps[id].name) nameCache[id] = ps[id].name; }); render(); }catch(e){}
}
function personName(id){ return nameCache[id] || 'Pessoa'; }

function updateSync(){
  const d = $('syncDot');
  if(RECORDER){ d.style.display='none'; return; }
  d.classList.toggle('off', !cloudMine);
}

/* =====================================================
   NAV STATE
   ===================================================== */
const S = { tab:'mine', folder:null, edit:false, q:'', screen:'home', cur:null, curKind:'mine', recvFolder:null };

function received(){
  const list = isOwner ? [...pub, ...Object.values(sent).flat()] : [...pub, ...inbox];
  list.forEach(i=>{ i.key = i.scope+':'+i.id; });
  return list.sort((a,b)=>(b.sentAt||0)-(a.sentAt||0));
}
function counts(){ return { recv: received().length }; }

/* =====================================================
   RENDER HOME
   ===================================================== */
function render(){
  if(S.screen!=='home') return;
  const content = $('content');
  const inFolder = S.tab==='mine' && S.folder && mine.get(S.folder);
  const inRecvFolder = S.tab!=='mine' && S.recvFolder !== null;
  if(S.tab==='mine' && S.folder && !inFolder) S.folder = null;

  // header
  $('folderBack').classList.toggle('hide', !(inFolder || inRecvFolder));
  $('backLabel').textContent = S.tab==='mine' ? 'Meus Roteiros' : (isOwner ? 'Enviados' : 'Recebidos');
  $('homeTitle').textContent = inFolder ? inFolder.name : inRecvFolder ? (S.recvFolder || 'Sem pasta') : (S.tab==='mine' ? 'Meus Roteiros' : (isOwner ? 'Enviados' : 'Recebidos'));
  $('sendFolder').classList.toggle('hide', !(inFolder && isOwner && db));
  $('editBtn').textContent = S.edit ? 'OK' : 'Editar';
  $('editBtn').classList.toggle('on', S.edit);
  $('editBtn').classList.toggle('hide', S.tab!=='mine' && !isOwner);
  $('fab').classList.toggle('hide', S.tab!=='mine');

  // tabs
  const tabs = $('tabs');
  const showTabs = !(inFolder||inRecvFolder) && (counts().recv || isOwner);
  tabs.classList.toggle('hide', !showTabs);
  if(showTabs){
    const n = counts().recv;
    tabs.innerHTML = `<button class="tab ${S.tab==='mine'?'on':''}" data-tab="mine">Meus</button>`+
      `<button class="tab ${S.tab==='recv'?'on':''}" data-tab="recv">${isOwner?'Enviados':'Recebidos'} ${n?`<span class="badge">${n}</span>`:''}</button>`;
  }

  content.classList.toggle('editing', S.edit);
  const q = S.q.trim().toLowerCase();
  const match = it => !q || (it.name||'').toLowerCase().includes(q) || (it.text||'').toLowerCase().includes(q);

  if(S.tab==='mine'){
    const all = [...mine.values()];
    let folders = [], scripts = [];
    if(q){
      scripts = all.filter(i=>i.type==='script' && match(i));
      folders = all.filter(i=>i.type==='folder' && (i.name||'').toLowerCase().includes(q));
    } else {
      const parent = S.folder || null;
      folders = parent ? [] : all.filter(i=>i.type==='folder');
      scripts = all.filter(i=>i.type==='script' && (i.parent||null)===parent);
    }
    folders.sort((a,b)=>(a.name||'').localeCompare(b.name||'','pt'));
    scripts.sort((a,b)=>(b.updated||0)-(a.updated||0));
    const launch = (!inFolder && !q) ? launcherHTML() : '';
    if(!folders.length && !scripts.length){
      content.innerHTML = launch + (loading ? `<div class="empty">Carregando…</div>` :
        q ? `<div class="empty"><b>Nada encontrado</b>Tente outra palavra.</div>` :
        inFolder ? `<div class="empty"><b>Pasta vazia</b>Toque no + para escrever um roteiro aqui dentro.</div>` :
        `<div class="empty"><b>Nenhum roteiro ainda</b>Toque no + para criar uma pasta ou escrever seu primeiro roteiro.</div>`);
      return;
    }
    let h = launch + (launch ? '<div class="section-label" style="margin-top:4px">Roteiros</div>' : '');
    if(folders.length) h += `<div class="grid">${folders.map(folderCard).join('')}</div>`;
    if(scripts.length) h += `<div class="grid" style="margin-top:${folders.length?'34px':'0'}">${scripts.map(it=>scriptCard(it,'mine')).join('')}</div>`;
    content.innerHTML = h;
    return;
  }

  // Recebidos / Enviados
  const items = received().filter(match);
  if(!items.length){
    content.innerHTML = isOwner
      ? `<div class="empty"><b>Nenhum roteiro enviado</b>Abra um roteiro seu e toque no avião de papel para enviar para todos ou para pessoas específicas.</div>`
      : `<div class="empty"><b>Nada recebido ainda</b>Quando você receber roteiros, eles aparecem aqui.</div>`;
    return;
  }
  if(q || inRecvFolder){
    const list = q ? items : items.filter(i=>(i.folder||'')===S.recvFolder);
    content.innerHTML = `<div class="grid">${list.map(it=>scriptCard(it,'recv')).join('')}</div>`;
    return;
  }
  const groups = {};
  items.forEach(i=>{ const f = i.folder||''; (groups[f] = groups[f]||[]).push(i); });
  const fnames = Object.keys(groups).filter(f=>f).sort((a,b)=>a.localeCompare(b,'pt'));
  let h = '';
  if(fnames.length) h += `<div class="grid">${fnames.map(f=>`<div class="card folder" data-rfolder="${esc(f)}">${ICON.folder}<div class="fname">${esc(f)}</div><div class="fcount">${groups[f].length} roteiro${groups[f].length>1?'s':''}</div></div>`).join('')}</div>`;
  const loose = groups[''] || [];
  if(loose.length) h += `<div class="grid" style="margin-top:${fnames.length?'34px':'0'}">${loose.map(it=>scriptCard(it,'recv')).join('')}</div>`;
  content.innerHTML = h;
}

function scriptOptions(){
  return [...mine.values()].filter(i=>i.type==='script').sort((a,b)=>(b.updated||0)-(a.updated||0))
    .map(i=>{ const f = i.parent && mine.get(i.parent); return {v:i.id, label:i.name||'Sem título', sub: (f ? '📁 '+f.name+' · ' : '') + ((i.text||'').trim().split(/\s+/).filter(Boolean).length) + ' palavras'}; });
}
async function askNewText(title, sub){
  return new Promise(res=>{
    const w = sheet(`<div class="grab"></div><h3>${esc(title)}</h3><p class="sub">${esc(sub)}</p>
      <input class="field" id="ntT" placeholder="Título" style="margin-bottom:10px">
      <textarea class="field" id="ntX" rows="8" style="min-height:200px" placeholder="Cole ou escreva o texto aqui…"></textarea>
      <div class="btnrow"><button class="btn" data-x="c">Cancelar</button><button class="btn primary" data-x="o">Continuar</button></div>`);
    w.querySelector('[data-x=c]').onclick = ()=>{ w.remove(); res(null); };
    w.querySelector('[data-x=o]').onclick = async ()=>{
      const name = w.querySelector('#ntT').value.trim(), text = w.querySelector('#ntX').value;
      if(!text.trim()){ toast('Escreva ou cole o texto primeiro.'); return; }
      w.remove();
      const it = {id:uid(), type:'script', name: name || text.trim().split(/\s+/).slice(0,6).join(' '), text, parent:null};
      await putMine(it); render(); res(it);
    };
  });
}
async function chooseScript(title, newLabel, newSub){
  const opts = [{v:'__new', label:'+ ' + newLabel, sub:newSub}].concat(scriptOptions());
  const v = await pickOne(title, opts, null);
  if(!v) return null;
  if(v === '__new') return await askNewText(newLabel, newSub);
  return mine.get(v);
}
async function launch(kind){
  if(kind === 'ideas'){ openIdeas(); return; }
  if(kind === 'alerts'){ openAlerts(); return; }
  if(kind === 'head'){ openHead(); return; }
  if(kind === 'base'){ openBase(); return; }
  if(kind === 'clone'){ openClone(); return; }
  if(kind === 'area'){ openArea(); return; }
  if(kind === 'leads'){ openLeads(); return; }
  if(kind === 'approve'){ openApprovals(); return; }
  if(kind === 'cal'){ openPlanner(); return; }
  if(kind === 'cx'){
    const first = await pickOne('Carrossel', [{v:'ideas', label:'💡 Começar por uma ideia pronta', sub:'Banco de ideias da Marca, com slides rascunhados'},{v:'text', label:'📝 A partir de um roteiro ou texto', sub:'Seus roteiros ou um texto novo'}], null);
    if(!first) return;
    if(first === 'ideas'){ openIdeas(); return; }
    const it = await chooseScript('Carrossel a partir de qual texto?', 'Novo texto', 'Cole um roteiro, legenda ou ideia e o app monta os slides.');

    openScript(it, 'mine'); openCarousel();
  } else if(kind === 'tp'){
    const it = await chooseScript('Qual roteiro você vai ler?', 'Novo roteiro', 'Escreva ou cole o texto que vai aparecer no teleprompter.');
    if(!it) return;
    openScript(it, 'mine'); openPrompter();
  } else if(kind === 'vd'){
    const opts = [
      {v:'file', label:'🎞️  Escolher vídeo do celular', sub:'Abre direto no editor'},
      {v:'cam',  label:'📱  Gravar agora e editar', sub:'Abre a câmera do iPhone e já cai no editor'},
      {v:'pip',  label:'📺  Gravar com teleprompter flutuante', sub:'O roteiro rola numa janelinha por cima da câmera'}
    ];
    if(RECORDER) opts.push({v:'rec', label:'🎥  Gravar com o teleprompter', sub:'O texto rola enquanto grava, e as legendas já vêm sincronizadas'});
    if(isOwner) opts.push({v:'clone', label:'🎭  Clone Usuario (HeyGen)', sub:'Seu gêmeo digital grava o roteiro por você, com seu rosto e sua voz'});
    if(isOwner) opts.push({v:'filme', label:'🎬  Filme narrado (HeyGen)', sub:'Minifilme realista com pessoas e situações, você aparecendo e narrando com a sua voz'});
    if(isOwner) opts.push({v:'anpro', label:'🎌  Anime Pro (HeyGen)', sub:'Você vira personagem de anime com animação real e a sua voz narrando'});
    opts.push({v:'animsp', label:'🎬  Especialista de anime', sub:'Escreva a ideia e ele cria o vídeo animado do zero: roteiro, desenhos, estilo e trilha'});
    opts.push({v:'anim', label:'🎨  Criar vídeo animado', sub:'Personagem e cenas animadas a partir de um roteiro, sem gravar'});
    const v = await pickOne('Edição de vídeo', opts, null);
    if(v === 'anim'){ openAnim(); return; }
    if(v === 'animsp'){ openAnimSpecialist(); return; }
    if(v === 'anpro'){ openAnimePro(''); return; }
    if(v === 'filme'){ openFilmPro(''); return; }
    if(v === 'clone'){ openClone(S.cur && S.cur.text ? S.cur.text : ''); return; }
    if(v === 'pip'){ const list = scriptOptions(); if(!list.length) return toast('Escreva um roteiro primeiro.'); const id = await pickOne('Qual roteiro vai ler?', list, null); if(!id) return; const it = mine.get(id); S.cur = it; openPipPrompter(it.text, it.name); return; }
    if(v === 'file' || v === 'cam'){
      S.cur = null;
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'video/*'; if(v === 'cam') inp.setAttribute('capture', 'user');
      inp.style.display = 'none'; document.body.appendChild(inp);
      const f = await new Promise(res=>{ inp.onchange = ()=>res(inp.files && inp.files[0] || null); inp.click(); });
      inp.remove(); if(!f) return;
      openVideoEditor({blob:f});
    } else if(v === 'rec'){
      const it = await chooseScript('Qual roteiro você vai gravar?', 'Novo roteiro', 'Escreva ou cole o texto que vai aparecer no teleprompter.');
      if(!it) return;
      openScript(it, 'mine'); openPrompter();
    }
  }
}

function folderCard(f){
  const n = [...mine.values()].filter(i=>i.type==='script' && i.parent===f.id).length;

function preview(t){ return (t||'').replace(/\s+/g,' ').trim().slice(0,140); }
function scriptCard(it, kind){
  let tag = '';
  if(kind==='recv'){
    if(isOwner) tag = `<span class="tag">${it.scope==='all' ? 'Todos' : esc(personName(it.scope).split(' ')[0])}</span>`;

  const del = S.edit && (kind==='mine' || isOwner) ? `<button class="del" data-del="${esc(key)}" data-kind="${kind}">${ICON.del}</button>` : '';
  return `<div class="card script" data-script="${esc(key)}" data-kind="${kind}">${del}${tag}<div class="stitle">${esc(it.name||'Sem título')}</div><div class="sprev">${esc(preview(it.text))}</div></div>`;

/* ---------- home events ---------- */
$('content').addEventListener('click', async e=>{
  const ln = e.target.closest('[data-launch]');
  if(ln){ launch(ln.dataset.launch); return; }
  const del = e.target.closest('[data-del]');
  if(del){
    e.stopPropagation();
    const id = del.dataset.del, kind = del.dataset.kind || 'mine';
    if(kind==='recv'){ const it = received().find(x=>x.key===id); if(it) unsend(it); return; }
    const it = mine.get(id); if(!it) return;
    if(it.type==='folder'){
      const inside = [...mine.values()].filter(i=>i.parent===id);
      const ok = await confirmBox('Apagar pasta "'+it.name+'"?', inside.length ? `Os ${inside.length} roteiro(s) dentro dela também serão apagados.` : 'A pasta está vazia.', 'Apagar');
      if(!ok) return;
      for(const s of inside) await delMine(s.id);
      await delMine(id);
    } else {
      const ok = await confirmBox('Apagar "'+(it.name||'Sem título')+'"?', 'Essa ação não pode ser desfeita.', 'Apagar');
      if(!ok) return;
      await delMine(id);
    }
    render(); return;
  }
  const f = e.target.closest('[data-folder]');
  if(f){
    const it = mine.get(f.dataset.folder);
    if(S.edit){
      const name = await askText('Renomear pasta', 'Nome da pasta', it.name);
      if(name){ it.name = name; await putMine(it); render(); }
      return;
    }
    S.folder = f.dataset.folder; S.q=''; $('searchInput').value=''; render(); window.scrollTo(0,0); return;
  }
  const rf = e.target.closest('[data-rfolder]');
  if(rf){ S.recvFolder = rf.dataset.rfolder; render(); window.scrollTo(0,0); return; }
  const s = e.target.closest('[data-script]');
  if(s){
    const kind = s.dataset.kind;
    const it = kind==='mine' ? mine.get(s.dataset.script) : received().find(x=>x.key===s.dataset.script);
    if(it) openScript(it, kind);
  }
});

$('fab').onclick = ()=>{
  const scrim = document.createElement('div'); scrim.className='scrim';
  const m = document.createElement('div'); m.className='menu';
  const inFolder = !!S.folder;
  m.innerHTML = (inFolder ? '' : `<button data-a="folder">${ICON.folderMenu} Nova Pasta</button><hr>`) +
    `<button data-a="import">${ICON.doc} Importar Documento</button>`+

    `<button data-a="video"><span style="width:30px;text-align:center;font-size:24px">🎬</span> Editar um Vídeo</button>`;
  const close = ()=>{ scrim.remove(); m.remove(); };
  scrim.onclick = close;
  m.onclick = async e=>{
    const b = e.target.closest('[data-a]'); if(!b) return; close();
    if(b.dataset.a==='folder'){
      const name = await askText('Nova pasta', 'Nome da pasta (ex.: Clientes, Eventos)');
      if(name){ await putMine({id:uid(), type:'folder', name}); render(); }
    } else if(b.dataset.a==='write'){
      const it = {id:uid(), type:'script', name:'', text:'', parent:S.folder||null};
      openScript(it, 'mine', true);
    } else if(b.dataset.a==='video'){
      S.cur = null; openVideoEditor({});
    } else if(b.dataset.a==='import'){
      $('fileInput').value=''; $('fileInput').click();
    }
  };
  document.body.append(scrim, m);
};

$('fileInput').addEventListener('change', async e=>{
  const file = e.target.files && e.target.files[0]; if(!file) return;
  const base = file.name.replace(/\.[^.]+$/,'');
  try{
    let text = '';
    if(/\.docx$/i.test(file.name)){
      toast('Lendo documento…');
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
      const buf = await file.arrayBuffer();
      const r = await window.mammoth.extractRawText({arrayBuffer:buf});
      text = r.value;
    } else {
      text = await file.text();
    }
    text = text.replace(/\r\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
    const it = {id:uid(), type:'script', name:base, text, parent:S.folder||null};
    await putMine(it); render(); openScript(it,'mine');
  }catch(err){ toast('Não consegui ler esse arquivo. Use .txt ou .docx.'); }
});
function loadScript(src){
  return new Promise((res,rej)=>{ if(window.mammoth) return res(); const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
}

let saveTimer = 0, isNew = false;
function openScript(it, kind, fresh){
  S.cur = it; S.curKind = kind; isNew = !!fresh;
  S.screen='script';
  $('homeScreen').classList.add('hide'); $('homeBar').classList.add('hide');
  $('scriptScreen').classList.remove('hide'); $('playBar').classList.remove('hide');
  const ro = kind!=='mine';
  $('edTitle').value = it.name||''; $('edTitle').readOnly = ro;
  $('edText').value = it.text||''; $('edText').readOnly = ro;
  $('edBackLabel').textContent = kind==='mine' ? (it.parent && mine.get(it.parent) ? mine.get(it.parent).name : 'Meus Roteiros') : (isOwner?'Enviados':'Recebidos');
  let acts = '';
  if(kind==='mine'){
    acts += `<button class="iconbtn" id="aMulti" title="Multiplicar em vários formatos" style="font-size:18px">🔁</button>`;
    acts += `<button class="iconbtn" id="aCal" title="Colocar no calendário" style="font-size:18px">📅</button>`;
    acts += `<button class="iconbtn" id="aMove" title="Mover para pasta">${ICON.move}</button>`;
    if(isOwner && db) acts += `<button class="iconbtn" id="aSend" title="Enviar">${ICON.send}</button>`;
    acts += `<button class="iconbtn" id="aDel" title="Apagar">${ICON.trash}</button>`;
  } else {
    acts += `<button class="iconbtn" id="aCopy" title="Copiar para Meus Roteiros">${ICON.copy}</button>`;
    if(isOwner) acts += `<button class="iconbtn" id="aUnsend" title="Cancelar envio">${ICON.trash}</button>`;
  }
  $('edActions').innerHTML = acts;
  updateMeta();
  window.scrollTo(0,0);
  if(fresh) setTimeout(()=>$('edTitle').focus(), 50);
}
function updateMeta(){
  const it = S.cur; if(!it) return;
  const words = ($('edText').value.trim().match(/\S+/g)||[]).length;
  const secs = Math.round(words/140*60);
  let chips = `<span>${words} palavras · ~${fmt(secs)} de leitura</span>`;
  if(S.curKind==='mine'){
    const f = it.parent && mine.get(it.parent);
    chips += `<span class="chip">${f ? '📁 '+esc(f.name) : 'Sem pasta'}</span>`;
  } else {
    if(it.folder) chips += `<span class="chip">📁 ${esc(it.folder)}</span>`;
    chips += `<span class="chip">${isOwner ? (it.scope==='all'?'Enviado para todos':'Enviado para '+esc(personName(it.scope))) : 'Somente leitura'}</span>`;
  }
  $('edMeta').innerHTML = chips;
}
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 700);
}
async function saveNow(){
  clearTimeout(saveTimer);
  const it = S.cur; if(!it || S.curKind!=='mine') return;
  const name = $('edTitle').value.trim(), text = $('edText').value;
  if(isNew && !name && !text.trim()) return;
  if(!isNew && it.name===name && it.text===text) return;
  it.name = name; it.text = text; isNew = false;
  await putMine(it);
}
function refreshOpenEditor(){
  // atualiza se o roteiro aberto mudou em outro aparelho (e não está sendo digitado)
  if(S.screen!=='script' || S.curKind!=='mine' || !S.cur) return;
  const fresh = mine.get(S.cur.id); if(!fresh) return;
  const active = document.activeElement;
  if(active===$('edText') || active===$('edTitle')) return;
  if(fresh.text !== $('edText').value || fresh.name !== $('edTitle').value){
    S.cur = fresh; $('edText').value = fresh.text||''; $('edTitle').value = fresh.name||''; updateMeta();
  }
}
$('edTitle').addEventListener('input', scheduleSave);
$('edText').addEventListener('input', ()=>{ updateMeta(); scheduleSave(); });
$('edBack').onclick = async ()=>{
  await saveNow();
  S.screen='home'; S.cur=null;
  $('scriptScreen').classList.add('hide'); $('playBar').classList.add('hide');
  $('homeScreen').classList.remove('hide'); $('homeBar').classList.remove('hide');
  render();
};
$('edActions').addEventListener('click', async e=>{
  const b = e.target.closest('button'); if(!b) return;
  const it = S.cur;
  if(b.id==='aMulti'){ openMultiply(); return; }
  if(b.id==='aCal'){ await saveNow(); addToCalendar({title: it.name || 'Sem título', stage:'roteiro', scriptId: it.id, notes: (it.text||'').slice(0,600), brand: CUR_BRAND}); return; }
  if(b.id==='aDel'){
    if(await confirmBox('Apagar este roteiro?', 'Essa ação não pode ser desfeita.', 'Apagar')){
      clearTimeout(saveTimer); isNew=false; if(mine.has(it.id)) await delMine(it.id); $('edBack').click();
    }
  } else if(b.id==='aMove'){
    const folders = [...mine.values()].filter(i=>i.type==='folder').sort((a,b)=>a.name.localeCompare(b.name,'pt'));
    const opts = [{v:'__none', label:'Sem pasta', sub:'Fica solto em Meus Roteiros'}].concat(folders.map(f=>({v:f.id,label:f.name}))).concat([{v:'__new', label:'+ Nova pasta…'}]);
    const v = await pickOne('Mover para pasta', opts, it.parent||'__none');
    if(!v) return;
    let target = v==='__none' ? null : v;
    if(v==='__new'){
      const name = await askText('Nova pasta', 'Nome da pasta'); if(!name) return;
      const f = {id:uid(), type:'folder', name}; await putMine(f); target = f.id;
    }
    await saveNow();
    it.parent = target; await putMine(it); updateMeta();
    $('edBackLabel').textContent = target ? mine.get(target).name : 'Meus Roteiros';
    toast('Roteiro movido.');
  } else if(b.id==='aSend'){
    await saveNow(); if(!it.text && !it.name) return toast('Escreva o roteiro antes de enviar.');
    sendDialog([it]);
  } else if(b.id==='aCopy'){
    const copy = {id:uid(), type:'script', name:it.name, text:it.text||'', parent:null};
    if(it.folder){
      let f = [...mine.values()].find(x=>x.type==='folder' && x.name===it.folder);
      if(!f){ f = {id:uid(), type:'folder', name:it.folder}; await putMine(f); }
      copy.parent = f.id;
    }
    await putMine(copy); toast('Copiado para Meus Roteiros. Agora você pode editar.');
    openScript(copy, 'mine');
  } else if(b.id==='aUnsend'){
    unsend(it, true);
  }
});

async function peopleList(){
  let ids = new Set(members);
  try{ const hits = await user.search(''); (hits||[]).forEach(h=>{ if(h && h.id && h.id!==me) ids.add(h.id); }); }catch(e){}
  ids = [...ids];
  let names = {};
  try{ names = await user.profiles(ids) || {}; }catch(e){}
  ids.forEach(id=>{ if(names[id] && names[id].name) nameCache[id] = names[id].name; });
  return ids.map(id=>({id, name:(names[id] && names[id].name) || 'Pessoa sem nome'})).sort((a,b)=>a.name.localeCompare(b.name,'pt'));
}
async function sendDialog(scripts){
  const people = await peopleList();
  const sel = new Set(['__all']);
  const wrap = sheet(`<div class="grab"></div><h3>Enviar roteiro</h3>
    <p class="sub">${scripts.length>1?scripts.length+' roteiros':'“'+esc(scripts[0].name||'Sem título')+'”'} — quem recebe abre o app e encontra em <b>Recebidos</b>. Se você editar e enviar de novo, a versão deles é atualizada.</p>
    <div class="list" id="plist">
      <button class="li" data-p="__all"><span class="avatar">★</span><span class="grow">Todos<div class="sub">Qualquer pessoa com acesso ao app</div></span><span class="check"></span></button>
      ${people.map(p=>`<button class="li" data-p="${esc(p.id)}"><span class="avatar">${esc((p.name[0]||'?').toUpperCase())}</span><span class="grow">${esc(p.name)}</span><span class="check"></span></button>`).join('')}
    </div>
    ${people.length?'':'<p class="sub" style="margin-top:12px">As pessoas aparecem aqui depois que você compartilha o app com elas e elas abrem pela primeira vez.</p>'}
    <div class="btnrow"><button class="btn" data-x="cancel">Cancelar</button><button class="btn primary" data-x="ok">Enviar</button></div>`);
  const paint = ()=> wrap.querySelectorAll('[data-p]').forEach(b=>{ b.classList.toggle('sel', sel.has(b.dataset.p)); b.querySelector('.check').innerHTML = sel.has(b.dataset.p)?ICON.check:''; });
  paint();
  wrap.querySelector('#plist').onclick = e=>{
    const b = e.target.closest('[data-p]'); if(!b) return;
    const p = b.dataset.p;
    if(p==='__all'){ sel.clear(); sel.add('__all'); }
    else { sel.delete('__all'); sel.has(p)?sel.delete(p):sel.add(p); if(!sel.size) sel.add('__all'); }
    paint();
  };
  wrap.querySelector('[data-x=cancel]').onclick = ()=>wrap.remove();
  wrap.querySelector('[data-x=ok]').onclick = async ()=>{
    const btn = wrap.querySelector('[data-x=ok]'); btn.disabled = true; btn.textContent='Enviando…';
    try{
      for(const s of scripts){
        const f = s.parent && mine.get(s.parent);
        const body = {name:s.name||'Sem título', text:s.text||'', folder:f?f.name:'', sentAt:Date.now(), from:me};
        for(const target of sel){
          if(target==='__all') await db.collection('pub').doc(s.id).set(body);
          else { await db.doc('inbox/'+target).collection('items').doc(s.id).set(body); watchInbox(target); }
        }
      }
      wrap.remove(); toast(sel.has('__all') ? 'Enviado para todos.' : 'Enviado para '+sel.size+(sel.size>1?' pessoas.':' pessoa.'));
    }catch(e){
      btn.disabled=false; btn.textContent='Enviar';
      toast(e && e.code==='quota_exceeded' ? 'Espaço cheio. Apague envios antigos.' : 'Não foi possível enviar. Tente de novo.');
    }
  };
}
async function unsend(it, fromEditor){
  if(!isOwner) return;
  const ok = await confirmBox('Cancelar envio?', it.scope==='all' ? 'O roteiro some dos Recebidos de todo mundo.' : 'O roteiro some dos Recebidos de '+personName(it.scope)+'.', 'Remover');
  if(!ok) return;
  try{
    if(it.scope==='all') await db.collection('pub').doc(it.id).delete();
    else await db.doc('inbox/'+it.scope).collection('items').doc(it.id).delete();
    toast('Envio removido.');
    if(fromEditor) $('edBack').click(); else render();
  }catch(e){ toast('Não foi possível remover agora.'); }
}

/* =====================================================
   DIALOG HELPERS
   ===================================================== */
function sheet(html){
  const w = document.createElement('div'); w.className='sheetwrap';
  w.innerHTML = `<div class="sheet">${html}</div>`;
  w.addEventListener('click', e=>{ if(e.target===w) w.remove(); });
  document.body.appendChild(w); return w;
}
function askText(title, placeholder, initial){
  return new Promise(res=>{
    const w = sheet(`<div class="grab"></div><h3>${esc(title)}</h3><p class="sub"></p>
      <form><input class="field" maxlength="80" placeholder="${esc(placeholder)}" value="${esc(initial||'')}">
      <div class="btnrow"><button type="button" class="btn" data-x="c">Cancelar</button><button class="btn primary">Salvar</button></div></form>`);
    const inp = w.querySelector('input'); setTimeout(()=>{ inp.focus(); inp.select(); }, 60);
    const done = v=>{ w.remove(); res(v); };
    w.querySelector('form').onsubmit = e=>{ e.preventDefault(); done(inp.value.trim() || null); };
    w.querySelector('[data-x=c]').onclick = ()=>done(null);
    w.addEventListener('click', e=>{ if(e.target===w) res(null); });
  });
}
function confirmBox(title, msg, okLabel){
  return new Promise(res=>{
    const w = sheet(`<div class="grab"></div><h3>${esc(title)}</h3><p class="sub">${esc(msg)}</p>
      <div class="btnrow"><button class="btn" data-x="c">Cancelar</button><button class="btn danger" data-x="o">${esc(okLabel||'OK')}</button></div>`);
    w.querySelector('[data-x=c]').onclick = ()=>{ w.remove(); res(false); };
    w.querySelector('[data-x=o]').onclick = ()=>{ w.remove(); res(true); };
    w.addEventListener('click', e=>{ if(e.target===w) res(false); });
  });
}
function pickOne(title, opts, current){
  return new Promise(res=>{
    const w = sheet(`<div class="grab"></div><h3>${esc(title)}</h3><p class="sub"></p><div class="list">${
      opts.map(o=>`<button class="li ${o.v===current?'sel':''}" data-v="${esc(o.v)}"><span class="grow">${esc(o.label)}${o.sub?`<div class="sub">${esc(o.sub)}</div>`:''}</span><span class="check">${o.v===current?ICON.check:''}</span></button>`).join('')
    }</div><div class="btnrow"><button class="btn" data-x="c">Cancelar</button></div>`);
    w.querySelector('.list').onclick = e=>{ const b = e.target.closest('[data-v]'); if(!b) return; w.remove(); res(b.dataset.v); };
    w.querySelector('[data-x=c]').onclick = ()=>{ w.remove(); res(null); };
    w.addEventListener('click', e=>{ if(e.target===w) res(null); });
  });
}

const DEF = {

  bg:'#000000', color:'#ffffff', clocks:true, live:true,
  tapScroll:false, hideCtl:true, dragStops:true, timed:false, timedSecs:60, mode:'cont',
  mirrorMode:'none', persist:true, countdown:3, captions:true,
  camOn:true, camFacing:'user', camDevice:'', micDevice:'', quality:'auto', camDim:0.15, camDimIdle:0.5, camFit:'cover', recSync:false, recStopEnd:false
};
const P = {};
Object.keys(DEF).forEach(k=>{ P[k] = LS.get('p_'+k, DEF[k]); });
const psave = k => LS.set('p_'+k, P[k]);
const FONTS = { system:'-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif', serif:'"New York",Georgia,"Times New Roman",serif', rounded:'ui-rounded,"SF Pro Rounded","Nunito",-apple-system,sans-serif' };

const PR = $('prompter'), ptext = $('ptext'), flip = $('flip'), guide = $('guide'), cam = $('cam');
let pos=0, vpos=0, playing=false, last=0, raf=0, maxPos=0, hideTimer=0, counting=false, countIv=0;
let elapsed=0, reverse=false, segs=[], segEls=[], segTops=[], cues=[], lastSeg=-1, curText='';
const posMemory = {};

function fmt(s){ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function hms(s){ s=Math.max(0,Math.round(isFinite(s)?s:0)); const h=Math.floor(s/3600), m=Math.floor(s/60)%60, x=s%60; return (h? h+':' : '')+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0'); }
function pps(){
  if(P.timed && P.timedSecs>0 && maxPos>0) return maxPos / P.timedSecs;
  return P.speed * P.size * 0.11;
}

/* ---- texto em trechos (para legendas) ---- */
function segment(t){
  const out = [];
  t.split(/(\n+)/).forEach(part=>{
    if(!part) return;
    if(/^\n+$/.test(part)){ out.push({t:part, nl:true}); return; }
    const lead = (part.match(/^\s+/)||[''])[0];
    const sentences = part.slice(lead.length).match(/[^.!?…]+[.!?…]*\s*|[.!?…]+\s*/g) || [part];
    sentences.forEach((s,si)=>{
      const words = s.match(/\S+\s*/g) || [s];
      for(let i=0;i<words.length;i+=10){
        let chunk = words.slice(i,i+10).join('');
        if(si===0 && i===0) chunk = lead + chunk;
        out.push({t:chunk});
      }
    });
  });
  return out;
}
function buildText(text){
  curText = text && text.trim() ? text : '(roteiro vazio)';
  segs = segment(curText);
  ptext.innerHTML = segs.map((s,i)=> s.nl ? esc(s.t) : `<span class="sg" data-i="${i}">${esc(s.t)}</span>`).join('');
  segEls = [...ptext.querySelectorAll('.sg')];
}

/* ---- abrir / fechar ---- */
function openPrompter(){
  const it = S.cur; if(!it) return;
  buildText($('edText').value);
  $('ptitleT').textContent = $('edTitle').value || 'Sem título';
  PR.classList.add('show'); document.body.style.overflow='hidden';
  PR.classList.toggle('recorder', RECORDER);
  $('recrow').classList.remove('hide');
  ['flipBtn','eyeBtn','rstat'].forEach(id=>{ const e = $(id); if(e) e.style.visibility = RECORDER ? '' : 'hidden'; });
  $('pCam').classList.toggle('hide', !RECORDER);
  playing=false; reverse=false; elapsed=0; cues=[]; lastSeg=-1; $('pDir').classList.remove('on');
  requestAnimationFrame(()=>{
    applyStyle();
    pos = vpos = (P.persist && posMemory[it.id]) ? Math.min(posMemory[it.id], maxPos) : 0;
    draw(); showUI(); setGo();
  });
  if(RECORDER && P.camOn) startCamera();
}
function closePrompter(){
  if(recording) stopRecording(true);
  pause(); clearInterval(countIv); counting=false; $('count').classList.remove('show');
  if(S.cur) posMemory[S.cur.id] = pos;
  if(!RECORDER && P.captions && cues.length > 1) saveCaption(buildSRT(cues, elapsed), $('ptitleT').textContent);
  PR.classList.remove('show'); document.body.style.overflow='';
  if(RECORDER) parkCamera();
  try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){}
}
function refreshPrompterText(){
  if(!PR.classList.contains('show') || !P.live || !S.cur) return;
  const fresh = S.curKind==='mine' ? mine.get(S.cur.id) : null;
  if(!fresh || fresh.text === curText) return;
  const r = pos/(maxPos||1);
  buildText(fresh.text); layout(); pos = vpos = r*maxPos; draw();
  ptip('Texto atualizado');
}

/* ---- aparência ---- */
function applyStyle(){
  ptext.style.fontFamily = FONTS[P.font] || FONTS.system;
  ptext.style.fontWeight = P.bold ? 700 : 500;
  ptext.style.fontSize = P.size+'px';
  ptext.style.lineHeight = P.lh;
  ptext.style.textAlign = P.align;
  ptext.style.color = P.color;
  ptext.style.paddingLeft = `calc(var(--sl) + ${P.margin}% + 14px)`;
  ptext.style.paddingRight = `calc(var(--sr) + ${P.margin}% + 14px)`;
  PR.style.background = P.bg; PR.style.setProperty('--pbg', P.bg);
  const sx = P.mirrorMode==='h' ? -1 : 1, sy = P.mirrorMode==='v' ? -1 : 1;
  flip.style.transform = `scale(${sx},${sy})`;
  $('pspeed').value = P.speed; $('pspeedV').textContent = P.timed ? '⏱' : P.speed;
