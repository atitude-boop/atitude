  for(let i = 0; i < n; i++){ const cv = document.createElement('canvas'); renderSlide(cv, CX.slides[i], i, n, CX); blobs.push(await new Promise(r=>cv.toBlob(r, 'image/png'))); }
  cxSave(); openPublish({images:blobs, caption:CX.caption || '', prefer:CX.brand});
}


/* ---------- 🎟️ Eventos, 📋 Minha área, aprovação, manual da marca, depoimentos e créditos ---------- */
let EVENTOS = [];
function watchEventos(){ if(!db) return; db.doc('config/eventos').onSnapshot(s=>{ EVENTOS = s.exists && Array.isArray(s.data().list) ? s.data().list : []; if($('plStudio') && PL.tab === 'eventos') plRender(); if($('maStudio')) maRender(); }, ()=>{}); }
const dDiff = d=>{ if(!d) return null; const a = new Date(d + 'T12:00:00'), b = new Date(ymd(new Date()) + 'T12:00:00'); return Math.round((a - b)/86400000); };
const addDays = (d, n)=>{ const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() + n); return ymd(x); };
function evCountdown(e){ const n = dDiff(e.inicio), f = dDiff(e.fim || e.inicio); if(n == null) return ''; if(f < 0) return 'aconteceu'; if(n <= 0) return 'acontecendo'; return n === 1 ? 'amanhã' : 'faltam ' + n + ' dias'; }
function plEventos(body, bm){
  const list = EVENTOS.slice().sort((a,b)=>(a.inicio||'').localeCompare(b.inicio||''));
  const up = list.filter(e=>dDiff(e.fim || e.inicio) >= 0), past = list.filter(e=>dDiff(e.fim || e.inicio) < 0);
  const card = e=>{ const n = PL.cal.filter(p=>p.eventId === e.id), done = n.filter(p=>p.stage === 'postado').length; return `<div class="plc" data-ev="${esc(e.id)}" style="border-left:4px solid ${e.tipo === 'mercado' ? '#8e8e93' : '#FF7E33'}"><div class="plc-top"><span>${e.tipo === 'mercado' ? '📆 Data do mercado' : '🎟️ Evento'}</span><span class="tagc ${dDiff(e.inicio) <= 7 && dDiff(e.fim || e.inicio) >= 0 ? 'hot' : ''}">${esc(evCountdown(e))}</span>${e.status === 'a confirmar' ? '<span class="tagc">a confirmar</span>' : ''}</div><b>${esc(e.nome)}</b><small>${esc((e.inicio||'').split('-').reverse().join('/'))}${e.fim && e.fim !== e.inicio ? ' a ' + esc(e.fim.split('-').reverse().join('/')) : ''}${e.local ? ' · 📍 ' + esc(e.local) : ''} · ${n.length ? '🗂️ ' + n.length + ' conteúdos (' + done + ' postados)' : 'sem conteúdos ainda'}</small></div>`; };
  body.innerHTML = `<p class="snote" style="margin:0 2px 10px">Eventos da Marca e datas do mercado. Toque num evento para gerar o plano de conteúdo de antes, durante e depois, que vai direto para o calendário com responsável.</p>
    ${isOwner ? '<div class="btnrow" style="margin-top:0"><button class="btn" data-a="evAdd">+ Novo evento</button></div>' : ''}
    ${up.map(card).join('') || '<div class="empty"><b>Nenhum evento</b>Adicione os próximos eventos.</div>'}
    ${past.length ? '<div class="st-sec">Já aconteceram</div>' + past.slice(-5).reverse().map(card).join('') : ''}`;

}

function evOpen(e){

  };
}

/* ---------- 🎤 Depoimento guiado: o time grava o aluno com perguntas certas ---------- */
async function openDepoimento(){
  const w = sheet(head('🎤 Gravar depoimento', false) + `
    <p class="snote" style="margin-top:6px">O time grava o aluno no celular com as perguntas certas na tela. Antes de gravar: <b>autorização de imagem assinada</b>.</p>
    <input class="field" id="dpN" placeholder="Nome do aluno" style="margin-top:8px"><input class="field" id="dpP" placeholder="Empresa / profissão" style="margin-top:8px">
    <div class="slabel">Produto que fez</div><div class="chips" id="dpX" style="flex-wrap:wrap">${['Formação de Oratória','Marca Empresarial','Marca Club','Formação de Palestrantes','Formação de Mentores','Espaço Marca'].map((x,i)=>`<button class="chip2 ${i===0?'on':''}" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>
    <div class="st-card" style="margin-top:10px"><label style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="dpOk"> A pessoa assinou a autorização de uso de imagem</label></div>
    <div class="btnrow"><button class="btn primary" data-x="go">🎥 Abrir perguntas e gravar</button></div><div style="height:6px"></div>`);
  let prod = 'Formação de Oratória';
  w.querySelector('#dpX').onclick = e=>{ const b = e.target.closest('[data-v]'); if(!b) return; prod = b.dataset.v; w.querySelectorAll('#dpX .chip2').forEach(x=>x.classList.toggle('on', x === b)); };
  w.querySelector('[data-x=ok]').onclick = ()=>w.remove();
  w.querySelector('[data-x=go]').onclick = async ()=>{
    const n = w.querySelector('#dpN').value.trim(), pf = w.querySelector('#dpP').value.trim();
    if(!n) return toast('Nome do aluno.'); if(!w.querySelector('#dpOk').checked) return toast('Primeiro a autorização de imagem.');
    const text = `DEPOIMENTO · ${n}${pf ? ' · ' + pf : ''} · ${prod}\n\n(Peça para responder olhando para a câmera, em frases completas, repetindo a pergunta na resposta.)\n\n1. Quem é você e o que você faz?\n\n2. Como era a sua comunicação antes da ${prod}? Qual era a sua maior dificuldade?\n\n3. Teve um momento em que você percebeu que mudou? Conta essa cena.\n\n4. O que mudou na prática: nas vendas, na liderança, nas reuniões, na sua confiança?\n\n5. Que resultado concreto você já teve depois disso?\n\n6. Pra quem você recomenda a Marca? Complete: "Se você é empresário e…"\n\n7. Em uma frase: o que a Marca significou pra você?`;
    let folder = [...mine.values()].find(i=>i.type==='folder' && i.name==='Depoimentos');
    if(!folder){ folder = {id:uid(), type:'folder', name:'Depoimentos'}; await putMine(folder); }
    const it = {id:uid(), type:'script', name:'Depoimento · ' + n, text, parent:folder.id}; await putMine(it);
    if(db) await plPut('lib', {id:uid(), type:'depoimento', brand:'oratoria', title:n + (pf ? ' · ' + pf : ''), text:'Depoimento gravado (' + prod + ') em ' + new Date().toLocaleDateString('pt-BR') + '. Autorização de imagem: sim. Vídeo no celular de quem gravou.', author: meTeam() || myName});
    w.remove(); const ma = $('maStudio'); if(ma) ma.remove(); render(); openScript(it, 'mine'); openPrompter();
  };
}

/* ---------- 💳 Créditos ---------- */
async function credLine(){
  const out = [];
  try{ const p = hgObj(await hg('get_current_user', {})); const c = (hgFind(p, x=>x.premium_credits) || {}).premium_credits || {}; if(c.remaining != null) out.push('HeyGen: ' + c.remaining + ' créditos' + (c.resets_at ? ' (renova ' + new Date(c.resets_at).toLocaleDateString('pt-BR') + ')' : '')); }catch(e){}
  try{ const v = await vqCredits(); if(v != null) out.push('vidIQ: ' + v); }catch(e){}
  return out.length ? '💳 ' + out.join(' · ') : '';
}
function credFill(el){ if(!el || !isOwner) return; credLine().then(t=>{ if(document.body.contains(el)) el.textContent = t; }); }


/* ---------- 🔎 Radar de seguidores: qualifica quem seguiu e avisa quem pode virar cliente ---------- */
async function openFollowerRadar(){
  const w = sheet(head('🔎 Radar de seguidores', false) + `
    <p class="snote" style="margin-top:6px">O Instagram não mostra para nenhum app quem seguiu. Então: abra o Instagram › Notificações (ou Seguidores) e cole aqui os @ dos novos seguidores, um por linha. O agente lê o perfil público de cada um, dá uma nota de 0 a 100 de chance de virar cliente, diz qual produto combina e escreve a primeira mensagem do Direct.</p>
    <div class="slabel">Perfil que ganhou os seguidores</div><div class="chips" id="frB" style="flex-wrap:wrap">${HD_PROFILES.map((p,i)=>`<button class="chip2 ${i===0?'on':''}" data-v="${p.id}">${p.ic} ${esc(p.name)}</button>`).join('')}</div>
    <div class="slabel">@ dos novos seguidores</div><textarea class="field" id="frH" rows="6" placeholder="@fulano&#10;@ciclana.empresaria&#10;instagram.com/beltrano"></textarea>
    <p class="snote" id="frCost"></p>
    <div class="btnrow"><button class="btn primary" id="frGo">🔎 Analisar e avisar quem pode ser cliente</button></div>
    <p class="snote" id="frSt"></p><div id="frOut"></div><div style="height:8px"></div>`);
  w.querySelector('[data-x=ok]').onclick = ()=>w.remove();
  let brand = HD_PROFILES[0].id;
  w.querySelector('#frB').onclick = e=>{ const b = e.target.closest('[data-v]'); if(!b) return; brand = b.dataset.v; w.querySelectorAll('#frB .chip2').forEach(x=>x.classList.toggle('on', x === b)); };
  const parse = ()=>[...new Set((w.querySelector('#frH').value.match(/(?:instagram\.com\/)?@?([a-z0-9._]{2,30})/gi) || []).map(x=>x.replace(/.*instagram\.com\//i, '').replace(/^@/, '').replace(/\/$/, '').toLowerCase()).filter(x=>!/^(www|instagram|com|reel|p)$/.test(x)))].slice(0, 30);
  const H = w.querySelector('#frH'); H.oninput = ()=>{ const n = parse().length; w.querySelector('#frCost').textContent = n ? `${n} perfil(is) · usa ${n*5} créditos do vidIQ` : ''; };
  const stp = x=>{ w.querySelector('#frSt').textContent = x; };
  w.querySelector('#frGo').onclick = async e=>{
    const b = e.currentTarget, hs = parse(); if(!hs.length) return toast('Cole pelo menos um @.');
    const s = await getCap('sample'); if(!s) return toast('Funciona no app do Claude.');
    const cr = await vqCredits();
    if(!await confirmBox('Analisar ' + hs.length + ' perfil(is)?', `Usa ${hs.length*5} créditos do vidIQ${cr != null ? ' (você tem ' + cr + ')' : ''}. Nenhuma mensagem é enviada: você decide quem chamar.`, 'Analisar')) return;
    b.disabled = true; const out = w.querySelector('#frOut'); out.innerHTML = '';
    const known = new Set((LD.list || []).map(l=>(l.contact||'').replace(/^@/, '').toLowerCase()));
    const res = [];
    for(let i = 0; i < hs.length; i++){
      const h = hs[i]; stp(`🔎 Lendo @${h} (${i+1}/${hs.length})…`);
      let prof = null; try{ prof = hgObj(await vq('vidiq_ig_profile', {handle:h, userGoal:'qualificar novo seguidor como possível cliente de educação empresarial'})); }catch(err){ prof = {erro: vqErr(err)}; }
      res.push({h, prof});
    }
    stp('🧠 Avaliando quem pode ser cliente…');
    try{
      const brief = res.map(r=>{ const p = r.prof || {}; const o = hgFind(p, x=>x.biography !== undefined || x.bio !== undefined || x.followersCount !== undefined || x.followers !== undefined) || p; return {handle:r.h, nome:o.fullName || o.full_name || o.name || '', bio:o.biography || o.bio || '', seguidores:o.followersCount || o.followers || o.follower_count || null, link:o.externalUrl || o.external_url || '', categoria:o.category || o.businessCategory || '', privado:o.isPrivate || o.private || false, erro:p.erro || ''}; });
      const r = await s.json(`${BASE_CTX}
Você é o SDR inteligente do Sua Marca. Avalie cada novo seguidor do perfil ${(HD_PROFILES.find(p=>p.id === brand)||{}).name} e diga se ele minimamente pode virar cliente. Cliente ideal: empresário, dono de negócio, gestor, líder, vendedor ou profissional liberal (médico, advogado, dentista, corretor…), especialmente de Goiás, que precisa se comunicar melhor para vender, liderar e se posicionar (persona Ricardo). Também valem: empresas para treinamento B2B e quem organiza eventos (Espaço Marca). Baixa chance: estudante sem negócio, perfil de fã/meme, concorrente (escola de oratória/mentor de comunicação), robô/perfil vazio.
Não invente nada além do que está nos dados; perfil privado ou sem bio = nota baixa e "conferir manualmente".
Para nota ≥ 50 escreva a 1ª mensagem do Direct: curta, humana, no tom do Usuario/Marca, agradecendo por seguir e puxando conversa a partir de algo da bio, SEM vender nem mandar link; termine com uma pergunta.
PERFIS: ${JSON.stringify(brief).slice(0, 12000)}
Responda SOMENTE JSON {"seguidores":[{"handle","nota":0-100,"quem":"resumo em até 12 palavras","porque":"1 frase","produto":"turma|imersao|club|mentoria|b2b|espaco|outro","mensagem":"... ou vazio"}]}`, {modelTier:'complex', cache:false});
      const list = (r && Array.isArray(r.seguidores) ? r.seguidores : []).sort((a,b)=>(+b.nota||0) - (+a.nota||0));
      const hot = list.filter(x=>+x.nota >= 50);
      out.innerHTML = list.map((x,i)=>`<div class="plc" style="border-left:4px solid ${+x.nota >= 70 ? '#30d158' : +x.nota >= 50 ? '#FF7E33' : '#555'}"><div class="plc-top"><span class="tagc ${+x.nota >= 70 ? 'ok' : +x.nota >= 50 ? 'hot' : ''}">${+x.nota >= 70 ? '🔥' : +x.nota >= 50 ? '👀' : '·'} ${+x.nota||0}/100</span><span>${esc(ldProd(x.produto))}</span>${known.has(String(x.handle).toLowerCase()) ? '<span class="tagc">já é lead</span>' : ''}</div><b>@${esc(x.handle)}</b><small>${esc(x.quem||'')} · ${esc(x.porque||'')}</small>${x.mensagem ? `<div class="cap-box" style="margin-top:6px">${esc(x.mensagem)}</div><div class="btnrow"><button class="btn" data-cp="${i}">📋 Copiar mensagem</button><a class="btn" href="https://ig.me/m/${esc(x.handle)}" target="_blank" rel="noopener">💬 Abrir Direct</a></div><div class="btnrow"><button class="btn primary" data-ld="${i}">➕ Virar lead</button></div>` : ''}</div>`).join('');
      out.querySelectorAll('[data-cp]').forEach(bt=>bt.onclick = async ()=>{ try{ await navigator.clipboard.writeText(list[+bt.dataset.cp].mensagem); toast('Mensagem copiada.'); }catch(e){} });
      out.querySelectorAll('[data-ld]').forEach(bt=>bt.onclick = async ()=>{ const x = list[+bt.dataset.ld]; const rp = (res.find(r=>r.h === String(x.handle).toLowerCase()) || {}).prof || {}; const pic = (hgFind(rp, y=>y.profilePicUrl || y.profile_pic_url || y.profilePictureUrl || y.avatarUrl) || {}); if(await ldPut({id:uid(), name:x.quem || ('@' + x.handle), contact:'@' + x.handle, brand, score:+x.nota||0, igcrm:true, pic: pic.profilePicUrl || pic.profile_pic_url || pic.profilePictureUrl || pic.avatarUrl || '', product: LD_PRODUCTS.some(p=>p[0] === x.produto) ? x.produto : 'outro', origin:'outro', keyword:'', postId:'', stage:'novo', owner:'', value:'', notes:`Novo seguidor (nota ${x.nota}/100). ${x.porque || ''}\\nMensagem sugerida: ${x.mensagem || ''}`, fup:{}, createdAt:Date.now(), createdBy: myName || 'Radar de seguidores'})){ bt.textContent = '✅ Virou lead'; bt.disabled = true; } });
      stp(hot.length ? `✅ ${hot.length} de ${list.length} podem ser clientes${list.filter(x=>+x.nota >= 70).length ? ' (' + list.filter(x=>+x.nota >= 70).length + ' quentes 🔥)' : ''}. Abordagem pronta abaixo; nada foi enviado.` : `Nenhum dos ${list.length} parece cliente agora.`);
      if(hot.length) toast('🔥 ' + hot.length + ' seguidor(es) com potencial de cliente!', 4500);
    }catch(err){ stp('Não consegui avaliar agora. Tente de novo.'); }
    b.disabled = false;
  };
}

  if(old && !LS.get('oldMigrated', false) && old.trim() && !old.startsWith('Olá! Este é o seu teleprompter')){
    const it = {id:uid(), type:'script', name:'Meu roteiro', text:old, parent:null, updated:Date.now()};
    mine.set(it.id, it); saveLocal();
  }
  LS.set('oldMigrated', true);
})();
loading = true;
updateSync(); render(); plLocal(); LD.list = LS.get('leads', []);
initCloud();
