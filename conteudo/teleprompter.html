const HOOK_FORMULAS = [
  'Ninguém te conta isso sobre [tema]','O erro nº 1 de quem [ação] (e como corrigir)','Pare de [erro comum] agora','[Número] sinais de que você [problema]',
  'O que eu queria saber sobre [tema] quando comecei','Você não tem problema de [x], tem problema de [y]','Por que [crença comum] está te fazendo perder [resultado]',
  'Como [resultado] sem [esforço indesejado]','A diferença entre quem [sucesso] e quem [fracasso]','[Número] frases que destroem sua [autoridade/venda]',
  'Isso mudou a forma como eu [ação] para sempre','Se você [situação], leia até o final','O segredo que os melhores [profissionais] não contam',
  '3 minutos que valem mais que um curso de [tema]','Faça isso antes da sua próxima [reunião/apresentação]','A pergunta que fecha mais vendas do que qualquer argumento',
  'Mito: [crença]. Verdade: [realidade]','Eu errei nisso durante anos: [erro]','O jeito mais rápido de [resultado] (testado em [contexto])',
  'Seu cliente não compra [produto], compra [transformação]','Salve isso: [número] passos para [resultado]','Quem domina [habilidade] nunca fica sem [oportunidade]'
];
const COPY_RULES = `Regras de copy (obrigatórias):
- Português do Brasil, frases curtas, linguagem falada, sem jargão nem clichês ("no mundo de hoje", "você sabia que", "descubra").
- Uma ideia por slide. No máximo 35 palavras por slide (capa: no máximo 12).
- Gancho da capa: específico, com curiosidade, dor ou promessa clara. Prefira números e palavras concretas.
- Crie tensão entre os slides (loops abertos: "e o próximo é o que mais erram") para a pessoa arrastar até o fim.
- Fale com UMA pessoa ("você"). Mostre benefício concreto, não característica.
- Destaque 1 a 2 palavras-chave por slide envolvendo em *asteriscos*.
- NUNCA invente números, estatísticas, depoimentos, nomes ou resultados. Quando precisar de um caso real, use [colchetes] para o autor preencher.
- Último slide: um único CTA claro.`;

let COPY_TAB = 'gerar';
async function openCopyStudio(tab){
  if(!CX) return;
  COPY_TAB = tab || COPY_TAB;
  const sample = await getCap('sample');
  const B = getBrand();
  const w = sheet(head('✍️ Estúdio de copy', false) + `
    <div class="seg" id="cpTabs" style="margin:10px 0 12px">
      <button data-v="gerar">Gerar carrossel</button><button data-v="ganchos">Ganchos</button><button data-v="ctas">CTAs</button><button data-v="revisar">Revisar</button>
    </div>
    <div id="cpBody"></div><div style="height:8px"></div>`);
  w.querySelector('[data-x=ok]').onclick = ()=>w.remove();
  const paint = ()=>{
    w.querySelectorAll('#cpTabs button').forEach(b=>b.classList.toggle('on', b.dataset.v===COPY_TAB));
    const body = w.querySelector('#cpBody');
    if(COPY_TAB==='gerar') copyTabGerar(body, sample, B, w);
    else if(COPY_TAB==='ganchos') copyTabHooks(body, sample, B, w);
    else if(COPY_TAB==='ctas') copyTabCTA(body, B, w);
    else copyTabReview(body, sample, B, w);
  };
  w.querySelector('#cpTabs').onclick = e=>{ const b = e.target.closest('[data-v]'); if(!b) return; COPY_TAB = b.dataset.v; paint(); };
  paint();
}
function aiOff(body){
  body.innerHTML = `<p class="sub">A IA de copy funciona na versão do app dentro do Claude. Aqui você pode usar as fórmulas prontas nas abas <b>Ganchos</b> e <b>CTAs</b>, e o botão “Gerar do roteiro”.</p>`;
}
function copyTabGerar(body, sample, B, w){
  if(!sample){ aiOff(body); return; }
  const st = LS.get('copy_last', {fw:'lista', aw:'problema', obj:'salvar', n:'7', extra:''});
  body.innerHTML = `
    <p class="sub" style="margin-top:0">A IA reescreve o seu roteiro como carrossel usando técnicas de copywriting, no tom de voz de <b style="color:#fff">${esc(B.name)}</b>.</p>
    <div class="slabel" style="margin-top:6px">Estrutura (framework)</div>
    <div class="list" id="cpFw">${Object.entries(COPY_FW).map(([k,f])=>`<button class="li ${st.fw===k?'sel':''}" data-fw="${k}"><span class="grow">${esc(f.name)}<div class="sub">${esc(f.how.slice(0,96))}…</div></span><span class="check">${st.fw===k?ICON.check:''}</span></button>`).join('')}</div>
    <div class="slabel">Nível de consciência do público</div>
    <div class="seg" id="cpAw" style="flex-wrap:wrap">${COPY_AWARE.map(a=>`<button data-v="${a[0]}" class="${st.aw===a[0]?'on':''}">${a[1]}</button>`).join('')}</div>
    <div class="slabel">Objetivo do post</div>
    <div class="seg" id="cpObj" style="flex-wrap:wrap">${Object.entries(IDEA_OBJ).map(([k,n])=>`<button data-v="${k}" class="${st.obj===k?'on':''}">${n}</button>`).join('')}</div>
    <div class="slabel">Quantidade de slides</div>
    <div class="seg" id="cpN">${['5','7','8','10'].map(n=>`<button data-v="${n}" class="${st.n===n?'on':''}">${n}</button>`).join('')}</div>
    <div class="slabel">Instrução extra (opcional)</div>
    <input class="field" id="cpExtra" placeholder="Ex.: falar com donos de clínica; citar a imersão do dia 27">
    <div class="prog hide" id="cpP"><b style="width:20%"></b></div><p class="snote" id="cpM"></p>
    <div class="btnrow"><button class="btn primary" data-x="gen">✨ Gerar carrossel</button></div>`;
  body.querySelector('#cpExtra').value = st.extra || '';
  const sel = (id, key)=>{ body.querySelector(id).onclick = e=>{ const b = e.target.closest('[data-v]'); if(!b) return; st[key] = b.dataset.v; body.querySelectorAll(id+' button').forEach(x=>x.classList.toggle('on', x===b)); }; };
  sel('#cpAw','aw'); sel('#cpObj','obj'); sel('#cpN','n');
  body.querySelector('#cpFw').onclick = e=>{ const b = e.target.closest('[data-fw]'); if(!b) return; st.fw = b.dataset.fw; if(COPY_FW[st.fw].obj && !st.objTouched){ st.obj = COPY_FW[st.fw].obj; body.querySelectorAll('#cpObj button').forEach(x=>x.classList.toggle('on', x.dataset.v===st.obj)); } body.querySelectorAll('#cpFw .li').forEach(x=>{ const on = x===b; x.classList.toggle('sel', on); x.querySelector('.check').innerHTML = on ? ICON.check : ''; }); };
  body.querySelector('#cpObj').addEventListener('click', ()=>{ st.objTouched = true; });
  const ctl = new AbortController();
  body.querySelector('[data-x=gen]').onclick = async ()=>{
    st.extra = body.querySelector('#cpExtra').value.trim(); LS.set('copy_last', st);
    const btn = body.querySelector('[data-x=gen]'); btn.disabled = true; btn.textContent = 'Escrevendo…';
    body.querySelector('#cpP').classList.remove('hide');
    let p = 20; const iv = setInterval(()=>{ p = Math.min(93, p+3); const b = body.querySelector('#cpP b'); if(b) b.style.width = p+'%'; }, 700);
    const fw = COPY_FW[st.fw], aw = COPY_AWARE.find(a=>a[0]===st.aw);
    const handle = B.handle ? '@' + B.handle.replace(/^@/,'') : B.name;
    const prompt = `Você é um copywriter sênior especialista em carrosséis de Instagram de alto engajamento no Brasil, treinado nos princípios de Eugene Schwartz (níveis de consciência), Robert Cialdini (persuasão), Chip e Dan Heath (ideias que grudam) e Alex Hormozi (valor).
Marca: ${B.name} (${handle}), parte do Sua Marca (Marca Escola de Oratória e Negócios).
Tom de voz da marca: ${B.voice || 'direto, humano e confiante'}.
Framework obrigatório: ${fw.name}. Como aplicar: ${fw.how}
Nível de consciência do público: ${aw[1]}. ${aw[2]}
Objetivo principal do post: ${IDEA_OBJ[st.obj]}.
Quantidade: exatamente ${st.n} slides.
${st.extra ? 'Instrução extra do autor: ' + st.extra : ''}
${COPY_RULES}
${BASE_CTX}
Tipos de slide permitidos: "capa" (title = gancho, body opcional curto), "texto" (title curto opcional + body), "lista" (title + body com 3 a 5 itens, um por linha), "citacao" (title = frase marcante, body = autor opcional), "cta" (title + body; o CTA deve combinar com o objetivo e citar ${handle} quando fizer sentido).
Também entregue: "legenda" (legenda do post com gancho na 1ª linha, 3 a 6 linhas curtas, CTA), "hashtags" (5 a 8, relevantes para a marca) e "ganchos" (5 ganchos alternativos para a capa, de estilos diferentes: curiosidade, dor, número, polêmica, promessa).
Responda SOMENTE com JSON: {"slides":[{"kind":"...","title":"...","body":"..."}],"legenda":"...","hashtags":["#..."],"ganchos":["..."]}

TÍTULO DO ROTEIRO: ${CX.title}
ROTEIRO (base de conteúdo, não invente além disso):
${cleanScript(CX.text).slice(0, 9000)}`;
    try{
      const r = await sample.json(prompt, {signal:ctl.signal, modelTier:'complex'});
      clearInterval(iv);
      const slides = (r && Array.isArray(r.slides) ? r.slides : []).filter(s=>s && (s.title||s.body)).map(s=>({kind: KINDS.some(k=>k[0]===s.kind) ? s.kind : 'texto', title:String(s.title||''), body:String(s.body||'')}));
      if(!slides.length) throw {message:'vazio'};
      CX.slides = slides;
      CX.caption = [r.legenda||'', (r.hashtags||[]).join(' ')].filter(Boolean).join('\n\n');
      CX.hooks = (r.ganchos||[]).map(String).filter(Boolean);
      cxRenderAll(); w.remove();
      toast('Carrossel escrito com ' + fw.short + '. Veja ganchos alternativos em ✍️ Copy › Ganchos.', 3500);
    }catch(err){
      clearInterval(iv); if(ctl.signal.aborted) return;
      btn.disabled = false; btn.textContent = 'Tentar de novo';
      body.querySelector('#cpM').textContent = err && err.code==='rate_limited' ? 'Muitas solicitações agora. Espere um pouco.' : err && err.code==='not_granted' ? 'A IA não foi liberada para este app.' : 'Não foi possível gerar agora. Tente de novo.';
    }
  };
}
function applyHook(h){
  const i = CX.slides.findIndex(s=>s.kind==='capa');
  if(i >= 0) CX.slides[i].title = h; else CX.slides.unshift({kind:'capa', title:h, body:''});
  cxRenderAll(); toast('Gancho aplicado na capa.');
}
function copyTabHooks(body, sample, B, w){
  const topic = (CX.title || '').replace(/\*/g,'');
  const ai = (CX.hooks||[]);
  body.innerHTML = `
    ${ai.length ? `<div class="slabel" style="margin-top:0">Sugeridos pela IA para este carrossel</div><div class="list">${ai.map((h,i)=>`<button class="li" data-hk="ai:${i}"><span class="grow">${esc(h.replace(/\*/g,''))}</span><span class="chev">Usar</span></button>`).join('')}</div>` : ''}
    ${sample ? `<div class="btnrow" style="margin-top:${ai.length?'12px':'0'}"><button class="btn primary" data-x="more">✨ Gerar 10 ganchos com IA</button></div><div class="prog hide" id="hkP"><b style="width:25%"></b></div>` : ''}
    <div class="slabel">Fórmulas de gancho (toque para editar e usar)</div>
    <p class="snote" style="margin-top:-4px">Troque o que está entre [colchetes] pelo seu tema.</p>
    <div class="list">${HOOK_FORMULAS.map((h,i)=>`<button class="li" data-hk="f:${i}"><span class="grow">${esc(h)}</span><span class="chev">›</span></button>`).join('')}</div>`;
  body.querySelectorAll('[data-hk]').forEach(b=>b.onclick = async ()=>{
    const [t, i] = b.dataset.hk.split(':');
    if(t==='ai'){ applyHook(CX.hooks[+i]); return; }
    const v = await askText('Ajuste o gancho', 'Gancho da capa', HOOK_FORMULAS[+i].replace('[tema]', topic ? topic.toLowerCase() : '[tema]'));
    if(v) applyHook(v);
  });
  const mb = body.querySelector('[data-x=more]');
  if(mb) mb.onclick = async ()=>{
    mb.disabled = true; mb.textContent = 'Gerando…'; body.querySelector('#hkP').classList.remove('hide');
    try{
      const r = await sample.json(`Crie 10 ganchos para a CAPA de um carrossel de Instagram da marca ${B.name} (tom: ${B.voice || 'direto e humano'}), em português do Brasil, com no máximo 12 palavras cada, cada um num estilo diferente (curiosidade, dor, número, polêmica, promessa, erro comum, contraste, pergunta, história, autoridade). Não invente números ou dados que não estejam no texto. Responda SOMENTE com JSON {"ganchos":["..."]}.
TEXTO DO CARROSSEL:
${CX.slides.map(s=>[s.title,s.body].filter(Boolean).join(' — ')).join('\n').slice(0,5000)}`, {modelTier:'default'});
      CX.hooks = (r && r.ganchos || []).map(String).filter(Boolean).concat(CX.hooks||[]).slice(0, 15);
      copyTabHooks(body, sample, B, w);
    }catch(err){ mb.disabled = false; mb.textContent = 'Tentar de novo'; }
  };
}
function copyTabCTA(body, B, w){
  const handle = B.handle ? '@' + B.handle.replace(/^@/,'') : B.name;
  body.innerHTML = Object.entries(COPY_CTA).map(([k, list])=>`<div class="slabel" style="margin-top:${k==='salvar'?'0':'16px'}">${IDEA_OBJ[k]}</div><div class="list">${list.map((c,i)=>`<button class="li" data-cta="${k}:${i}"><span class="grow">${esc(c.replace('{@}', handle))}</span><span class="chev">Usar</span></button>`).join('')}</div>`).join('') +
    `<p class="snote">O CTA escolhido vai para o último slide (chamada final).</p>`;
  body.querySelectorAll('[data-cta]').forEach(b=>b.onclick = ()=>{
    const [k, i] = b.dataset.cta.split(':'); const txt = COPY_CTA[k][+i].replace('{@}', handle);
    let j = CX.slides.map(s=>s.kind).lastIndexOf('cta');
    if(j < 0){ CX.slides.push({kind:'cta', title:'Gostou?', body:txt}); }
    else CX.slides[j].body = txt;
    cxRenderAll(); toast('CTA aplicado no último slide.');
  });
}
function copyTabReview(body, sample, B, w){
  if(!sample){
    body.innerHTML = `<p class="sub" style="margin-top:0">Checklist rápido de copy antes de postar:</p><div class="sgroup" style="padding:12px 16px;line-height:1.7;font-size:15px">
      ✅ A capa tem no máximo 12 palavras e uma promessa ou curiosidade clara?<br>✅ Cada slide tem uma ideia só?<br>✅ Tem algum motivo para arrastar até o fim?<br>✅ Você fala com “você”, e não com “vocês”?<br>✅ Tirou clichês e palavras vagas?<br>✅ O último slide tem um único CTA?<br>✅ Preencheu tudo que estava entre [colchetes]?</div>`;
    return;
  }
  body.innerHTML = `<p class="sub" style="margin-top:0">A IA revisa o carrossel atual: deixa o gancho mais forte, corta palavras sobrando, melhora o ritmo entre os slides e confere o CTA, sem mudar o sentido.</p>
    <div class="seg" id="rvMode" style="flex-wrap:wrap;margin-bottom:10px"><button data-v="leve" class="on">Ajuste leve</button><button data-v="forte">Reescrita forte</button><button data-v="curto">Mais curto</button></div>
    <div class="prog hide" id="rvP"><b style="width:25%"></b></div><p class="snote" id="rvM"></p>
    <div class="btnrow"><button class="btn primary" data-x="rv">✨ Revisar copy</button></div>`;
  let mode = 'leve';
  body.querySelector('#rvMode').onclick = e=>{ const b = e.target.closest('[data-v]'); if(!b) return; mode = b.dataset.v; body.querySelectorAll('#rvMode button').forEach(x=>x.classList.toggle('on', x===b)); };
  body.querySelector('[data-x=rv]').onclick = async ()=>{
    const btn = body.querySelector('[data-x=rv]'); btn.disabled = true; btn.textContent = 'Revisando…'; body.querySelector('#rvP').classList.remove('hide');
    const before = JSON.parse(JSON.stringify(CX.slides));
    try{
      const r = await sample.json(`Revise a copy deste carrossel de Instagram da marca ${B.name} (tom: ${B.voice || 'direto e humano'}). Modo: ${mode==='leve'?'ajuste leve, mantendo as frases do autor sempre que possível':mode==='forte'?'reescrita forte, mais persuasiva e com mais tensão entre slides':'deixe tudo mais curto e escaneável, sem perder a ideia'}.
${COPY_RULES}
${BASE_CTX}
Mantenha a mesma quantidade de slides e o mesmo "kind" de cada slide. Mantenha os trechos entre [colchetes]. Responda SOMENTE com JSON {"slides":[{"kind":"...","title":"...","body":"..."}],"comentario":"o que você melhorou, em 1 frase"}.
CARROSSEL ATUAL (JSON):
${JSON.stringify(CX.slides.map(s=>({kind:s.kind,title:s.title,body:s.body})))}`, {modelTier:'complex'});
      const sl = (r && r.slides || []);
      if(!sl.length) throw {message:'vazio'};
      CX.slides = CX.slides.map((s,i)=> sl[i] ? Object.assign({}, s, {title:String(sl[i].title||''), body:String(sl[i].body||'')}) : s);
      cxRenderAll();
      btn.disabled = false; btn.textContent = 'Revisar de novo';
      body.querySelector('#rvP').classList.add('hide');
      body.querySelector('#rvM').innerHTML = esc(r.comentario || 'Copy revisada.') + ' <button class="st-btn" id="rvUndo" style="height:32px;margin-left:6px">Desfazer</button>';
      body.querySelector('#rvUndo').onclick = ()=>{ CX.slides = before; cxRenderAll(); body.querySelector('#rvM').textContent = 'Revisão desfeita.'; };
    }catch(err){ btn.disabled = false; btn.textContent = 'Tentar de novo'; body.querySelector('#rvM').textContent = 'Não foi possível revisar agora.'; }
  };
}

/* =====================================================
   EM ALTA: alertas de assuntos em hype + concorrentes
   Os alertas são escritos todo dia por uma tarefa agendada do Claude
   (pesquisa na internet) na coleção "alerts" do banco do app.
   ===================================================== */
let ALERTS = [], COMPETITORS = [];
const ALERTS_SNAPSHOT = []; /*@ALERTS*/
function watchAlerts(){
  if(!db){ if(ALERTS_SNAPSHOT.length){ ALERTS = ALERTS_SNAPSHOT.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)); if(S.screen==='home') render(); } return; }
  db.collection('alerts').onSnapshot(snap=>{
    ALERTS = snap.docs.map(d=>Object.assign({id:d.id}, d.data())).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    if(S.screen==='home') render();
    if($('alStudio')) alRender();
  }, ()=>{});
  db.doc('config/competitors').onSnapshot(snap=>{
    COMPETITORS = snap.exists && Array.isArray(snap.data().list) ? snap.data().list : [];
    if($('alStudio')) alRender();
  }, ()=>{});
}
function alertsUnseen(){
  const seen = LS.get('alerts_seen', []), dis = LS.get('alerts_dismissed', []);
  return ALERTS.filter(a=>!seen.includes(a.id) && !dis.includes(a.id)).length;
}
function alertBarHTML(){
  if(!db ? !ALERTS.length : (!isOwner && !ALERTS.length)) return '';
  const n = alertsUnseen();
  return `<button class="ideabar hotbar" data-launch="alerts"><span>🔥</span><span style="font-size:inherit;flex:1"><b>Em alta agora ${n?`<span class="badge" style="margin-left:6px">${n} novo${n>1?'s':''}</span>`:''}</b><small>${ALERTS.length ? 'Assuntos que os empresários estão comentando, com roteiro rápido pronto' : 'Os alertas aparecem aqui todo dia de manhã'}</small></span><span style="font-size:20px;color:#8e8e93">›</span></button>`;
}
let AL_TAB = 'hype';

  const el = document.createElement('div'); el.className = 'studio'; el.id = 'alStudio';
  el.innerHTML = `
    <div class="st-top"><button class="backc" data-a="close">${BACK_ICON}</button><h2>Em alta</h2><span style="width:46px"></span></div>
    <div class="st-body">
      <div class="seg" id="alTabs" style="margin-bottom:12px"><button data-v="hype">🔥 Em alta</button><button data-v="viral">🎬 Virais</button><button data-v="conc">🎯 Concorrentes</button></div>
      <div id="alBody"></div><div style="height:20px"></div>

function alRender(){

    const dis = LS.get('alerts_dismissed', []), seen = LS.get('alerts_seen', []);
    const list = ALERTS.filter(a=>!dis.includes(a.id) && (AL_TAB==='viral' ? a.kind==='viral' : a.kind!=='viral'));
    body.innerHTML = (AL_TAB==='viral'
      ? `<p class="snote" style="margin:0 2px 12px">Vídeos de pessoas que falam de comunicação, oratória, vendas e liderança, no Brasil e fora, que viralizaram. Para cada um: por que funcionou, o modelo para replicar e um roteiro já adaptado para a Marca. Inspire-se na estrutura, nunca copie o conteúdo.</p>`
      : `<p class="snote" style="margin:0 2px 12px">Todo dia de manhã o Claude pesquisa o que os empresários e o mercado estão comentando e traz aqui, com ângulo para a Marca, gancho e roteiro rápido. Você também recebe um aviso no celular.</p>`) +
      (list.length ? list.map(a=>`
      <div class="idea alert ${seen.includes(a.id)?'':'new'}" data-al="${esc(a.id)}">
        <div class="idea-top">
          <span class="tagc ${a.urgency==='hoje'?'hot':''}">${a.urgency==='hoje'?'⚡ Postar hoje':a.urgency==='semana'?'📆 Esta semana':'💡 Ideia'}</span>
          <span class="tagc">${a.kind==='concorrente'?'🎯 Concorrente':a.kind==='viral'?'🎬 '+esc(a.creator||'Viral')+(a.country?' · '+esc(a.country):''):'🔥 Em alta'}</span>
          ${bmap[a.brand]?`<span class="tagc">📱 ${esc(bmap[a.brand].name)}</span>`:''}
          ${a.importancia==='alta'?'<span class="tagc hot">🚨 importante</span>':''}${a.createdAt?`<span class="tagc">🕒 ${new Date(a.createdAt).toDateString()===new Date().toDateString()?'hoje ':new Date(a.createdAt).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '}${new Date(a.createdAt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</span>`:''}${Array.isArray(a.anim)&&a.anim.length?'<span class="tagc">🎨 animação pronta</span>':''}
          <span class="sub" style="margin-left:auto;font-size:11px">${a.createdAt?new Date(a.createdAt).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}):''}</span>
        </div>
        <b>${esc(a.title||'')}</b>

    body.querySelectorAll('[data-delc]').forEach(b=>b.onclick = async ()=>{ const l = COMPETITORS.slice(); l.splice(+b.dataset.delc, 1); await save(l); });
    const ab = body.querySelector('[data-x=addc]');

    <p class="sub">${esc(a.why||'')}</p>

    ${a.traducao?`<div class="slabel">🌎 O que ele fala (traduzido)</div><div class="cap-box" style="white-space:pre-wrap">${esc(a.traducao)}</div>`:''}

    ${a.angle?`<p class="sub" style="color:#e5e5ea">🎯 <b>Ângulo para a Marca:</b> ${esc(a.angle)}</p>`:''}

    <div class="btnrow"><button class="btn" data-x="script">⚡ Roteiro</button><button class="btn" data-x="video">🎥 Gravar</button><button class="btn primary" data-x="car">🖼️ Carrossel</button></div>
    <div class="btnrow"><button class="btn" data-x="anim">🎨 Vídeo animado</button><button class="btn" data-x="cal">📅 Calendário</button></div>
    ${isOwner ? '<div class="btnrow"><button class="btn primary" data-x="film" style="background:linear-gradient(135deg,#FF7E33,#e8611b)">🎬 Filme real (HeyGen)</button><button class="btn" data-x="anpro">🎌 Anime Pro</button></div>' : ''}
    <div class="btnrow"><button class="btn" data-x="dis">Dispensar</button>${isOwner?'<button class="btn danger" data-x="del">Apagar para todos</button>':''}</div>
    <p class="snote" style="text-align:center">Confira as fontes antes de postar: assunto em alta muda rápido.</p>`);
  w.querySelector('[data-x=ok]').onclick = ()=>w.remove();
  const make = async ()=>{
    let folder = [...mine.values()].find(i=>i.type==='folder' && i.name==='Em alta');
    if(!folder){ folder = {id:uid(), type:'folder', name:'Em alta'}; await putMine(folder); }
    const it = {id:uid(), type:'script', name:a.title || 'Em alta', text: a.roteiro || [a.hook, a.why, a.angle].filter(Boolean).join('\n\n'), parent: folder.id};
    await putMine(it);
    const bo = getBrands().find(z=>z.id===a.brand) || getBrand();
    const slides = Array.isArray(a.slides) && a.slides.length ? a.slides.map(s=>({kind: KINDS.some(k=>k[0]===s.kind) ? s.kind : 'texto', title:String(s.title||''), body:String(s.body||'')})) : null;
    LS.set('car_' + it.id, {brand: bo.id, tpl: bo.tpl || 'azul', fmt:'4:5', accent:'', caption: a.legenda || '', slides: slides || scriptToSlides(it.text, it.name)});
    await useBrand(bo.id);
    w.remove(); const st = $('alStudio'); if(st) st.remove();
    render(); openScript(it, 'mine'); return it;

  w.querySelector('[data-x=script]').onclick = async ()=>{ await make(); };

  w.querySelector('[data-x=cal]').onclick = async ()=>{ await addToCalendar({title:a.title, brand:a.brand||CUR_BRAND, format: Array.isArray(a.slides)&&a.slides.length && a.kind!=='viral' ? 'reels' : 'reels', stage:'ideia', date: a.urgency==='hoje' ? ymd(new Date()) : '', notes:[a.hook?'Gancho: '+a.hook:'', a.angle?'Ângulo: '+a.angle:'', a.roteiro||''].filter(Boolean).join('\n\n')}); };
  const alTxt = ()=>[a.title, a.hook ? 'Gancho: ' + a.hook : '', a.roteiro || '', a.why || '', a.traducao ? 'Referência (traduzida): ' + a.traducao : ''].filter(Boolean).join('\n');
  const alF = w.querySelector('[data-x=film]'); if(alF) alF.onclick = ()=>{ w.remove(); const st = $('alStudio'); if(st) st.remove(); openFilmPro(alTxt(), a.angle || a.porqueGravar || ''); };
  const alA = w.querySelector('[data-x=anpro]'); if(alA) alA.onclick = ()=>{ w.remove(); const st = $('alStudio'); if(st) st.remove(); openAnimePro(alTxt(), '', a.angle || ''); };
  w.querySelector('[data-x=dis]').onclick = ()=>{ const d = LS.get('alerts_dismissed', []); d.push(a.id); LS.set('alerts_dismissed', d); w.remove(); alRender(); };
  const del = w.querySelector('[data-x=del]');
  if(del) del.onclick = async ()=>{ try{ await db.collection('alerts').doc(a.id).delete(); w.remove(); }catch(e){ toast('Não foi possível apagar.'); } };
}

/* =====================================================
   MÁQUINA DE CONTEÚDO: calendário, etapas, metas, resultados,
   equipe, biblioteca da marca, pauta semanal e multiplicar.
   Na versão Claude fica no banco do app (coleções "cal" e "lib",
   documento "config/planner"); nas outras versões, no aparelho.
   ===================================================== */
const STAGES = [['ideia','💡 Ideia'],['roteiro','✍️ Roteiro'],['gravado','🎥 Gravado'],['editado','✂️ Editado'],['revisao','👀 Em aprovação'],['aprovado','✅ Aprovado'],['agendado','⏰ Agendado'],['postado','📣 Postado']];
const FORMATS = [['reels','🎬 Reels'],['carrossel','🖼️ Carrossel'],['stories','📱 Stories'],['post','🟦 Post'],['live','🔴 Live']];
const METRICS = [['reach','Alcance'],['saves','Salvamentos'],['shares','Compartilhamentos'],['comments','Comentários'],['leads','Contatos (leads)'],['sales','Vendas']];
const WD = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const PL = { cal: [], lib: [], cfg: {team:['Usuario','Equipe'], goals:{oratoria:5, club:3, usuario:5, espaco:2}}, cloud:false, week:null, brand:'', tab:'semana' };
const stageName = k => (STAGES.find(s=>s[0]===k)||['','—'])[1];
const fmtName = k => (FORMATS.find(s=>s[0]===k)||['','—'])[1];
const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function weekStart(d){ const x = new Date(d); x.setHours(0,0,0,0); const wd = (x.getDay()+6)%7; x.setDate(x.getDate()-wd); return x; }
function plCleanDoc(o){ const c = JSON.parse(JSON.stringify(o)); delete c.id; return c; }

function plWatch(){
  if(db && me){
    PL.cloud = true;
    db.collection('cal').onSnapshot(s=>{ PL.cal = s.docs.map(d=>Object.assign({id:d.id}, d.data())); plRefresh(); }, ()=>{ PL.cloud = false; plLocal(); });
    db.collection('lib').onSnapshot(s=>{ PL.lib = s.docs.map(d=>Object.assign({id:d.id}, d.data())); plRefresh(); }, ()=>{});
    db.doc('config/planner').onSnapshot(s=>{ if(s.exists){ const d = s.data(); PL.cfg = Object.assign({}, PL.cfg, d); } plRefresh(); }, ()=>{});
  } else plLocal();
}
function plLocal(){ PL.cal = LS.get('cal', []); PL.lib = LS.get('lib', []); PL.cfg = Object.assign({}, PL.cfg, LS.get('plcfg', {})); }
async function plPut(coll, item){
  item.updatedAt = Date.now(); if(!item.id) item.id = uid();
  if(PL.cloud){
    try{ await db.collection(coll).doc(item.id).set(plCleanDoc(item)); return true; }
    catch(e){ toast(e && e.code==='quota_exceeded' ? 'Espaço cheio no banco do app.' : 'Sem permissão para salvar. Peça acesso de Editor ao Usuario.'); return false; }
  }
  const arr = PL[coll]; const i = arr.findIndex(x=>x.id===item.id); if(i>=0) arr[i] = item; else arr.push(item);
  LS.set(coll, arr); plRefresh(); return true;
}
async function plDel(coll, id){
  if(PL.cloud){ try{ await db.collection(coll).doc(id).delete(); }catch(e){ toast('Não foi possível apagar.'); } return; }
  PL[coll] = PL[coll].filter(x=>x.id!==id); LS.set(coll, PL[coll]); plRefresh();
}
async function plSaveCfg(){
  if(PL.cloud){ try{ await db.doc('config/planner').set({team:PL.cfg.team, goals:PL.cfg.goals, updatedAt:Date.now()}); }catch(e){ toast('Só o Usuario pode mudar metas e equipe.'); } }
  else { LS.set('plcfg', {team:PL.cfg.team, goals:PL.cfg.goals}); plRefresh(); }
}
function plRefresh(){ if($('plStudio')) plRender(); }

/* ---------- adicionar ao calendário de qualquer lugar ---------- */
async function addToCalendar(o){
  const item = Object.assign({id:uid(), title:'Novo conteúdo', brand:CUR_BRAND, format:'reels', stage:'ideia', date:'', time:'', owner:'', keyword:'', notes:'', comments:[], metrics:{}, createdAt:Date.now(), createdBy: myName || ''}, o||{});
  const ok = await plPut('cal', item);
  if(ok) toast('Adicionado ao calendário 📅');
  return item;
}

/* ---------- tela principal ---------- */
function openPlanner(tab){
  PL.tab = tab || PL.tab; if(!PL.week) PL.week = weekStart(new Date());
  const el = document.createElement('div'); el.className = 'studio'; el.id = 'plStudio';
  el.innerHTML = `
    <div class="st-top"><button class="backc" data-a="close">${BACK_ICON}</button><h2>Calendário</h2><button class="st-btn primary" data-a="new">+ Novo</button></div>
    <div class="st-body">
      <div class="seg" id="plTabs" style="margin-bottom:10px;overflow-x:auto">
        <button data-v="semana">📅 Semana</button><button data-v="etapas">🧩 Etapas</button><button data-v="metas">🎯 Metas</button><button data-v="eventos">🎟️ Eventos</button><button data-v="result">📊 Resultados</button><button data-v="lib">📚 Biblioteca</button>
      </div>
      <div class="chips" id="plBrand" style="margin-bottom:10px"></div>
      <div id="plBody"></div><div style="height:24px"></div>
    </div>`;
  document.body.appendChild(el);
  el.querySelector('#plTabs').onclick = e=>{ const b = e.target.closest('[data-v]'); if(!b) return; PL.tab = b.dataset.v; plRender(); };
  el.querySelector('[data-a=close]').onclick = ()=>el.remove();
  el.querySelector('[data-a=new]').onclick = ()=> PL.tab==='lib' ? libAdd() : PL.tab==='eventos' ? (isOwner ? evEdit(null) : toast('Só o Usuario cria eventos.')) : plEdit(null, {date: PL.tab==='semana' ? ymd(PL.week) : ''});
  el.querySelector('#plBrand').onclick = e=>{ const b = e.target.closest('[data-pb]'); if(!b) return; PL.brand = b.dataset.pb; plRender(); };
  plRender();
}
function plBrandMap(){ const m = {}; getBrands().forEach(b=>m[b.id]=b); return m; }
function plFiltered(){ return PL.cal.filter(p=>!PL.brand || p.brand===PL.brand); }
function plCard(p, bm, extra){
  const b = bm[p.brand];
  const late = p.date && p.stage!=='postado' && p.date < ymd(new Date());
  return `<div class="plc" data-pid="${esc(p.id)}" style="border-left:4px solid ${+p.prio===2 ? '#ff453a' : +p.prio===1 ? '#FF7E33' : (b ? b.accent : '#555')}">
    <div class="plc-top"><span>${fmtName(p.format)}</span>${p.time?`<span>${esc(p.time)}</span>`:''}<span class="tagc ${p.stage==='postado'?'ok':''}">${stageName(p.stage)}</span>${+p.prio===2?'<span class="tagc hot">⭐ urgente</span>':+p.prio===1?'<span class="tagc hot">🔥 alta</span>':''}${late?'<span class="tagc hot">atrasado</span>':''}${p.suggested?'<span class="tagc">✨ sugerido</span>':''}</div>
    <b>${esc(p.title||'Sem título')}</b>
    <small>${p.eventId && typeof EVENTOS !== 'undefined' && EVENTOS.find(e=>e.id===p.eventId) ? '🎟️ ' + esc(EVENTOS.find(e=>e.id===p.eventId).nome) + ' · ' : ''}${b?esc(b.name):''}${p.owner?' · 👤 '+esc(p.owner):''}${p.keyword?' · 💬 '+esc(p.keyword):''}${(p.comments||[]).length?' · 🗨️ '+p.comments.length:''}</small>${extra||''}
  </div>`;
}
function plRender(){
  const el = $('plStudio'); if(!el) return;
  el.querySelectorAll('#plTabs button').forEach(b=>b.classList.toggle('on', b.dataset.v===PL.tab));
  const bm = plBrandMap();
  el.querySelector('#plBrand').innerHTML = `<button class="chip2 ${!PL.brand?'on':''}" data-pb="">Todos os perfis</button>` + getBrands().map(b=>`<button class="chip2 ${PL.brand===b.id?'on':''}" data-pb="${b.id}"><span class="dot" style="background:linear-gradient(135deg,${b.bg1},${b.bg2});box-shadow:inset 0 0 0 3px ${b.accent}"></span>${esc(b.name)}</button>`).join('');
  el.querySelector('#plBrand').classList.toggle('hide', PL.tab==='metas' || PL.tab==='eventos');
  const body = el.querySelector('#plBody');
  if(PL.tab==='semana') plWeek(body, bm);
  else if(PL.tab==='etapas') plStages(body, bm);
  else if(PL.tab==='metas') plGoals(body, bm);
  else if(PL.tab==='result') plResults(body, bm);
  else if(PL.tab==='eventos') plEventos(body, bm);
  else libRender(body, bm);
  body.querySelectorAll('[data-pid]').forEach(c=>c.onclick = ()=>plEdit(PL.cal.find(x=>x.id===c.dataset.pid)));
}
function plWeek(body, bm){
  const ws = PL.week, days = [...Array(7)].map((_,i)=>{ const d = new Date(ws); d.setDate(d.getDate()+i); return d; });
  const list = plFiltered();
  const today = ymd(new Date());
  body.innerHTML = `
    <div class="vx-ctrl" style="justify-content:space-between"><button class="st-btn" data-w="-1">‹</button><b>Semana de ${days[0].toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})} a ${days[6].toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}</b><button class="st-btn" data-w="1">›</button></div>
    <div class="chips" style="margin-bottom:8px"><button class="st-btn ai hide" data-a="pauta">✨ Gerar pauta da semana</button><button class="st-btn" data-a="cortes">✂️ Cortes de palestra</button><button class="st-btn" data-w="0">Hoje</button></div>
    ${days.map(d=>{ const k = ymd(d); const items = list.filter(p=>p.date===k).sort((a,b)=>((+b.prio||0) - (+a.prio||0)) || (a.time||'99').localeCompare(b.time||'99'));
      return `<div class="plday ${k===today?'today':''}"><div class="plday-h"><span>${WD[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}</span><button class="st-btn" style="height:30px;padding:0 10px" data-addday="${k}">+</button></div>${items.map(p=>plCard(p,bm)).join('') || '<p class="snote" style="margin:2px 4px 6px">Nada programado.</p>'}</div>`; }).join('')}
    <div class="st-sec">💡 Sem data (ideias e rascunhos)</div>
    ${list.filter(p=>!p.date).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).map(p=>plCard(p,bm)).join('') || '<p class="snote">Nenhuma ideia solta. Use o banco de ideias, os alertas ou o botão “Gerar pauta”.</p>'}`;
  body.querySelectorAll('[data-w]').forEach(b=>b.onclick = ()=>{ const n = +b.dataset.w; if(n===0) PL.week = weekStart(new Date()); else { const d = new Date(PL.week); d.setDate(d.getDate()+7*n); PL.week = d; } plRender(); });
  body.querySelectorAll('[data-addday]').forEach(b=>b.onclick = e=>{ e.stopPropagation(); plEdit(null, {date:b.dataset.addday, brand: PL.brand || CUR_BRAND}); });
  body.querySelector('[data-a=cortes]').onclick = cortesHelp;
  getCap('sample').then(s=>{ const pb = body.querySelector('[data-a=pauta]'); if(s && pb){ pb.classList.remove('hide'); pb.onclick = ()=>pautaAI(days); } });
}
function plStages(body, bm){
  const list = plFiltered();
  body.innerHTML = STAGES.map(([k,n])=>{ const items = list.filter(p=>(p.stage||'ideia')===k).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));
    return `<div class="st-sec">${n} <span class="sub">(${items.length})</span></div>${items.map(p=>plCard(p,bm, k==='postado' ? '' : `<button class="st-btn" style="height:30px;margin-top:6px" data-next="${esc(p.id)}">Mover para a próxima etapa →</button>`)).join('') || '<p class="snote" style="margin:0 4px">Vazio.</p>'}`; }).join('');
  body.querySelectorAll('[data-next]').forEach(b=>{ b.onclick = async e=>{ e.stopPropagation(); const p = PL.cal.find(x=>x.id===b.dataset.next); const i = STAGES.findIndex(s=>s[0]===(p.stage||'ideia')); const nx = STAGES[Math.min(i+1, STAGES.length-1)][0]; if(nx==='aprovado' && !isOwner && PL.cloud){ toast('Só o Usuario aprova. Ele recebe na lista “Editado”.'); return; } p.stage = nx; if(nx==='aprovado') p.approvedBy = myName || 'Usuario'; await plPut('cal', p); }; });
}
function plGoals(body, bm){
  const ws = PL.week || weekStart(new Date()); const we = new Date(ws); we.setDate(we.getDate()+6);
  const inWeek = p => p.date && p.date >= ymd(ws) && p.date <= ymd(we);
  body.innerHTML = `<p class="snote" style="margin:0 2px 12px">Meta de posts por semana em cada perfil. Semana de ${ws.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}.</p>` +

    `<div class="st-sec">👥 Equipe</div><div class="list">${(PL.cfg.team||[]).map((n,i)=>`<div class="li"><span class="avatar">${esc((n[0]||'?').toUpperCase())}</span><span class="grow">${esc(n)}</span><span class="sub">${PL.cal.filter(p=>p.owner===n && p.stage!=='postado').length} pendentes</span><button class="st-btn" style="height:30px" data-tdel="${i}">Tirar</button></div>`).join('')}</div>

  body.querySelectorAll('[data-tdel]').forEach(b=>b.onclick = async ()=>{ PL.cfg.team = PL.cfg.team.filter((_,i)=>i!==+b.dataset.tdel); await plSaveCfg(); plRender(); });

function plResults(body, bm){
  const posted = plFiltered().filter(p=>p.stage==='postado');
  const sum = (arr, k) => arr.reduce((a,p)=>a + (+((p.metrics||{})[k])||0), 0);
  const withReach = posted.filter(p=>+(p.metrics||{}).reach);
  const byFmt = FORMATS.map(([k,n])=>{ const a = withReach.filter(p=>p.format===k); return {n, c:a.length, avg: a.length ? Math.round(sum(a,'reach')/a.length) : 0, leads: sum(a,'leads')}; }).filter(x=>x.c);
  const maxAvg = Math.max(1, ...byFmt.map(x=>x.avg));
  const top = withReach.slice().sort((a,b)=>(+b.metrics.reach)-(+a.metrics.reach)).slice(0,5);
  const topLeads = posted.filter(p=>+(p.metrics||{}).leads).sort((a,b)=>(+b.metrics.leads)-(+a.metrics.leads)).slice(0,5);
  const nf = n => Number(n||0).toLocaleString('pt-BR');
  body.innerHTML = `
    <div class="kpis">${METRICS.map(([k,n])=>`<div class="kpi"><small>${n}</small><b>${nf(sum(posted,k))}</b></div>`).join('')}</div>
    <p class="snote">${posted.length} posts publicados${PL.brand?' neste perfil':''}. Os números entram em cada post (etapa 📣 Postado) ou eu atualizo pelo chat, com o Windsor e o vidIQ.</p>
    ${byFmt.length ? `<div class="st-sec">Alcance médio por formato</div><div class="st-card" style="padding:10px 14px">${byFmt.map(x=>`<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:14px"><span>${x.n} <span class="sub">(${x.c})</span></span><b>${nf(x.avg)}</b></div><div class="prog" style="margin-top:4px"><b style="width:${Math.round(x.avg/maxAvg*100)}%"></b></div></div>`).join('')}</div>` : ''}
    ${top.length ? `<div class="st-sec">🏆 Maior alcance</div>${top.map(p=>plCard(p,bm).replace('<small>', `<small>👁 ${nf(p.metrics.reach)} · 💾 ${nf(p.metrics.saves)} · `)).join('')}` : ''}
    ${topLeads.length ? `<div class="st-sec">💰 Mais contatos gerados</div>${topLeads.map(p=>plCard(p,bm).replace('<small>', `<small>🙋 ${nf(p.metrics.leads)} contatos · 🛒 ${nf(p.metrics.sales)} vendas · `)).join('')}` : ''}
    <div class="btnrow hide" id="plAiRow"><button class="btn primary" data-a="insight">✨ O que está funcionando?</button></div><div id="plInsight"></div>
    ${!posted.length ? '<div class="empty"><b>Sem resultados ainda</b>Quando um conteúdo chegar em 📣 Postado, preencha os números dele (ou peça no chat “atualizar resultados”).</div>' : ''}`;
  getCap('sample').then(s=>{ const r = body.querySelector('#plAiRow'); if(s && r && posted.length >= 3){ r.classList.remove('hide'); body.querySelector('[data-a=insight]').onclick = async ()=>{
    const box = body.querySelector('#plInsight'); box.innerHTML = '<p class="snote">Analisando…</p>';
    try{ const out = await s(`Você é analista de conteúdo do Sua Marca. Analise os posts publicados abaixo (perfil, formato, título, palavra-chave e métricas) e diga, em português do Brasil, em até 8 tópicos curtos: o que está funcionando, o que não está, e 4 ações práticas para AUMENTAR A CONVERSÃO (contatos e vendas) na próxima semana, cada uma ligada a um número dos dados. Baseie-se só nos dados.\n${JSON.stringify(posted.slice(0,80).map(p=>({perfil:(bm[p.brand]||{}).name, formato:p.format, titulo:p.title, palavra:p.keyword, data:p.date, metricas:p.metrics})))}`, {modelTier:'default'});
      box.innerHTML = `<div class="cap-box" style="margin-top:10px">${esc(out.text||'')}</div>`; }catch(e){ box.innerHTML = '<p class="snote">Não foi possível analisar agora.</p>'; } }; } });
}

function libRender(body, bm){

  const list = PL.lib.filter(x=>(!PL.brand || !x.brand || x.brand===PL.brand) && (!LIB_TYPE || x.type===LIB_TYPE) && (!q || ((x.title||'') + ' ' + (x.text||'') + ' ' + (x.tags||'')).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(q))).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));

    <div class="libgrid">${list.map(x=>`<div class="libi" data-lid="${esc(x.id)}">${x.img?`<img src="${x.img}" alt="">`:`<div class="libtxt">${esc((x.text||'').slice(0,120))}</div>`}<small>${esc(x.title||'')}${bm[x.brand]?' · '+esc(bm[x.brand].name):''}</small></div>`).join('')}</div>
    ${list.length ? '' : '<div class="empty"><b>Biblioteca vazia</b>Toque em “+ Novo” para adicionar fotos, depoimentos ou textos.</div>'}`;
  body.querySelectorAll('[data-lt]').forEach(b=>b.onclick = ()=>{ LIB_TYPE = b.dataset.lt; plRender(); });

async function libAdd(){
  const t = await pickOne('Adicionar à biblioteca', LIB_TYPES.map(x=>({v:x[0], label:x[1]})), null); if(!t) return;
  const item = {id:uid(), type:t, brand: PL.brand || '', title:'', text:'', author:''};
  if(t==='foto'){
    const f = await pickFile('image/*'); if(!f) return;
    try{ const im = await readImageFile(f, 1000); item.img = im.src; if(item.img.length > 230000){ const c = document.createElement('canvas'); const k = 720/Math.max(im.width, im.height); c.width = im.width*k; c.height = im.height*k; c.getContext('2d').drawImage(im,0,0,c.width,c.height); item.img = c.toDataURL('image/jpeg', 0.78); } }catch(e){ return toast('Não consegui abrir essa imagem.'); }
    item.title = (await askText('Nome da foto', 'Ex.: Auditório lotado – imersão nov/26')) || 'Foto';
    item.tags = (await askText('Temas (para achar depois)', 'Ex.: auditório, plateia, Espaço, evento')) || '';
  } else {
    const w = sheet(`<div class="grab"></div><h3>${t==='depoimento'?'Novo depoimento':t==='link'?'Nova música ou b-roll':'Novo texto pronto'}</h3><p class="sub">${t==='depoimento'?'Use só depoimentos reais, com autorização da pessoa.':t==='link'?'Cole o link da pasta no Drive, da música liberada ou do vídeo de apoio, e no texto diga para que serve.':'Ex.: bio, hashtags fixas, CTA padrão, link da inscrição.'}</p>
      <input class="field" id="lT" placeholder="${t==='depoimento'?'Nome de quem falou':'Título'}" style="margin-bottom:10px"><textarea class="field" id="lX" rows="6" placeholder="Texto"></textarea>
      <div class="btnrow"><button class="btn" data-x="c">Cancelar</button><button class="btn primary" data-x="o">Salvar</button></div>`);
    await new Promise(res=>{ w.querySelector('[data-x=c]').onclick = ()=>{ w.remove(); res(); }; w.querySelector('[data-x=o]').onclick = ()=>{ item.title = w.querySelector('#lT').value.trim(); item.text = w.querySelector('#lX').value.trim(); w.remove(); res(); }; });

async function pautaAI(days){
  const sample = await getCap('sample'); if(!sample) return;
  const goals = PL.cfg.goals || {}; const brands = getBrands();
  const total = Math.min(24, brands.reduce((a,b)=>a + (+goals[b.id]||0), 0)) || 10;
  const w = sheet(`<div class="grab"></div><h3>✨ Pauta da semana</h3><p class="sub">A IA monta ${total} conteúdos para a semana de ${days[0].toLocaleDateString('pt-BR')} seguindo as metas de cada perfil, usando os assuntos em alta, os modelos virais e o banco de ideias. Eles entram como 💡 Ideia para você aprovar.</p>
    <div class="prog hide" id="paP"><b style="width:20%"></b></div><p class="snote" id="paM"></p>

function hdSpark(arr){
  if(!arr || arr.length < 2) return '';

  return `<svg viewBox="0 0 ${w} ${h+16}" style="width:100%;height:70px;display:block"><polyline points="${pts}" fill="none" stroke="#0a84ff" stroke-width="2.5" stroke-linejoin="round"/>${arr.map((x,i)=>`<circle cx="${(i*step).toFixed(1)}" cy="${(h - (x.v||0)/max*(h-6) - 3).toFixed(1)}" r="3" fill="#0a84ff"/><text x="${(i*step).toFixed(1)}" y="${h+14}" font-size="10" fill="#8e8e93" text-anchor="${i===0?'start':i===arr.length-1?'end':'middle'}">${esc(x.d||'')}</text>`).join('')}</svg>`;
}

const LD_STAGES = [['novo','🆕 Novo'],['conversa','💬 Conversando'],['proposta','📄 Proposta'],['fechou','✅ Fechou'],['perdeu','❌ Perdeu']];

const LD = { list: [], cloud:false, tab:'hoje', stage:'' };
const ldStage = k => (LD_STAGES.find(s=>s[0]===k)||['','—'])[1];
const ldProd = k => (LD_PRODUCTS.find(s=>s[0]===k)||['','—'])[1];
const FUP = [
  {d:1, key:'f1', t:'Dia 1: entregar o que prometeu', msg:(l)=>`Oi, ${l.first}! Aqui é da Marca 😊 Vi que você comentou ${l.keyword ? '“'+l.keyword+'”' : 'no nosso post'}. Como prometido, te mando o material. Me conta: hoje, o que mais te trava ${l.product==='espaco' ? 'para fechar o espaço do seu evento' : 'na hora de falar ou vender'}?`},
  {d:3, key:'f3', t:'Dia 3: diagnóstico com pergunta', msg:(l)=>`Oi, ${l.first}! Passando para saber se o material te ajudou. Se fizer sentido, eu te explico em 5 minutos como ${l.product==='club' ? 'funciona o Marca Club e quem participa' : l.product==='espaco' ? 'funciona a locação do Espaço Marca e as datas livres' : 'a Marca pode te ajudar nisso'}. Prefere por áudio ou ligação?`},
  {d:7, key:'f7', t:'Dia 7: convite com prazo', msg:(l)=>`${l.first}, última mensagem para não ser chato 🙂 ${l.product==='espaco' ? 'As datas do Espaço para o fim do ano estão acabando.' : 'Estamos fechando a próxima turma.'} Quer que eu reserve uma conversa com você esta semana? Se não for o momento, sem problema, é só me avisar.`}
];
function ldWatch(){

  } else LD.list = LS.get('leads', []);

function ldRefresh(){ if($('ldStudio')) ldRender(); if(S.screen==='home') render(); }
async function ldPut(l){
  l.updatedAt = Date.now(); if(!l.id) l.id = uid();
  if(LD.cloud){ try{ const c = JSON.parse(JSON.stringify(l)); delete c.id; await db.collection('leads').doc(l.id).set(c); return true; }catch(e){ toast('Sem permissão para salvar leads.'); return false; } }
  const i = LD.list.findIndex(x=>x.id===l.id); if(i>=0) LD.list[i] = l; else LD.list.push(l); LS.set('leads', LD.list); ldRefresh(); return true;
}
async function ldDel(id){ if(LD.cloud){ try{ await db.collection('leads').doc(id).delete(); }catch(e){} return; } LD.list = LD.list.filter(x=>x.id!==id); LS.set('leads', LD.list); ldRefresh(); }
function ldDue(l){
  if(l.stage==='fechou' || l.stage==='perdeu') return null;
  const age = (Date.now() - (l.createdAt||Date.now()))/86400000;
  return FUP.find(f=>!(l.fup||{})[f.key] && age >= f.d - 1) || null;
}
function ldPendingCount(){ return LD.list.filter(l=>ldDue(l)).length; }

}

const AE = x => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);

function anCrowd(c, W, H, y, colorful){
  const cols = colorful ? ['#8c3b3b','#3c6e5a','#6a4a8c','#a88a3a','#3b5a8c','#8c5a3b','#2f6f6f'] : ['#2e3440'];
  for(let row=0; row<2; row++){
    const r = W*0.055, n = 9, yy = y + row*r*1.2;
    for(let i=0;i<n;i++){
      const x = (i + (row ? 0.5 : 0)) * W/(n-1) - (row ? W*0.03 : 0);
      c.fillStyle = cols[(i*3 + row*2) % cols.length]; c.globalAlpha = colorful ? 1 : 0.8 - row*0.15;

      c.fillRect(x - r*1.05, yy + r*1.3, r*2.1, H);
    }

}

/* =====================================================
   TELEPROMPTER FLUTUANTE (Picture-in-Picture)
   O roteiro vira um vídeo de texto rolando que fica numa janelinha
   por cima da câmera (do Claude, do app Câmera, do Instagram…).
   O vídeo é codificado rápido com WebCodecs + mp4-muxer; sem WebCodecs,
   grava em tempo real acelerado e toca mais devagar.
   ===================================================== */
function pipLayout(c, text, W, size){
  const words = cleanScript(text).replace(/\s+/g, ' ').trim().split(' ').filter(Boolean);
  c.font = `700 ${size}px ${SANS}`;
  const maxW = W*0.9, lines = []; let cur = [], idx = 0;
  words.forEach(w=>{ const t = cur.concat([w]).join(' '); if(c.measureText(t).width > maxW && cur.length){ lines.push({text:cur.join(' '), w0:idx - cur.length, n:cur.length}); cur = [w]; } else cur.push(w); idx++; });
  if(cur.length) lines.push({text:cur.join(' '), w0:idx - cur.length, n:cur.length});
  return {lines, words:words.length};
}
function pipFrame(c, W, H, L, t, o){
  const lh = o.size*1.3, cd = o.countdown, wps = o.wpm/60;
  c.fillStyle = '#000'; c.fillRect(0,0,W,H);
  const wpos = Math.max(0, (t - cd) * wps);
  let li = 0; while(li < L.lines.length - 1 && L.lines[li+1].w0 <= wpos) li++;
  const ln = L.lines[li], frac = ln ? Math.min(1, Math.max(0, (wpos - ln.w0)/Math.max(1, ln.n))) : 0;
  const anchor = H*0.36, y0 = anchor - (li + frac)*lh;
  c.fillStyle = 'rgba(255,255,255,.07)'; c.fillRect(0, anchor - lh*0.15, W, lh*1.05);
  c.font = `700 ${o.size}px ${SANS}`; c.textAlign = 'center'; c.textBaseline = 'top';
  L.lines.forEach((l, i)=>{ const y = y0 + i*lh; if(y < -lh || y > H) return; const d = Math.abs(i - (li + frac)); c.fillStyle = d < 0.6 ? '#ffffff' : `rgba(255,255,255,${Math.max(0.28, 0.75 - d*0.12)})`; c.fillText(l.text, W/2, y); });
  if(t < cd){ const n = Math.ceil(cd - t); c.fillStyle = 'rgba(0,0,0,.6)'; c.fillRect(0,0,W,H); c.fillStyle = '#ffd60a'; c.font = `900 ${H*0.45}px ${SANS}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(String(n), W/2, H/2); }
  const tot = cd + L.words/wps; c.fillStyle = '#ff3b30'; c.fillRect(0, H - 4, W*Math.min(1, t/tot), 4);
}

      const muxer = new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(), video:{codec:'avc', width:W, height:H}, fastStart:'in-memory'});

      }

    }
  }

  rec.start(500); const t0 = performance.now();
  await new Promise(res=>{ const step = ()=>{ const t = (performance.now() - t0)/1000*speed; if(t >= dur){ res(); return; } pipFrame(c, W, H, L, t, o); if(onProg) onProg(t/dur); requestAnimationFrame(step); }; requestAnimationFrame(step); });

/* ---------- Imagens: ilustração desenhada pela IA (grátis) e imagem com IA do vidIQ ---------- */
function svgClean(svg, W, H){
  svg = String(svg||'').replace(/```(svg|xml)?/g, '').trim();
  const a = svg.indexOf('<svg'), b = svg.lastIndexOf('</svg>'); if(a < 0 || b < 0) return null;
  svg = svg.slice(a, b + 6).replace(/<script[\s\S]*?<\/script>/gi, '').replace(/<foreignObject[\s\S]*?<\/foreignObject>/gi, '').replace(/\son\w+="[^"]*"/gi, '').replace(/(xlink:)?href="(?!#)[^"]*"/gi, '');
  if(!/xmlns=/.test(svg)) svg = svg.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
  svg = svg.replace(/<svg([^>]*)>/, (m, at)=>'<svg' + at.replace(/\s(width|height)="[^"]*"/g, '') + ` width="${W}" height="${H}">`);
  return svg;
}
function svgToBlob(svg, W, H){
  return new Promise((res, rej)=>{
    const clean = svgClean(svg, W, H); if(!clean) return rej('svg');
    const im = new Image();
    im.onload = ()=>{ const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const c = cv.getContext('2d'); c.fillStyle = '#111'; c.fillRect(0,0,W,H); c.drawImage(im, 0, 0, W, H); cv.toBlob(b=>b ? res(b) : rej('blob'), 'image/png'); };
    im.onerror = ()=>rej('img');
    im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(clean);
  });
}
async function urlToBlob(url){
  try{ const r = await fetch(url, {mode:'cors'}); if(r.ok){ const b = await r.blob(); if(b.size > 1000) return b; } }catch(e){}
  return await new Promise(res=>{ const im = new Image(); im.crossOrigin = 'anonymous'; im.onload = ()=>{ try{ const cv = document.createElement('canvas'); cv.width = im.naturalWidth; cv.height = im.naturalHeight; cv.getContext('2d').drawImage(im, 0, 0); cv.toBlob(b=>res(b), 'image/jpeg', 0.92); }catch(e){ res(null); } }; im.onerror = ()=>res(null); im.src = url; });
}
const VQ_MSG = {server_not_connected:'O vidIQ não está conectado. Conecte em Configurações › Conectores do Claude.', needs_reauth:'O vidIQ precisa ser reconectado em Configurações › Conectores.', not_in_manifest:'Permita o vidIQ neste app para gerar imagens.', approval_required:'Permita o vidIQ neste app para gerar imagens.', not_granted:'As imagens com IA funcionam no app do Claude.', capability_disabled:'As imagens com IA funcionam no app do Claude.', no_mcp:'As imagens com IA funcionam no app do Claude.'};
function vqErr(e){ const code = e && e.code; if(code === 'tool_error' && /credit/i.test(e.message||'')) return 'Sem créditos do vidIQ suficientes.'; return VQ_MSG[code] || ('Não consegui falar com o vidIQ agora' + (e && e.message ? ': ' + String(e.message).slice(0,120) : '.')); }
async function vq(tool, input){ const m = await getCap('mcp'); if(!m) throw {code:'no_mcp'}; const r = await m.callTool('vidIQ', tool, input || {}, {cache:false}); return r && r.payload !== undefined ? r.payload : r; }
async function vqCredits(){ try{ const p = await vq('vidiq_balance', {}); return p && typeof p.totalCredits === 'number' ? p.totalCredits : null; }catch(e){ return null; } }
async function vqJob(id, onTick, maxMs){
  const t0 = Date.now(); maxMs = maxMs || 240000;
  while(Date.now() - t0 < maxMs){
    await new Promise(r=>setTimeout(r, 4000));
    const p = await vq('vidiq_job_poll', {mcpJobId:id});
    if(p && p.status === 'completed') return p.result || {};
    if(p && (p.status === 'failed' || p.status === 'expired')) throw {code:'tool_error', message: (p.refunded ? 'Falhou e os créditos voltaram. ' : 'Falhou. ') + (p.errorCode || '')};
    if(onTick) onTick(Math.round((Date.now() - t0)/1000));
  }
  throw {code:'timeout', message:'Demorou demais. Tente de novo.'};
}
/** Gera uma imagem com IA (vidIQ). Sempre pede confirmação: gasta créditos. */
async function vqImage(desc, orient, onTick){
  const cr = await vqCredits();
  if(!await confirmBox('Gerar imagem com IA?', `Usa cerca de 22 créditos do vidIQ${cr != null ? ' (você tem ' + cr + ')' : ''}. Para não gastar nada, use “Ilustração” (desenhada pelo app).`, 'Gerar')) return null;
  const p = await vq('vidiq_generate_thumbnail', {purpose:'image', orientation: orient || 'portrait', userQuery: String(desc).slice(0, 1900) + ' No text, no letters, no logos.'});
  const id = p && p.mcpJobId; if(!id) throw {code:'tool_error', message:'sem id'};
  const res = await vqJob(id, onTick);
  const url = res.imageUrl || res.url; if(!url) throw {code:'tool_error', message:'sem imagem'};
  const blob = await urlToBlob(url);
  return {url, blob};
}

/* ---------- Especialista de anime: cenas ilustradas do zero, imagem com IA e clipe de anime ---------- */
const AN_IMG = {};
function anImgOf(s){
  const k = s.svg ? 'svg:' + s.svg.length + ':' + s.svg.slice(0,60) : s.mid ? 'mid:' + s.mid : null; if(!k) return null;
  if(AN_IMG[k]) return AN_IMG[k].ready ? AN_IMG[k].im : null;
  const o = AN_IMG[k] = {ready:false, im:new Image()};
  o.im.onload = ()=>{ o.ready = true; if(typeof anPaint === 'function') anPaint(); };
  if(s.svg){ const c = svgClean(s.svg, 1080, 1920); if(c) o.im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(c); }
  else IDB.get('an:' + s.mid).then(b=>{ if(b) o.im.src = URL.createObjectURL(b); });
  return null;
}
/* Direção criativa "UAU" do anime: imersão em 2ª pessoa, câmera de cinema, virada e clímax. */
const AN_DIRECAO = `DIREÇÃO CRIATIVA (obrigatória, o objetivo é o espectador dizer UAU e se sentir DENTRO da história):
- Imersão: conte em 2ª pessoa ("você") ou pelos olhos do personagem. Pelo menos 2 cenas em POV (câmera subjetiva: as mãos do espectador em primeiro plano, a plateia/cliente olhando para a câmera, o microfone chegando na mão).
- Abertura in medias res: a 1ª cena já começa no momento de tensão (nada de apresentação), com gancho que gera curiosidade em 1,5 s.
- Sensorial: no "desenho" descreva luz, clima e detalhe físico (coração acelerado, suor na mão, silêncio da sala, holofote, chuva no vidro, reflexo no olho).
- Escala emocional: tensão → queda → virada surpreendente (algo que ninguém espera) → clímax visual épico (câmera baixa, luz estourando, linhas de velocidade) → final que devolve a pergunta ao espectador.
- Cada cena ilustrada tem um "plano" DIFERENTE: pov, close (rosto/olhos), detalhe (mão, relógio, microfone), aberto (cenário grandioso), contra-plongee (heroico, de baixo), plongee (pequeno, de cima), silhueta (contraluz).
- "move" (câmera): avanca (câmera entrando, POV andando), impacto (soco de câmera com tremida, para revelação/virada), recua (revela o cenário grande), respira (tensão, close), gira (desequilíbrio), zoom, pan, sobe.
- "fx" (opcional, 0 ou 1 por cena): velocidade (linhas de velocidade estilo anime, clímax/aceleração), flash (clarão branco na virada), pulso (vinheta vermelha pulsando como coração, nervosismo), brilho (partículas de luz, conquista/inspiração).
- Textos curtos e fortes, como legenda de cinema; deixe a imagem contar. Use o universo de marca (pista, volante, largada, box, bandeira quadriculada) quando encaixar com naturalidade, sem forçar.
- Ritmo: alterne cenas rápidas (2,5–3 s) com uma cena de respiro (5 s) antes do clímax.`;
const AN_DRAW = s => `Direção de arte: ilustração de anime cinematográfica (luz dramática com contraluz/rim light, profundidade em 3 camadas: primeiro plano escuro desfocado, personagem no meio, cenário ao fundo com gradiente atmosférico; perspectiva forte). Plano: ${s.plano || 'escolha o mais impactante'}${s.plano === 'pov' ? ' (câmera subjetiva: mãos do espectador ou objeto em primeiro plano, quem está na cena olha direto para a câmera)' : ''}.${s.fx === 'velocidade' ? ' Composição dinâmica convergindo para o centro.' : ''}`;
function anFx(c, W, H, s, t){
  const T = +s.dur || 4, p = Math.min(1, t / T);
  const v = c.createRadialGradient(W/2, H*0.55, W*0.35, W/2, H*0.55, H*0.75); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)'); c.fillStyle = v; c.fillRect(0, 0, W, H);
  const fx = s.fx || '';
  if(fx === 'velocidade'){ c.save(); c.translate(W/2, H*0.55); const n = 46, f = Math.floor(t*14); for(let i = 0; i < n; i++){ const a = (i / n) * Math.PI * 2 + Math.sin(i*12.9898 + f)*0.05, r0 = H*(0.22 + 0.12*Math.abs(Math.sin(i*78.233 + f))), len = H*(0.35 + 0.3*Math.abs(Math.sin(i*3.7 + f))); c.strokeStyle = `rgba(255,255,255,${0.18 + 0.3*Math.abs(Math.sin(i + f))})`; c.lineWidth = W*0.004*(1 + (i%3)); c.beginPath(); c.moveTo(Math.cos(a)*r0, Math.sin(a)*r0); c.lineTo(Math.cos(a)*(r0+len), Math.sin(a)*(r0+len)); c.stroke(); } c.restore(); }
  if(fx === 'flash'){ const a = Math.max(0, 1 - t/0.45); if(a > 0){ c.fillStyle = `rgba(255,255,255,${a*0.95})`; c.fillRect(0, 0, W, H); } }
  if(fx === 'pulso'){ const b = Math.pow(Math.max(0, Math.sin(t*Math.PI*2.4)), 6); const g = c.createRadialGradient(W/2, H/2, W*0.3, W/2, H/2, H*0.7); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(170,0,20,${0.15 + 0.35*b})`); c.fillStyle = g; c.fillRect(0, 0, W, H); }
  if(fx === 'brilho'){ c.save(); for(let i = 0; i < 40; i++){ const x = (Math.abs(Math.sin(i*91.7))*W + Math.sin(t*0.7 + i)*W*0.03) % W, y = H - ((Math.abs(Math.sin(i*47.3))*H + t*H*0.06*(1 + i%3)) % H), r = W*(0.002 + 0.004*Math.abs(Math.sin(i*5.1))), a = 0.4 + 0.5*Math.abs(Math.sin(t*2 + i)); c.fillStyle = `rgba(255,230,170,${a})`; c.shadowColor = 'rgba(255,200,120,.9)'; c.shadowBlur = r*6; c.beginPath(); c.arc(x, y, r, 0, Math.PI*2); c.fill(); } c.restore(); }
  void p;
}
function anSceneImg(c, W, H, s, t){
  const T = +s.dur || 4, p = Math.min(1, t / T), im = anImgOf(s);
  c.fillStyle = '#0d1020'; c.fillRect(0,0,W,H);
  if(im){
    const mv = s.move || 'zoom'; let z = 1.12, ox = 0, oy = 0, rot = 0, sh = 0;
    if(mv === 'zoom') z = 1.04 + 0.1*p; else if(mv === 'pan') ox = (0.5 - p) * W*0.08; else if(mv === 'sobe') oy = (0.5 - p) * H*0.05;
    else if(mv === 'avanca'){ z = 1.03 + 0.3*AE(p); oy = Math.sin(t*7) * H*0.004; ox = Math.sin(t*3.5) * W*0.004; }
    else if(mv === 'impacto'){ const k = Math.max(0, 1 - t/0.4); z = 1.34 - 0.2*AE(t/0.4) + 0.04*p; sh = k * W*0.025; }
    else if(mv === 'recua') z = 1.36 - 0.24*AE(p); else if(mv === 'respira') z = 1.08 + 0.025*Math.sin(t*2.3) + 0.05*p; else if(mv === 'gira'){ z = 1.2; rot = (p - 0.5) * 0.07; }
    const r = Math.max(W/im.naturalWidth, H/im.naturalHeight) * z, w = im.naturalWidth*r, h = im.naturalHeight*r;
    c.save(); c.translate(W/2 + ox + Math.sin(t*61)*sh, H/2 + oy + Math.cos(t*53)*sh); if(rot) c.rotate(rot); c.drawImage(im, -w/2, -h/2, w, h); c.restore();
    anFx(c, W, H, s, t);
  } else { c.fillStyle = 'rgba(255,255,255,.4)'; c.font = `600 ${W*0.03}px ${SANS}`; c.textAlign = 'center'; c.fillText('Carregando a ilustração…', W/2, H/2); }
  const g = c.createLinearGradient(0, 0, 0, H*0.4); g.addColorStop(0, 'rgba(0,0,0,.65)'); g.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = g; c.fillRect(0, 0, W, H*0.4);
  anTop(c, W, H, s, t, H*0.08);
  if(s.extra){ const a = AE((t - 0.6)/0.5); if(a > 0){ c.save(); c.globalAlpha = a; c.font = `800 ${W*0.045}px ${SANS}`; c.textAlign = 'center'; c.textBaseline = 'middle'; const lines = String(s.extra).split('\n').slice(0,3); lines.forEach((ln, i)=>{ anFitText(c, ln, W*0.86, W*0.045, 800); const tw = Math.min(W*0.9, c.measureText(ln).width + W*0.08), y = H*0.8 + i*W*0.1; c.fillStyle = 'rgba(0,0,0,.6)'; roundRect(c, W/2 - tw/2, y - W*0.045, tw, W*0.09, W*0.02); c.fill(); c.fillStyle = '#fff'; c.fillText(ln, W/2, y); }); c.restore(); } }
}

"ilustra" = cena com ilustração desenhada do zero: escreva em "desenho" uma descrição visual detalhada (personagens, cenário, ação, enquadramento). Use "ilustra" em 3 a 5 cenas para contar a história visualmente; use os outros tipos para ritmo (lista, chat, numero, pergunta, marca).
${AN_DIRECAO}
Regras: 6 a 10 cenas, marca na última. l1 e l2 até 5 palavras cada. dur 2.5 a 5. Use "ilustra" em pelo menos 4 cenas, cada uma com "plano", "move" e, quando fizer sentido, "fx". Não invente números nem depoimentos. Se for sobre a vida do Usuario, use só os fatos da base.
Escolha também: "tema" (${Object.keys(AN_THEMES).join(', ')}), "cor" (hex de destaque), "trilha" (${TRILHAS.map(x=>x.id).join(', ')}), "quem" (m ou f, personagem principal).
PEDIDO: ${prompt.slice(0, 3000)}
Responda SOMENTE JSON {"tema","cor","trilha","quem","cenas":[{"tpl","l1","l2","extra","dur","desenho","plano","move","fx"}]}.`, {modelTier:'complex', cache:false});
    const sc = (r && Array.isArray(r.cenas) ? r.cenas : []).filter(x=>x && (ANS[x.tpl] || x.tpl === 'ilustra')).map(x=>({tpl:x.tpl, l1:String(x.l1||''), l2:String(x.l2||''), extra:String(x.extra||''), dur:Math.max(2.5, Math.min(8, +x.dur || 4)), desenho:x.desenho||'', move:x.move||'zoom', plano:x.plano||'', fx:x.fx||''}));
    if(sc.length < 2) throw 0;
    if(r.tema && AN_THEMES[r.tema]) AN.theme = r.tema; if(/^#[0-9a-f]{6}$/i.test(r.cor||'')) AN.accent = r.cor; if(r.quem === 'f' || r.quem === 'm') AN.who = r.quem;
    AN.scenes = sc; AN.t = 0.8; anList(); anPaint();
    const ils = sc.map((s,i)=>i).filter(i=>sc[i].tpl === 'ilustra');
    for(let k = 0; k < ils.length; k++){
      step(`2/3 Desenhando a cena ${k+1} de ${ils.length}…`);
      const s = AN.scenes[ils[k]];
      try{
        const d = await sample(`Desenhe uma ilustração vetorial em SVG (viewBox "0 0 1080 1920"), estilo anime/flat moderno e consistente com as outras cenas do mesmo vídeo (mesmo personagem: ${AN.who === 'f' ? 'mulher' : 'homem'} adulto, cabelo escuro, roupa social; mesma paleta: tema ${AN_THEMES[AN.theme].name}, destaque ${AN.accent}). ${AN_DRAW(s)} Use gradientes (linearGradient/radialGradient) para luz e atmosfera, sem texto nem letras, sem imagens externas, até 9000 caracteres. Terço de cima mais escuro para o título.
CENA: ${s.desenho || [s.l1, s.l2].join(' ')}
Responda SOMENTE com o SVG.`, {modelTier:'complex', cache:false});
        const svg = svgClean(d && d.text, 1080, 1920); if(svg){ s.svg = svg; anList(); anSeekTo(ils[k]); }
        else s.tpl = 'explica';
      }catch(e){ s.tpl = 'explica'; }
    }
    step('3/3 Colocando a trilha…');
    const tr = TRILHAS.find(x=>x.id === r.trilha) || TRILHAS[0];
    try{ const m = await renderTrilha(tr.id, Math.max(30, anTotal() + 2)); if(AN.music) AN.music.el.pause(); const el = new Audio(m.url); el.loop = true; AN.music = {el, name:tr.name}; }catch(e){}
    anSave(); AN.t = 0; anPaint();
    step(`Pronto: ${AN.scenes.length} cenas, ${ils.length} ilustradas, trilha ${tr.name}. Toque ▶ para ver, toque numa cena para ajustar, e Exportar.`);
    document.querySelectorAll('#anTh .chip2').forEach(x=>x.classList.toggle('on', x.dataset.th === AN.theme));
  }catch(e){ step('Não consegui criar agora. Tente de novo com outras palavras.'); }
  if(go){ go.disabled = false; go.textContent = '🎬 Criar vídeo'; }
}
/** Clipe de anime gerado por IA de vídeo (vidIQ). Caro: confirma antes. */
async function anClipAI(prompt){
  prompt = (prompt||'').trim(); if(!prompt) return toast('Escreva a cena do clipe.');
  const m = await getCap('mcp'); if(!m) return toast(VQ_MSG.no_mcp);
  const cr = await vqCredits();
  if(!await confirmBox('Gerar clipe de anime com IA de vídeo?', `Cria um clipe de 8 segundos em anime (9:16), com movimento de verdade. Custa bem mais créditos do vidIQ que uma imagem${cr != null ? ' (você tem ' + cr + ')' : ''}; o valor exato é cobrado ao enviar e volta se falhar.`, 'Gerar clipe')) return;
  const st = $('anSpSt'); const step = x=>{ if(st) st.textContent = x; };
  try{
    let p = prompt; const sample = await getCap('sample');
    if(sample){ try{ const r = await sample(`Transforme o pedido em um prompt em inglês para um gerador de vídeo (8 segundos, vertical 9:16, estilo anime cinematográfico 2D, alta qualidade). Descreva personagem, cenário, ação contínua, câmera e luz. Sem texto na tela, sem marcas, sem pessoas reais. Até 900 caracteres. Responda só com o prompt.\nPEDIDO: ${prompt}`, {modelTier:'default'}); if(r && r.text) p = r.text.trim(); }catch(e){} }
    step('🎞️ Enviando para a IA de vídeo…');
    const job = await vq('vidiq_generate_video', {prompt: p.slice(0, 3900), model:'minimax-h3', resolution:'768p', duration:8, aspectRatio:'9:16'});
    if(!job || !job.mcpJobId) throw {code:'tool_error', message: job && job.message || 'sem id'};
    const res = await vqJob(job.mcpJobId, s=>step('🎞️ Gerando o clipe… ' + s + 's (leva alguns minutos)'), 900000);
    const url = res.videoUrl || res.url; if(!url) throw {code:'tool_error', message:'sem vídeo'};
    step('Clipe pronto.');
    const blob = await urlToBlob(url);
    if(blob && blob.type.startsWith('video')){ showResult(blob, null, 'anime-ia', true); }
    else { const w = sheet(`<div class="grab"></div><h3>Clipe pronto</h3><video src="${esc(url)}" controls playsinline style="width:100%;border-radius:14px;margin-top:10px"></video><div class="btnrow"><a class="btn primary" href="${esc(url)}" target="_blank" rel="noopener">Abrir e salvar</a><button class="btn" data-x="c">Fechar</button></div>`); w.querySelector('[data-x=c]').onclick = ()=>w.remove(); }
  }catch(e){ step(vqErr(e)); }
}

async function anDrawMissing(step){
  const sample = await getCap('sample'); if(!sample) return 0;
  const ils = AN.scenes.map((s,i)=>i).filter(i=>AN.scenes[i].tpl === 'ilustra' && !AN.scenes[i].svg);
  for(let k = 0; k < ils.length; k++){
    if(step) step(`Desenhando a cena ${k+1} de ${ils.length}…`);

      const d = await sample(`Desenhe uma ilustração vetorial em SVG (viewBox "0 0 1080 1920"), estilo anime/flat moderno e consistente com as outras cenas do mesmo vídeo (mesmo personagem: ${AN.who === 'f' ? 'mulher' : 'homem'} adulto, cabelo escuro, roupa social; mesma paleta: tema ${(AN_THEMES[AN.theme]||{}).name||'noite'}, destaque ${AN.accent}). ${AN_DRAW(s)} Use gradientes (linearGradient/radialGradient) para luz e atmosfera, sem texto nem letras, sem imagens externas, até 9000 caracteres. Terço de cima mais escuro para o título.
CENA: ${s.desenho || [s.l1, s.l2].join(' ')}
Responda SOMENTE com o SVG.`, {modelTier:'complex', cache:false});
      const svg = svgClean(d && d.text, 1080, 1920); if(svg){ s.svg = svg; anList(); anSeekTo(ils[k]); } else s.tpl = 'explica';

"ilustra" = cena desenhada do zero: escreva em "desenho" a descrição visual detalhada (personagem, cenário, ação, enquadramento); use em 3 a 5 cenas. ${AN_DIRECAO}

VÍDEO ATUAL: ${JSON.stringify(AN.scenes.map(s=>({tpl:s.tpl,l1:s.l1,l2:s.l2,extra:s.extra,dur:s.dur,desenho:s.desenho,plano:s.plano,move:s.move,fx:s.fx})))} (tema ${AN.theme}, cor ${AN.accent})
CONVERSA:
${hist}
Responda SOMENTE JSON {"resposta":"o que você diria ao Usuario (2 a 5 frases)","acao":"criar|ajustar|conversar","tema","cor","trilha","quem","cenas":[{"tpl","l1","l2","extra","dur","desenho","plano","move","fx"}],"redesenhar":[números das cenas (1 = primeira) que precisam de novo desenho, quando ajustar]}. Em "conversar", não mande cenas.`, {modelTier:'complex', cache:false});
    AN_CHAT.push({role:'assistant', content: (r && r.resposta) || 'Pronto.'}); anChatPaint();
    if(r && (r.acao === 'criar' || r.acao === 'ajustar') && Array.isArray(r.cenas) && r.cenas.length >= 2){

      const sc = r.cenas.filter(x=>x && (ANS[x.tpl] || x.tpl === 'ilustra')).map((x,i)=>{ const keep = old[i] && old[i].tpl === 'ilustra' && x.tpl === 'ilustra' && r.acao === 'ajustar' && !(r.redesenhar||[]).includes(i+1) && (old[i].desenho||'') === (x.desenho||old[i].desenho||''); return Object.assign({tpl:x.tpl, l1:String(x.l1||''), l2:String(x.l2||''), extra:String(x.extra||''), dur:Math.max(2.5, Math.min(8, +x.dur || 4)), desenho:x.desenho || (keep ? old[i].desenho : ''), move:x.move||'zoom', plano:x.plano||'', fx:x.fx||''}, keep && old[i].svg ? {svg:old[i].svg} : {}); });
      if(r.tema && AN_THEMES[r.tema]) AN.theme = r.tema; if(/^#[0-9a-f]{6}$/i.test(r.cor||'')) AN.accent = r.cor; if(r.quem === 'f' || r.quem === 'm') AN.who = r.quem;
      AN.scenes = sc; AN.t = 0.8; anList(); anPaint();

      anSave(); AN.t = 0; anPaint(); document.querySelectorAll('#anTh .chip2').forEach(x=>x.classList.toggle('on', x.dataset.th === AN.theme));
      step(`${AN.scenes.length} cenas${n ? ', ' + n + ' desenhadas agora' : ''}${AN.music ? ', trilha ' + AN.music.name : ''}. Toque ▶ para ver ou continue pedindo ajustes.`);
    } else step('');
  }catch(e){ AN_CHAT.push({role:'assistant', content:'Não consegui responder agora. Tenta de novo?'}); anChatPaint(); step(''); }
  if(go){ go.disabled = false; go.textContent = 'Enviar'; }

/* Cria um "cenário" = novo look do avatar de foto, mantendo a identidade do Usuario. */

      const it = all.find(l=>l.name === nm);
      if(it && it.status === 'completed'){ HG_LOOKS = null; await done(); stp('✅ Cenário "' + c.label + '" pronto e selecionado. Agora é só gerar o vídeo.'); return; }
      if(it && (it.status === 'failed' || it.error)){ stp('⚠️ O HeyGen não conseguiu criar esse cenário. Tente outro.'); return; }
      stp(`🎬 Criando o cenário no HeyGen… ${Math.round((Date.now() - t0)/1000)}s`);

async function hg(tool, input){ const m = await getCap('mcp'); if(!m) throw {code:'no_mcp'}; const r = await m.callTool('HeyGen', tool, input || {}, {cache:false}); return r && r.payload !== undefined ? r.payload : r; }

function hgErr(e){
  const c = (e && e.code) || '', msg = String((e && (e.message || e.detail || e.error)) || '');
  if(c === 'no_mcp') return 'O clone funciona no app do Claude, com o HeyGen conectado.';
  if(c === 'server_not_connected' || /not.?connected/i.test(msg)) return 'O HeyGen não está conectado. Conecte em Configurações › Conectores do Claude.';
  if(/credit|quota|insufficient|plan_upgrade|upgrade/i.test(msg)) return 'Sem créditos suficientes no HeyGen para este vídeo. Veja o plano/créditos na sua conta HeyGen.';
  if(/denied|permission/i.test(c + msg)) return 'Permissão negada. Toque de novo e permita o HeyGen no app.';

/* ---------- HeyGen Pro: cena de cinema, produção completa, tradução, cortes e limpeza ---------- */
function hgFind(o, f, d){ d = d || 0; if(!o || typeof o !== 'object' || d > 6) return null; if(f(o)) return o; for(const k of Object.keys(o)){ const r = hgFind(o[k], f, d + 1); if(r) return r; } return null; }
function hgObj(p){ if(typeof p === 'string'){ try{ return JSON.parse(p); }catch(e){ return {}; } } return p || {}; }
function hgUrl(p){ p = hgObj(p); const o = hgFind(p, x=>x.video_url || x.download_url || x.output_url || x.url && /^https?:/.test(x.url) && /\.(mp4|mov|webm)|video|resource|files/i.test(x.url)); return o ? (o.captioned_video_url || o.video_url || o.download_url || o.output_url || o.url) : null; }
function hgSt(s){ s = String(s || '').toLowerCase(); if(/complete|success|succeed|done|ready/.test(s)) return 'completed'; if(/fail|error|cancel/.test(s)) return 'failed'; if(/waiting/.test(s)) return 'waiting'; return 'processing'; }
async function hgResolve(v){
  const k = v.kind || 'avatar';
  if(k === 'avatar' || k === 'cinema'){
    let p; try{ p = await hg('get_video', await hgArgs({video_id:v.id})); }catch(e){ if(k !== 'cinema') throw e; p = await hg('get_model_video', await hgArgs({video_id:v.id})); }
    return {status: hgSt(hgPick(p, 'status')), url: hgUrl(p), err: hgPick(p, 'failure_message')};
  }
  if(k === 't2v'){ const p = await hg('get_model_video', await hgArgs({video_id:v.id})); return {status: hgSt(hgPick(p, 'status')), url: hgUrl(p), err: hgPick(p, 'failure_message')}; }
  if(k === 'agent'){
    const p = hgObj(await hg('get_video_agent_session', await hgArgs({session_id:v.id})));
    const st = hgSt(hgPick(p, 'status')), vid = hgPick(p, 'video_id') || (hgFind(p, x=>x.video_id) || {}).video_id, link = (hgFind(p, x=>x.session_url) || {}).session_url;
    if(vid && st === 'completed'){ const q = await hg('get_video', await hgArgs({video_id:vid})); return {status: hgSt(hgPick(q, 'status')), url: hgUrl(q), err: hgPick(q, 'failure_message'), link}; }
    return {status: st === 'completed' ? 'processing' : st, err: hgPick(p, 'failure_message') || hgPick(p, 'error'), link};
  }
  if(k === 'trad'){ const p = await hg('get_video_translation', await hgArgs({video_translation_id:v.id})); return {status: hgSt(hgPick(p, 'status')), url: hgUrl(p), err: hgPick(p, 'failure_message') || hgPick(p, 'message')}; }
  if(k === 'filler'){ const p = await hg('get_filler_word_removal', await hgArgs({filler_word_removal_id:v.id})); return {status: hgSt(hgPick(p, 'status')), url: hgUrl(p), err: hgPick(p, 'failure_message')}; }
  if(k === 'clip'){
    const p = hgObj(await hg('get_ai_clipping', await hgArgs({job_id:v.id})));
    const arr = (hgFind(p, x=>Array.isArray(x.clips)) || {}).clips || [];
    return {status: hgSt(hgPick(p, 'status')), clips: arr.map((c,i)=>({url: hgUrl(c), title: c.title || c.name || ('Corte ' + (i+1)), dur: c.duration})).filter(c=>c.url), err: hgPick(p, 'failure_message')};
  }
  return {status:'failed', err:'Tipo desconhecido'};
}
async function hgWait(v, step, maxMs){
  const t0 = Date.now(); maxMs = maxMs || 30*60*1000;
  while(Date.now() - t0 < maxMs){
    const r = await hgResolve(v);
    if(r.status === 'completed' && (r.url || (r.clips && r.clips.length))) return r;
    if(r.status === 'failed') throw {code:'tool_error', message: r.err || 'O HeyGen não conseguiu concluir.'};
    if(r.status === 'waiting') throw {code:'tool_error', message:'O HeyGen pediu uma escolha. Abra a sessão no app do HeyGen' + (r.link ? ': ' + r.link : '.')};
    if(step) step(`🎬 Processando no HeyGen… ${Math.round((Date.now() - t0)/1000)}s (pode fechar e voltar depois pela lista)`);
    await new Promise(r=>setTimeout(r, 15000));
  }
  throw {code:'timeout', message:'Ainda processando. Volte depois e toque no item da lista.'};
}
function hgAddHist(rec){ const h = hgHist(); h.unshift(rec); hgHistSave(h); }
function hgSetHist(id, patch){ const h = hgHist(); const r = h.find(x=>x.id === id); if(r){ Object.assign(r, patch); hgHistSave(h); } }
/** Botões de salvar/editar para um vídeo pronto (usado em todas as telas do HeyGen). */

/** Envia um vídeo do celular para o HeyGen e devolve o asset_id. */
async function hgUpload(file, step){
  const type = file.type || 'video/mp4', name = file.name || 'video.mp4';
  step && step('⬆️ Preparando o envio…');
  const p = hgObj(await hg('create_asset_upload_batch', await hgArgs({files:[{filename:name, content_type:type, size_bytes:file.size}], title:'App Marca'})));
  const it = hgFind(p, x=>x.upload_url), bo = hgFind(p, x=>x.batch_id), batch = bo ? bo.batch_id : hgPick(p, 'id');
  if(!it) throw {code:'tool_error', message:'O HeyGen não devolveu o endereço de envio.'};
  step && step(`⬆️ Enviando o vídeo (${Math.round(file.size/1048576)} MB)…`);
  let r;
  try{ r = await fetch(it.upload_url, {method: it.method || 'PUT', headers: it.headers || it.upload_headers || {'Content-Type': type}, body: file}); }
  catch(e){ throw {code:'upload', message:'Envio bloqueado pelo navegador do app. Mande o vídeo pelo app do HeyGen ou me envie no chat.'}; }
  if(!r.ok) throw {code:'upload', message:'Falha no envio (' + r.status + ').'};
  await hg('complete_asset_batch', await hgArgs({batch_id:batch}));
  const t0 = Date.now();
  while(Date.now() - t0 < 5*60*1000){
    await new Promise(z=>setTimeout(z, 4000));
    const q = hgObj(await hg('get_asset_batch', await hgArgs({batch_id:batch})));
    const item = hgFind(q, x=>x.status && (x.video_id || x.asset_id));
    if(item && hgSt(item.status) === 'completed') return item.asset_id || item.video_id || it.asset_id;
    if(item && hgSt(item.status) === 'failed') throw {code:'tool_error', message:'O HeyGen não aceitou esse arquivo.'};
    step && step('⬆️ HeyGen processando o envio…');
  }
  throw {code:'timeout', message:'O envio demorou demais.'};
}
function hgPickFile(){ return new Promise(res=>{ const i = document.createElement('input'); i.type = 'file'; i.accept = 'video/*'; i.onchange = ()=>res(i.files && i.files[0] || null); i.click(); }); }
/** Escolhe a origem: um vídeo do clone já pronto (link) ou um vídeo do celular (envio). */
async function hgSource(step){
  const done = hgHist().filter(v=>v.status === 'completed' && v.url);
  const opts = done.slice(0, 12).map((v,i)=>({v:'h' + i, label:((!v.kind || v.kind === 'avatar') ? '🎭 ' : '') + (v.title || 'Vídeo do clone'), sub: new Date(v.at).toLocaleDateString('pt-BR')}));
  opts.unshift({v:'file', label:'📱 Escolher vídeo do celular', sub:'Envia para o HeyGen (palestra, aula, reels gravado)'});
  const c = await pickOne('Qual vídeo?', opts, null); if(!c) return null;
  if(c === 'file'){ const f = await hgPickFile(); if(!f) return null; const id = await hgUpload(f, step); return {src:{type:'asset_id', asset_id:id}, name:f.name}; }
  const v = done[+c.slice(1)]; let url = v.url;
  try{ const r = await hgResolve(v); if(r.url) url = r.url; }catch(e){}
  return {src:{type:'url', url}, name: v.title};
